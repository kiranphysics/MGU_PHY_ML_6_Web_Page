<script id="data" type="application/json">[{"cell_type": "markdown", "source": "# Splitting Data into Training and Testing Sets\n\n**A step-by-step demonstration of data partitioning using the Iris dataset from scikit-learn.**\n\n## Learning objectives\n\nBy the end of this notebook, students should be able to:", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "- Explain the purpose of training and testing subsets.\n- Load a dataset provided by scikit-learn.\n- Separate feature data from the target column.\n- Use `train_test_split()` to create training and testing subsets.\n- Understand the roles of `test_size`, `random_state` and `shuffle`.\n- Compare dimensions and class proportions without fitting a predictive model.\n\n## 1. Introduction\n\nA dataset is often divided into separate subsets before a predictive model is developed.\n\n- **Training data** are used to estimate the model parameters.\n- **Testing data** are held back and used to evaluate the model on observations not used during training.\n\nThe test set should represent unseen observations. It should not be used to choose model parameters or repeatedly guide model development, because doing so can make the final evaluation optimistic.\n\nThis notebook demonstrates only the data-splitting operation. It does **not** train a classifier or any other predictive model.", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 2. Import the required libraries", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "import pandas as pd\nfrom IPython.display import display\nimport matplotlib.pyplot as plt\nfrom sklearn.datasets import load_iris\nfrom sklearn.model_selection import train_test_split", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 3. Load the Iris dataset from scikit-learn\n\nThe Iris dataset contains 150 rows, four numerical feature columns and one target variable. The target is the species code. We use it only to demonstrate how a target column is kept separate during data preparation.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "iris = load_iris(as_frame=True)\nX = iris.data.copy()\ny = iris.target.copy()\n\nprint(\"Feature matrix X:\", X.shape)\nprint(\"Target vector y:\", y.shape)\ndisplay(X.head())\ndisplay(y.head())", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 4. Understand the feature matrix and target vector\n\n`X` contains the input measurements. Its shape is written as `(number of observations, number of features)`. `y` contains one target value for each observation.\n\nThe following check confirms that the feature and target records are aligned and have equal lengths.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "print(\"Number of observations in X:\", len(X))\nprint(\"Number of target values in y:\", len(y))\nprint(\"Feature names:\", list(X.columns))\nprint(\"Target names:\", list(iris.target_names))", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 5. Create training and testing subsets\n\n`train_test_split()` divides arrays or DataFrames into random subsets.\n\nImportant arguments:\n\n- `test_size=0.20`: allocate 20% of observations to the test set.\n- `random_state=42`: make the random split reproducible.\n- `shuffle=True`: shuffle observations before splitting.\n- `stratify=y`: preserve the approximate target proportions in each subset.\n\nFor this dataset, stratification is useful because the target has three species categories. No model is fitted in this exercise.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "X_train, X_test, y_train, y_test = train_test_split(\n    X,\n    y,\n    test_size=0.20,\n    random_state=42,\n    shuffle=True,\n    stratify=y\n)\n\nprint(\"X_train:\", X_train.shape)\nprint(\"X_test :\", X_test.shape)\nprint(\"y_train:\", y_train.shape)\nprint(\"y_test :\", y_test.shape)", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 6. Verify the split proportions\n\nThe training set should contain 80% of the observations and the test set 20%, apart from integer rounding. The following calculations verify the proportions.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "total = len(X)\nprint(f\"Training observations: {len(X_train)} ({len(X_train)/total:.1%})\")\nprint(f\"Testing observations : {len(X_test)} ({len(X_test)/total:.1%})\")\nprint(\"Total after splitting:\", len(X_train) + len(X_test))", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 7. Compare target proportions\n\nStratification aims to preserve the relative frequency of each target category in the training and testing subsets. We compare proportions rather than raw counts because the subsets have different sizes.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "proportions = pd.DataFrame({\n    \"Full dataset\": y.value_counts(normalize=True).sort_index(),\n    \"Training set\": y_train.value_counts(normalize=True).sort_index(),\n    \"Testing set\": y_test.value_counts(normalize=True).sort_index()\n})\nproportions.index = iris.target_names[proportions.index]\ndisplay(proportions)", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 8. Visualise the split\n\nThe diagram below shows the proportion assigned to the training and testing subsets. It represents the allocation of observations, not model performance.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "sizes = [len(X_train), len(X_test)]\nlabels = [\"Training data\", \"Testing data\"]\n\nplt.figure(figsize=(6, 4))\nplt.bar(labels, sizes)\nplt.ylabel(\"Number of observations\")\nplt.title(\"Training and testing data split\")\nfor i, value in enumerate(sizes):\n    plt.text(i, value + 1, str(value), ha=\"center\")\nplt.ylim(0, max(sizes) * 1.15)\nplt.tight_layout()\nplt.show()", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 9. Effect of changing the test size\n\nA smaller test set leaves more observations for training but gives a less precise estimate of generalisation performance. A larger test set provides more observations for evaluation but leaves fewer for model development.\n\nThe code below compares several possible test proportions. Each split is performed independently using the same random seed.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "for fraction in [0.10, 0.20, 0.30, 0.40]:\n    X_tr, X_te, y_tr, y_te = train_test_split(\n        X, y, test_size=fraction, random_state=42, stratify=y\n    )\n    print(\n        f\"Test size={fraction:.0%}: \"\n        f\"train={len(X_tr):3d}, test={len(X_te):3d}\"\n    )", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 10. Why is `random_state` used?\n\nRandom splitting can produce different subsets on different runs. Specifying an integer `random_state` makes the same split reproducible, which is valuable for teaching, debugging and comparing experiments.\n\nTry changing the value of `random_state` and observe how the selected observations change. The number of observations in each subset remains the same when the split parameters are unchanged.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "X_train_a, X_test_a, y_train_a, y_test_a = train_test_split(\n    X, y, test_size=0.20, random_state=7, stratify=y\n)\nprint(\"Same test indices as random_state=42:\",\n      X_test_a.index.equals(X_test.index))\nprint(\"First five test indices (seed 42):\", list(X_test.index[:5]))\nprint(\"First five test indices (seed 7) :\", list(X_test_a.index[:5]))", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 11. Summary\n\n- `X` represents the input features and `y` represents the target.\n- `train_test_split()` separates observations into subsets.\n- `test_size` determines the fraction allocated to testing.\n- `random_state` makes the random split reproducible.\n- `stratify=y` helps preserve target proportions.\n- The test set must remain separate from model fitting and model selection.\n\n## Practice exercises\n\n1. Create a 70:30 training/testing split.\n2. Repeat the split without stratification and compare target proportions.\n3. Change `random_state` and inspect the test indices.\n4. Explain why the test set should not be used to tune model parameters.\n5. Perform the split on another scikit-learn dataset, such as Wine, without training a model.", "attachments": {}, "outputs": []}]</script>

function markdownSource(c){let s=c.source||'';return s.replace(/!\[([^\]]*)\]\(attachment:([^)]+)\)/g,(m,a,n)=>{let x=c.attachments&&c.attachments[n];if(!x)return m;let mime=Object.keys(x)[0];return '<img alt="'+a.replace(/"/g,'&quot;')+'" src="data:'+mime+';base64,'+x[mime]+'">'});}
function addText(parent,t){if(t===undefined||t===null||t==='')return;let p=el('pre');p.textContent=String(t);parent.appendChild(p)}
function savedOutputs(c,out){if(!true||!c.outputs)return;for(let o of c.outputs){if(o.output_type==='stream')addText(out,o.text);else if(o.output_type==='error')addText(out,(o.ename||'Error')+': '+(o.evalue||'')+'\\n'+(o.traceback||[]).join('\\n'));else if(o.data){let d=o.data;if(d['image/png']||d['image/jpeg']){let im=el('img');im.src='data:'+(d['image/png']?'image/png':'image/jpeg')+';base64,'+(d['image/png']||d['image/jpeg']);out.appendChild(im)}else if(d['image/svg+xml']||d['text/html']){let box=el('div','htmlout');box.innerHTML=DOMPurify.sanitize(d['image/svg+xml']||d['text/html']);out.appendChild(box)}else if(d['text/plain'])addText(out,d['text/plain'])}}}
function render(){let n=0;for(let c of cells){if(c.cell_type==='markdown'){let w=el('section','cell markdown');w.innerHTML=DOMPurify.sanitize(marked.parse(markdownSource(c)));root.appendChild(w)}else if(c.cell_type==='code'){n++;let w=el('section','cell code'),h=el('div','codehead'),indicator=el('span','cell-status');indicator.title='Not executed';indicator.setAttribute('aria-label','Not executed');let lab=el('span','label');lab.textContent=true?'Code Cell '+n:'Python';let b=el('button');b.textContent='Run Cell';b.onclick=()=>runCell(w);let cp=el('button','copy-button');cp.textContent='Copy';cp.title='Copy this code cell to the clipboard';cp.onclick=()=>copyCode(w._ed.getValue(),cp);h.append(indicator,lab,b,cp);w.appendChild(h);let host=el('div','editor');w.appendChild(host);let ed=CodeMirror(host,{value:c.source||'',mode:'python',theme:'material-darker',lineNumbers:true,lineWrapping:true,indentUnit:4,tabSize:4,viewportMargin:Infinity,extraKeys:{'Tab':cm=>cm.replaceSelection('    '),'Shift-Enter':()=>runCell(w)}});ed.setSize(null,'auto');requestAnimationFrame(()=>{ed.setSize(null,'auto');ed.refresh()});let r=el('div','running');r.innerHTML='<span class="spin"></span>Python is running. Please wait; this calculation may take some time.';w.appendChild(r);let o=el('div','output');savedOutputs(c,o);w.appendChild(o);w._ed=ed;w._run=b;w._runbar=r;w._out=o;w._indicator=indicator;codeCells.push(w);root.appendChild(w)}}if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise()}
function workerSource(){return `importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');let py=null,ready=false,out='';async function init(pkgs){postMessage({type:'status',text:'Loading Python runtime...'});py=await loadPyodide();for(let p of pkgs){postMessage({type:'status',text:'Loading '+p+'...'});try{await py.loadPackage(p)}catch(e){postMessage({type:'warning',text:'Could not load '+p+': '+e})}}await py.runPythonAsync("import matplotlib\\nmatplotlib.use('Agg', force=True)");py.setStdout({batched:s=>{out+=s+'\\n'}});py.setStderr({batched:s=>{out+=s+'\\n'}});ready=true;postMessage({type:'ready'})}onmessage=async e=>{let m=e.data;if(m.type==='init'){try{await init(m.packages)}catch(x){postMessage({type:'fatal',text:String(x)})}}else if(m.type==='run'){if(!ready){postMessage({type:'result',id:m.id,error:'Python is not ready'});return}out='';try{let value=await py.runPythonAsync(m.code);let result='';if(value!==undefined&&value!==null){try{result=value.toString()}catch(_){}}let imgs='[]';try{imgs=await py.runPythonAsync("import json, base64, io, matplotlib.pyplot as plt\\nfrom io import BytesIO\\n__imgs=[]\\nfor __n in plt.get_fignums():\\n __b=BytesIO(); plt.figure(__n).savefig(__b,format='png',dpi=120,bbox_inches='tight'); __imgs.append(base64.b64encode(__b.getvalue()).decode('ascii'))\\nplt.close('all')\\njson.dumps(__imgs)")}catch(_){}postMessage({type:'result',id:m.id,stdout:out,result:result,images:JSON.parse(imgs)})}catch(x){postMessage({type:'result',id:m.id,stdout:out,error:String(x),images:[]})}}};`}
function startKernel(){if(ready||starting)return;starting=true;document.getElementById('start').disabled=true;status('Starting Python...');let blob=new Blob([workerSource()],{type:'text/javascript'});worker=new Worker(URL.createObjectURL(blob));worker.onmessage=e=>{let m=e.data;if(m.type==='status')status(m.text);else if(m.type==='warning')console.warn(m.text);else if(m.type==='ready'){ready=true;starting=false;status('Python is ready')}else if(m.type==='fatal'){starting=false;document.getElementById('start').disabled=false;status('Python failed to start');alert(m.text)}else if(m.type==='result')finish(m)};worker.onerror=e=>{starting=false;document.getElementById('start').disabled=false;status('Worker error');alert(e.message)};worker.postMessage({type:'init',packages:packages})}
function setCellState(w,state){if(!w._indicator)return;w._indicator.className='cell-status '+state;let label=state==='complete'?'Execution complete':state==='running'?'Execution in progress':state==='error'?'Execution failed':'Not executed';w._indicator.title=label;w._indicator.setAttribute('aria-label',label)}
function runCell(w){if(!ready){alert('Click Start Python and wait until Python is ready.');return Promise.resolve()}let id=++req;setCellState(w,'running');w._run.disabled=true;w._runbar.classList.add('on');status('Python is running...');return new Promise(resolve=>{pending.set(id,{w,resolve});worker.postMessage({type:'run',id,code:w._ed.getValue()})})}
function finish(m){let p=pending.get(m.id);if(!p)return;pending.delete(m.id);let w=p.w,o=w._out;o.innerHTML='<div class="outtitle">Execution output</div>';addText(o,m.stdout);if(m.result)addText(o,m.result);for(let b of (m.images||[])){let im=el('img');im.src='data:image/png;base64,'+b;o.appendChild(im)}if(m.error){let x=el('pre');x.style.color='#ff9b9b';x.textContent=m.error;o.appendChild(x)}if(!m.stdout&&!m.result&&!(m.images||[]).length&&!m.error)addText(o,'Cell executed successfully (no output).');setCellState(w,m.error?'error':'complete');w._run.disabled=false;w._runbar.classList.remove('on');if(!pending.size)status('Python is ready');p.resolve()}
async function runAll(){if(runningAll)return;if(!ready){alert('Start Python first.');return}runningAll=true;document.getElementById('runall').disabled=true;try{for(let w of codeCells)await runCell(w)}finally{runningAll=false;document.getElementById('runall').disabled=false}}
function restartKernel(){if(worker)worker.terminate();worker=null;for(let p of pending.values()){p.w._run.disabled=false;p.w._runbar.classList.remove('on');setCellState(p.w,'not-run');p.resolve()}pending.clear();for(let w of codeCells){w._run.disabled=false;w._runbar.classList.remove('on');setCellState(w,'not-run')}ready=false;starting=false;runningAll=false;document.getElementById('start').disabled=false;document.getElementById('runall').disabled=false;status('Kernel restarted. All cells are marked as not executed. Click Start Python.')}
document.getElementById('runall').style.display=true?'':'none';document.getElementById('restart').style.display=true?'':'none';renderNavigation('top-navigation');renderNavigation('bottom-navigation');status('Python is not started');render();
</script></body></html>
