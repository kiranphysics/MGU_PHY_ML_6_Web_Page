<script id="data" type="application/json">[{"cell_type": "markdown", "source": "# Splitting Data into Training, Validation and Testing Sets\n\n**A step-by-step demonstration of a three-way data split using the Iris dataset from scikit-learn.**\n\n## Learning objectives\n\nBy the end of this notebook, students should be able to:", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "- Explain the distinct purposes of training, validation and testing data.\n- Load a dataset from scikit-learn.\n- Create a 60:20:20 partition using two successive splits.\n- Use stratification to preserve target proportions.\n- Verify subset dimensions and proportions.\n- Understand why the test set must be kept independent of model selection.\n\n## 1. Introduction\n\nIn many machine-learning studies, data are divided into three subsets:\n\n1. **Training set:** used to estimate the parameters of a model.\n2. **Validation set:** used during development to compare models and select settings.\n3. **Testing set:** used at the end to estimate performance on data that have not influenced model development.\n\nThe validation set is important when several model choices or hyperparameter settings are compared. The test set should not be repeatedly consulted during this process.\n\nThis notebook demonstrates only how to create and inspect the three subsets. It does **not** train or classify observations.", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 2. Import the required libraries", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "import pandas as pd\nimport matplotlib.pyplot as plt\nfrom sklearn.datasets import load_iris\nfrom sklearn.model_selection import train_test_split", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 3. Load the Iris dataset\n\nThe Iris dataset contains 150 observations and four numerical measurements per observation. Its target contains three species categories. We retain the target only to demonstrate stratified splitting.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "iris = load_iris(as_frame=True)\nX = iris.data.copy()\ny = iris.target.copy()\n\nprint(\"Feature matrix:\", X.shape)\nprint(\"Target vector:\", y.shape)\nX.head()", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Feature matrix: (150, 4)\nTarget vector: (150,)\n"}, {"output_type": "execute_result", "data": {"text/plain": "   sepal length (cm)  sepal width (cm)  petal length (cm)  petal width (cm)\n0                5.1               3.5                1.4               0.2\n1                4.9               3.0                1.4               0.2\n2                4.7               3.2                1.3               0.2\n3                4.6               3.1                1.5               0.2\n4                5.0               3.6                1.4               0.2", "text/html": "<div>\n<style scoped>\n    .dataframe tbody tr th:only-of-type {\n        vertical-align: middle;\n    }\n\n    .dataframe tbody tr th {\n        vertical-align: top;\n    }\n\n    .dataframe thead th {\n        text-align: right;\n    }\n<\/style>\n<table border=\"1\" class=\"dataframe\">\n  <thead>\n    <tr style=\"text-align: right;\">\n      <th><\/th>\n      <th>sepal length (cm)<\/th>\n      <th>sepal width (cm)<\/th>\n      <th>petal length (cm)<\/th>\n      <th>petal width (cm)<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <th>0<\/th>\n      <td>5.1<\/td>\n      <td>3.5<\/td>\n      <td>1.4<\/td>\n      <td>0.2<\/td>\n    <\/tr>\n    <tr>\n      <th>1<\/th>\n      <td>4.9<\/td>\n      <td>3.0<\/td>\n      <td>1.4<\/td>\n      <td>0.2<\/td>\n    <\/tr>\n    <tr>\n      <th>2<\/th>\n      <td>4.7<\/td>\n      <td>3.2<\/td>\n      <td>1.3<\/td>\n      <td>0.2<\/td>\n    <\/tr>\n    <tr>\n      <th>3<\/th>\n      <td>4.6<\/td>\n      <td>3.1<\/td>\n      <td>1.5<\/td>\n      <td>0.2<\/td>\n    <\/tr>\n    <tr>\n      <th>4<\/th>\n      <td>5.0<\/td>\n      <td>3.6<\/td>\n      <td>1.4<\/td>\n      <td>0.2<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<\/div>"}}]}, {"cell_type": "markdown", "source": "## 4. First split: separate the test set\n\nWe first allocate 20% of the observations to the test set. The remaining 80% is temporarily called the development set; it will later be divided into training and validation data.\n\nThe split is stratified using the target labels so that each subset has approximately the same class proportions as the full dataset.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "X_development, X_test, y_development, y_test = train_test_split(X,y,test_size=0.20,random_state=42,shuffle=True,stratify=y)\nprint(\"Development set:\", X_development.shape)\nprint(\"Test set       :\", X_test.shape)", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Development set: (120, 4)\nTest set       : (30, 4)\n"}]}, {"cell_type": "markdown", "source": "## 5. Second split: separate training and validation sets\n\nThe development set contains 80% of the original observations. We want the final training set to contain 60% of the original data and the validation set 20%.\n\nTherefore, the validation fraction within the 80% development set must be:\n\n$$\n\\frac{0.20}{0.80}=0.25.\n$$\n\nThus, we set `test_size=0.25` in the second split. The variable names `X_train` and `X_validation` make the purpose of the resulting subsets clear.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "X_train, X_validation, y_train, y_validation = train_test_split(\n    X_development,y_development,test_size=0.25,random_state=42,\n    shuffle=True,stratify=y_development\n)\n\nprint(\"Training set  :\", X_train.shape)\nprint(\"Validation set:\", X_validation.shape)\nprint(\"Testing set   :\", X_test.shape)", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Training set  : (90, 4)\nValidation set: (30, 4)\nTesting set   : (30, 4)\n"}]}, {"cell_type": "markdown", "source": "## 6. Verify the final proportions\n\nFor 150 observations, the expected allocation is 90 training observations, 30 validation observations and 30 testing observations. The exact counts depend on the dataset size and rounding.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "total = len(X)\nsummary = pd.DataFrame({\n    \"Subset\": [\"Training\", \"Validation\", \"Testing\"],\n    \"Number of observations\": [len(X_train), len(X_validation), len(X_test)]\n})\nsummary[\"Percentage\"] = 100 * summary[\"Number of observations\"] / total\nsummary\n", "attachments": {}, "outputs": [{"output_type": "execute_result", "data": {"text/plain": "       Subset  Number of observations  Percentage\n0    Training                      90        60.0\n1  Validation                      30        20.0\n2     Testing                      30        20.0", "text/html": "<div>\n<style scoped>\n    .dataframe tbody tr th:only-of-type {\n        vertical-align: middle;\n    }\n\n    .dataframe tbody tr th {\n        vertical-align: top;\n    }\n\n    .dataframe thead th {\n        text-align: right;\n    }\n<\/style>\n<table border=\"1\" class=\"dataframe\">\n  <thead>\n    <tr style=\"text-align: right;\">\n      <th><\/th>\n      <th>Subset<\/th>\n      <th>Number of observations<\/th>\n      <th>Percentage<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <th>0<\/th>\n      <td>Training<\/td>\n      <td>90<\/td>\n      <td>60.0<\/td>\n    <\/tr>\n    <tr>\n      <th>1<\/th>\n      <td>Validation<\/td>\n      <td>30<\/td>\n      <td>20.0<\/td>\n    <\/tr>\n    <tr>\n      <th>2<\/th>\n      <td>Testing<\/td>\n      <td>30<\/td>\n      <td>20.0<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<\/div>"}}]}, {"cell_type": "code", "source": "\nprint(\"Total observations after splitting:\",\n      len(X_train) + len(X_validation) + len(X_test))", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Total observations after splitting: 150\n"}]}, {"cell_type": "markdown", "source": "## 7. Compare target proportions\n\nStratification is applied in both splitting stages. The table compares the relative frequency of each species in the original dataset and in the three resulting subsets.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "proportions = pd.DataFrame({\n    \"Full dataset\": y.value_counts(normalize=True).sort_index(),\n    \"Training\": y_train.value_counts(normalize=True).sort_index(),\n    \"Validation\": y_validation.value_counts(normalize=True).sort_index(),\n    \"Testing\": y_test.value_counts(normalize=True).sort_index()\n})\nproportions.index = iris.target_names[proportions.index]\nproportions", "attachments": {}, "outputs": [{"output_type": "execute_result", "data": {"text/plain": "            Full dataset  Training  Validation   Testing\nsetosa          0.333333  0.333333    0.333333  0.333333\nversicolor      0.333333  0.333333    0.333333  0.333333\nvirginica       0.333333  0.333333    0.333333  0.333333", "text/html": "<div>\n<style scoped>\n    .dataframe tbody tr th:only-of-type {\n        vertical-align: middle;\n    }\n\n    .dataframe tbody tr th {\n        vertical-align: top;\n    }\n\n    .dataframe thead th {\n        text-align: right;\n    }\n<\/style>\n<table border=\"1\" class=\"dataframe\">\n  <thead>\n    <tr style=\"text-align: right;\">\n      <th><\/th>\n      <th>Full dataset<\/th>\n      <th>Training<\/th>\n      <th>Validation<\/th>\n      <th>Testing<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <th>setosa<\/th>\n      <td>0.333333<\/td>\n      <td>0.333333<\/td>\n      <td>0.333333<\/td>\n      <td>0.333333<\/td>\n    <\/tr>\n    <tr>\n      <th>versicolor<\/th>\n      <td>0.333333<\/td>\n      <td>0.333333<\/td>\n      <td>0.333333<\/td>\n      <td>0.333333<\/td>\n    <\/tr>\n    <tr>\n      <th>virginica<\/th>\n      <td>0.333333<\/td>\n      <td>0.333333<\/td>\n      <td>0.333333<\/td>\n      <td>0.333333<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<\/div>"}}]}, {"cell_type": "markdown", "source": "## 8. Visualise the three-way split\n\nThe bar chart displays the number of observations assigned to each subset. It illustrates data allocation only; it does not represent predictive accuracy.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "labels = [\"Training\", \"Validation\", \"Testing\"]\ncounts = [len(X_train), len(X_validation), len(X_test)]\n\nplt.figure(figsize=(7, 4))\nbars = plt.bar(labels, counts)\nplt.ylabel(\"Number of observations\")\nplt.title(\"Training, validation and testing subsets\")\nplt.bar_label(bars)\nplt.tight_layout()\nplt.show()", "attachments": {}, "outputs": [{"output_type": "display_data", "data": {"text/plain": "<Figure size 700x400 with 1 Axes>", "image/png": "iVBORw0KGgoAAAANSUhEUgAAArIAAAGGCAYAAACHemKmAAAAOXRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjYuMiwgaHR0cHM6Ly9tYXRwbG90bGliLm9yZy8o6BhiAAAACXBIWXMAAA9hAAAPYQGoP6dpAABHNklEQVR4nO3dZ3RUVf/28WtCOmkEIaETQicUAdHQhWgoIk0JilIE8a90lHYjJRRD8QYEAW9RARUQaaIoBIgU6b2K1ABBICgloQZIzvOClXkYkkAGJkwGvp+1shZnnz3n/OZkjnO5s2ePyTAMQwAAAICDcbJ3AQAAAMDDIMgCAADAIRFkAQAA4JAIsgAAAHBIBFkAAAA4JIIsAAAAHBJBFgAAAA6JIAsAAACHRJAFAACAQyLIAtlU+/btVbRo0Yd67NChQ2UymWxbUDayevVqmUwmrV692tyW2et1/PhxmUwmzZgxw6Y1FS1aVO3bt7fpMbMbR3mOJpNJQ4cOtXcZj8xkMqlr1672LgPI1giygJVMJlOmfu4OWXgybNiwQUOHDtWlS5fsXUq2de3aNQ0dOjTLX/+//fbbExFWsxte43A0zvYuAHA03333ncX2t99+qxUrVqRpL1OmzCOdZ9q0aUpJSXmox3788cfq37//I53f0TzK9cqsDRs2KDIyUu3bt5efn5/FvoMHD8rJibGBa9euKTIyUpJUt27dLDvPb7/9psmTJ6cbZq9fvy5nZ97eHsb9XuNAdsSdDljprbfestjetGmTVqxYkab9XteuXZOnp2emz+Pi4vJQ9UmSs7PzU/dG/ijXyxbc3Nzsen78f+7u7vYuAcBjwvABkAXq1q2rkJAQbd++XbVr15anp6f+85//SJIWL16sxo0bK3/+/HJzc1NwcLCGDx+u5ORki2PcO+czdW7np59+qi+//FLBwcFyc3PTc889p61bt1o8Nr05sqnz7X766SeFhITIzc1N5cqV07Jly9LUv3r1alWtWlXu7u4KDg7W//73v4eed7tt2zaZTCbNnDkzzb7o6GiZTCYtWbJEknTixAl98MEHKlWqlDw8PJQ7d269/vrrOn78+APPk94c2UuXLql9+/by9f lidation may be used within the development data to make better use of limited observations.", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 10. Summary\n\n- Training data are used for fitting.\n- Validation data support model selection and tuning.\n- Testing data provide a final, independent evaluation.\n- Two successive calls to `train_test_split()` can create the three subsets.\n- For a 60:20:20 split, first reserve 20% for testing, then reserve 25% of the remaining 80% for validation.\n- Stratification helps preserve target proportions.\n\n## Practice exercises\n\n1. Produce a 70:15:15 split using two successive calls.\n2. Derive the second-stage validation fraction mathematically.\n3. Repeat the split without stratification and compare target proportions.\n4. Change the random seed and observe the subset indices.\n5. Explain why the validation set and test set have different roles.", "attachments": {}, "outputs": []}]</script>

function markdownSource(c){let s=c.source||'';return s.replace(/!\[([^\]]*)\]\(attachment:([^)]+)\)/g,(m,a,n)=>{let x=c.attachments&&c.attachments[n];if(!x)return m;let mime=Object.keys(x)[0];return '<img alt="'+a.replace(/"/g,'&quot;')+'" src="data:'+mime+';base64,'+x[mime]+'">'});}
function addText(parent,t){if(t===undefined||t===null||t==='')return;let p=el('pre');p.textContent=String(t);parent.appendChild(p)}
function savedOutputs(c,out){if(!true||!c.outputs)return;for(let o of c.outputs){if(o.output_type==='stream')addText(out,o.text);else if(o.output_type==='error')addText(out,(o.ename||'Error')+': '+(o.evalue||'')+'\\n'+(o.traceback||[]).join('\\n'));else if(o.data){let d=o.data;if(d['image/png']||d['image/jpeg']){let im=el('img');im.src='data:'+(d['image/png']?'image/png':'image/jpeg')+';base64,'+(d['image/png']||d['image/jpeg']);out.appendChild(im)}else if(d['image/svg+xml']||d['text/html']){let box=el('div','htmlout');box.innerHTML=DOMPurify.sanitize(d['image/svg+xml']||d['text/html']);out.appendChild(box)}else if(d['text/plain'])addText(out,d['text/plain'])}}}
function render(){let n=0;for(let c of cells){if(c.cell_type==='markdown'){let w=el('section','cell markdown');w.innerHTML=DOMPurify.sanitize(marked.parse(markdownSource(c)));root.appendChild(w)}else if(c.cell_type==='code'){n++;let w=el('section','cell code'),h=el('div','codehead'),indicator=el('span','cell-status');indicator.title='Not executed';indicator.setAttribute('aria-label','Not executed');let lab=el('span','label');lab.textContent=true?'Code Cell '+n:'Python';let b=el('button');b.textContent='Run Cell';b.onclick=()=>runCell(w);let cp=el('button','copy-button');cp.textContent='Copy';cp.title='Copy this code cell to the clipboard';cp.onclick=()=>copyCode(w._ed.getValue(),cp);h.append(indicator,lab,b,cp);w.appendChild(h);let host=el('div','editor');w.appendChild(host);let ed=CodeMirror(host,{value:c.source||'',mode:'python',theme:'material-darker',lineNumbers:true,lineWrapping:true,indentUnit:4,tabSize:4,viewportMargin:Infinity,extraKeys:{'Tab':cm=>cm.replaceSelection('    '),'Shift-Enter':()=>runCell(w)}});ed.setSize(null,'auto');requestAnimationFrame(()=>{ed.setSize(null,'auto');ed.refresh()});let r=el('div','running');r.innerHTML='<span class="spin"></span>Python is running. Please wait; this calculation may take some time.';w.appendChild(r);let o=el('div','output');savedOutputs(c,o);w.appendChild(o);w._ed=ed;w._run=b;w._runbar=r;w._out=o;w._indicator=indicator;codeCells.push(w);root.appendChild(w)}}if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise()}
function workerSource(){return `importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');let py=null,ready=false,out='';async function init(pkgs){postMessage({type:'status',text:'Loading Python runtime...'});py=await loadPyodide();for(let p of pkgs){postMessage({type:'status',text:'Loading '+p+'...'});try{await py.loadPackage(p)}catch(e){postMessage({type:'warning',text:'Could not load '+p+': '+e})}}await py.runPythonAsync("import matplotlib\\nmatplotlib.use('Agg', force=True)");py.setStdout({batched:s=>{out+=s+'\\n'}});py.setStderr({batched:s=>{out+=s+'\\n'}});ready=true;postMessage({type:'ready'})}onmessage=async e=>{let m=e.data;if(m.type==='init'){try{await init(m.packages)}catch(x){postMessage({type:'fatal',text:String(x)})}}else if(m.type==='run'){if(!ready){postMessage({type:'result',id:m.id,error:'Python is not ready'});return}out='';try{let value=await py.runPythonAsync(m.code);let result='';if(value!==undefined&&value!==null){try{result=value.toString()}catch(_){}}let imgs='[]';try{imgs=await py.runPythonAsync("import json, base64, io, matplotlib.pyplot as plt\\nfrom io import BytesIO\\n__imgs=[]\\nfor __n in plt.get_fignums():\\n __b=BytesIO(); plt.figure(__n).savefig(__b,format='png',dpi=120,bbox_inches='tight'); __imgs.append(base64.b64encode(__b.getvalue()).decode('ascii'))\\nplt.close('all')\\njson.dumps(__imgs)")}catch(_){}postMessage({type:'result',id:m.id,stdout:out,result:result,images:JSON.parse(imgs)})}catch(x){postMessage({type:'result',id:m.id,stdout:out,error:String(x),images:[]})}}};`}
function startKernel(){if(ready||starting)return;starting=true;document.getElementById('start').disabled=true;status('Starting Python...');let blob=new Blob([workerSource()],{type:'text/javascript'});worker=new Worker(URL.createObjectURL(blob));worker.onmessage=e=>{let m=e.data;if(m.type==='status')status(m.text);else if(m.type==='warning')console.warn(m.text);else if(m.type==='ready'){ready=true;starting=false;status('Python is ready')}else if(m.type==='fatal'){starting=false;document.getElementById('start').disabled=false;status('Python failed to start');alert(m.text)}else if(m.type==='result')finish(m)};worker.onerror=e=>{starting=false;document.getElementById('start').disabled=false;status('Worker error');alert(e.message)};worker.postMessage({type:'init',packages:packages})}
function setCellState(w,state){if(!w._indicator)return;w._indicator.className='cell-status '+state;let label=state==='complete'?'Execution complete':state==='running'?'Execution in progress':state==='error'?'Execution failed':'Not executed';w._indicator.title=label;w._indicator.setAttribute('aria-label',label)}
function runCell(w){if(!ready){alert('Click Start Python and wait until Python is ready.');return Promise.resolve()}let id=++req;setCellState(w,'running');w._run.disabled=true;w._runbar.classList.add('on');status('Python is running...');return new Promise(resolve=>{pending.set(id,{w,resolve});worker.postMessage({type:'run',id,code:w._ed.getValue()})})}
function finish(m){let p=pending.get(m.id);if(!p)return;pending.delete(m.id);let w=p.w,o=w._out;o.innerHTML='<div class="outtitle">Execution output</div>';addText(o,m.stdout);if(m.result)addText(o,m.result);for(let b of (m.images||[])){let im=el('img');im.src='data:image/png;base64,'+b;o.appendChild(im)}if(m.error){let x=el('pre');x.style.color='#ff9b9b';x.textContent=m.error;o.appendChild(x)}if(!m.stdout&&!m.result&&!(m.images||[]).length&&!m.error)addText(o,'Cell executed successfully (no output).');setCellState(w,m.error?'error':'complete');w._run.disabled=false;w._runbar.classList.remove('on');if(!pending.size)status('Python is ready');p.resolve()}
async function runAll(){if(runningAll)return;if(!ready){alert('Start Python first.');return}runningAll=true;document.getElementById('runall').disabled=true;try{for(let w of codeCells)await runCell(w)}finally{runningAll=false;document.getElementById('runall').disabled=false}}
function restartKernel(){if(worker)worker.terminate();worker=null;for(let p of pending.values()){p.w._run.disabled=false;p.w._runbar.classList.remove('on');setCellState(p.w,'not-run');p.resolve()}pending.clear();for(let w of codeCells){w._run.disabled=false;w._runbar.classList.remove('on');setCellState(w,'not-run')}ready=false;starting=false;runningAll=false;document.getElementById('start').disabled=false;document.getElementById('runall').disabled=false;status('Kernel restarted. All cells are marked as not executed. Click Start Python.')}
document.getElementById('runall').style.display=true?'':'none';document.getElementById('restart').style.display=true?'':'none';renderNavigation('top-navigation');renderNavigation('bottom-navigation');status('Python is not started');render();
</script></body></html>
