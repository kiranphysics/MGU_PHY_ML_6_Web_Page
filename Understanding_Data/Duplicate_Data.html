<script id="data" type="application/json">[{"cell_type": "markdown", "source": "# Identification and Removal of Duplicate Data\n\n**A practical introduction to duplicate records using the Iris dataset from scikit-learn.**\n\n## Learning objectives\n\nBy the end of this notebook, students should be able to:", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "- Explain what duplicate observations are and why they matter.\n- Load a dataset directly from scikit-learn.\n- Create a controlled set of duplicate rows for demonstration.\n- Detect duplicates using `duplicated()`.\n- Inspect the duplicated records and remove them using `drop_duplicates()`.\n- Verify the cleaned dataset and understand index resetting.\n\n## 1. Introduction\n\nA dataset is a collection of observations (rows) described by variables (columns). A **duplicate observation** is a row that repeats another row according to the columns being compared.\n\nDuplicates can occur when records are entered more than once, when data from multiple sources are combined, or when an export/import process repeats rows. They can distort descriptive statistics and give repeated observations excessive influence in later analyses.\n\nIn this exercise, we use the Iris dataset included in scikit-learn. We deliberately append a small number of existing rows to create duplicates. This is a controlled teaching example: the original Iris observations are not being claimed to contain accidental duplicates.", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 2. Import the required libraries\n\n`pandas` is used to organise the observations in a DataFrame. `load_iris` supplies a small, well-known dataset from scikit-learn. `matplotlib` is used to illustrate the row counts before and after cleaning.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "import pandas as pd\nimport matplotlib.pyplot as plt\nfrom sklearn.datasets import load_iris", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 3. Load a dataset from scikit-learn\n\nThe Iris dataset contains 150 observations. Each observation has four numerical measurements: sepal length, sepal width, petal length and petal width. The target column identifies the Iris species. Here, the target is retained as an ordinary data column; no classification model is constructed in this notebook.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "iris = load_iris(as_frame=True)\ndf_original = iris.data.copy()\ndf_original[\"species\"] = iris.target\n\nprint(\"Original dataset shape:\", df_original.shape)\ndisplay(df_original.head())", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 4. Create duplicate observations\n\nTo demonstrate duplicate detection, select a few existing rows and append them to the dataset. `sample()` selects rows at random using a fixed `random_state`, so the demonstration is reproducible.\n\nThe appended records are exact copies across all columns. Therefore, a full-row duplicate check will identify them.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "duplicate_rows = df_original.sample(n=8, random_state=42)\ndf_with_duplicates = pd.concat(\n    [df_original, duplicate_rows],\n    ignore_index=True\n)\n\nprint(\"Shape after adding duplicate rows:\", df_with_duplicates.shape)\nprint(\"Number of rows deliberately added:\", len(duplicate_rows))\ndisplay(df_with_duplicates.tail(10))", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 5. Identify duplicate rows\n\n`DataFrame.duplicated()` returns a Boolean Series. By default, the first occurrence of a row is marked `False` and each subsequent identical occurrence is marked `True`.\n\n- `keep=\"first\"` (default): marks later repetitions as duplicates.\n- `keep=\"last\"`: marks earlier repetitions as duplicates.\n- `keep=False`: marks every member of a repeated group as a duplicate.\n\nThe `subset` argument can restrict the comparison to selected columns. In this notebook, all columns are used so that complete records are compared.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "duplicate_mask = df_with_duplicates.duplicated()\nprint(\"Number of duplicate rows:\", duplicate_mask.sum())\n\nduplicates_only = df_with_duplicates[duplicate_mask]\ndisplay(duplicates_only)", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 6. Inspect all members of duplicate groups\n\nSometimes it is useful to display both the original record and its repeated copy. Using `keep=False` marks every row belonging to a duplicated group.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "all_duplicate_members = df_with_duplicates[\n    df_with_duplicates.duplicated(keep=False)\n].sort_values(by=list(df_with_duplicates.columns))\n\ndisplay(all_duplicate_members)", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 7. Remove duplicate rows\n\n`drop_duplicates()` returns a DataFrame with repeated rows removed. The first occurrence is retained by default. Setting `ignore_index=True` creates a fresh consecutive index for the resulting DataFrame.\n\nThe operation is assigned to a new variable so that the original, uncleaned dataset remains available for comparison.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "df_clean = df_with_duplicates.drop_duplicates(\n    keep=\"first\",\n    ignore_index=True\n)\n\nprint(\"Shape before removing duplicates:\", df_with_duplicates.shape)\nprint(\"Shape after removing duplicates:\", df_clean.shape)\nprint(\"Duplicates remaining:\", df_clean.duplicated().sum())", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 8. Visual comparison\n\nThe bar chart compares the number of records before and after duplicate removal. The reduction in row count corresponds to the repeated records that were deliberately added.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "counts = [len(df_with_duplicates), len(df_clean)]\nlabels = [\"With duplicates\", \"After cleaning\"]\n\nplt.figure(figsize=(7, 4))\nbars = plt.bar(labels, counts)\nplt.ylabel(\"Number of rows\")\nplt.title(\"Effect of duplicate removal\")\nplt.bar_label(bars)\nplt.tight_layout()\nplt.show()", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 9. Duplicate detection using selected columns\n\nA duplicate definition depends on the question being asked. For example, a database may define a record as repeated when an identification field is repeated, even if another field differs. `subset` allows duplicate detection based on selected columns.\n\nThe example below checks repeated feature measurements only. It is included to demonstrate the syntax; it does not replace a domain-specific decision about which columns uniquely identify a record.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "feature_columns = list(iris.feature_names)\nfeature_duplicate_count = df_with_duplicates.duplicated(\n    subset=feature_columns\n).sum()\n\nprint(\"Repeated feature combinations:\", feature_duplicate_count)", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 10. Summary\n\n- A duplicate is defined relative to the columns used for comparison.\n- `duplicated()` identifies repeated rows and returns a Boolean mask.\n- `duplicated(keep=False)` marks every member of a repeated group.\n- `drop_duplicates()` removes repeated rows.\n- Always inspect the records and decide which columns define a duplicate before deleting data.\n\n## Practice exercises\n\n1. Add 15 duplicate rows instead of 8. Confirm the number detected.\n2. Use `keep=False` and compare the result with the default behaviour.\n3. Detect duplicates using only `[\"sepal length (cm)\", \"sepal width (cm)\"]`.\n4. Remove duplicates without resetting the index. Inspect the index values.\n5. Explain why removing duplicates blindly can be inappropriate when identical measurements may represent two genuinely separate observations.", "attachments": {}, "outputs": []}]</script>

function savedOutputs(c,out){if(!true||!c.outputs)return;for(let o of c.outputs){if(o.output_type==='stream')addText(out,o.text);else if(o.output_type==='error')addText(out,(o.ename||'Error')+': '+(o.evalue||'')+'\\n'+(o.traceback||[]).join('\\n'));else if(o.data){let d=o.data;if(d['image/png']||d['image/jpeg']){let im=el('img');im.src='data:'+(d['image/png']?'image/png':'image/jpeg')+';base64,'+(d['image/png']||d['image/jpeg']);out.appendChild(im)}else if(d['image/svg+xml']||d['text/html']){let box=el('div','htmlout');box.innerHTML=DOMPurify.sanitize(d['image/svg+xml']||d['text/html']);out.appendChild(box)}else if(d['text/plain'])addText(out,d['text/plain'])}}}
function render(){let n=0;for(let c of cells){if(c.cell_type==='markdown'){let w=el('section','cell markdown');w.innerHTML=DOMPurify.sanitize(marked.parse(markdownSource(c)));root.appendChild(w)}else if(c.cell_type==='code'){n++;let w=el('section','cell code'),h=el('div','codehead'),indicator=el('span','cell-status');indicator.title='Not executed';indicator.setAttribute('aria-label','Not executed');let lab=el('span','label');lab.textContent=true?'Code Cell '+n:'Python';let b=el('button');b.textContent='Run Cell';b.onclick=()=>runCell(w);let cp=el('button','copy-button');cp.textContent='Copy';cp.title='Copy this code cell to the clipboard';cp.onclick=()=>copyCode(w._ed.getValue(),cp);h.append(indicator,lab,b,cp);w.appendChild(h);let host=el('div','editor');w.appendChild(host);let ed=CodeMirror(host,{value:c.source||'',mode:'python',theme:'material-darker',lineNumbers:true,lineWrapping:true,indentUnit:4,tabSize:4,viewportMargin:Infinity,extraKeys:{'Tab':cm=>cm.replaceSelection('    '),'Shift-Enter':()=>runCell(w)}});ed.setSize(null,'auto');requestAnimationFrame(()=>{ed.setSize(null,'auto');ed.refresh()});let r=el('div','running');r.innerHTML='<span class="spin"></span>Python is running. Please wait; this calculation may take some time.';w.appendChild(r);let o=el('div','output');savedOutputs(c,o);w.appendChild(o);w._ed=ed;w._run=b;w._runbar=r;w._out=o;w._indicator=indicator;codeCells.push(w);root.appendChild(w)}}if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise()}
function workerSource(){return `importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');let py=null,ready=false,out='';async function init(pkgs){postMessage({type:'status',text:'Loading Python runtime...'});py=await loadPyodide();for(let p of pkgs){postMessage({type:'status',text:'Loading '+p+'...'});try{await py.loadPackage(p)}catch(e){postMessage({type:'warning',text:'Could not load '+p+': '+e})}}await py.runPythonAsync("import matplotlib\\nmatplotlib.use('Agg', force=True)");py.setStdout({batched:s=>{out+=s+'\\n'}});py.setStderr({batched:s=>{out+=s+'\\n'}});ready=true;postMessage({type:'ready'})}onmessage=async e=>{let m=e.data;if(m.type==='init'){try{await init(m.packages)}catch(x){postMessage({type:'fatal',text:String(x)})}}else if(m.type==='run'){if(!ready){postMessage({type:'result',id:m.id,error:'Python is not ready'});return}out='';try{let value=await py.runPythonAsync(m.code);let result='';if(value!==undefined&&value!==null){try{result=value.toString()}catch(_){}}let imgs='[]';try{imgs=await py.runPythonAsync("import json, base64, io, matplotlib.pyplot as plt\\nfrom io import BytesIO\\n__imgs=[]\\nfor __n in plt.get_fignums():\\n __b=BytesIO(); plt.figure(__n).savefig(__b,format='png',dpi=120,bbox_inches='tight'); __imgs.append(base64.b64encode(__b.getvalue()).decode('ascii'))\\nplt.close('all')\\njson.dumps(__imgs)")}catch(_){}postMessage({type:'result',id:m.id,stdout:out,result:result,images:JSON.parse(imgs)})}catch(x){postMessage({type:'result',id:m.id,stdout:out,error:String(x),images:[]})}}};`}
function startKernel(){if(ready||starting)return;starting=true;document.getElementById('start').disabled=true;status('Starting Python...');let blob=new Blob([workerSource()],{type:'text/javascript'});worker=new Worker(URL.createObjectURL(blob));worker.onmessage=e=>{let m=e.data;if(m.type==='status')status(m.text);else if(m.type==='warning')console.warn(m.text);else if(m.type==='ready'){ready=true;starting=false;status('Python is ready')}else if(m.type==='fatal'){starting=false;document.getElementById('start').disabled=false;status('Python failed to start');alert(m.text)}else if(m.type==='result')finish(m)};worker.onerror=e=>{starting=false;document.getElementById('start').disabled=false;status('Worker error');alert(e.message)};worker.postMessage({type:'init',packages:packages})}
function setCellState(w,state){if(!w._indicator)return;w._indicator.className='cell-status '+state;let label=state==='complete'?'Execution complete':state==='running'?'Execution in progress':state==='error'?'Execution failed':'Not executed';w._indicator.title=label;w._indicator.setAttribute('aria-label',label)}
function runCell(w){if(!ready){alert('Click Start Python and wait until Python is ready.');return Promise.resolve()}let id=++req;setCellState(w,'running');w._run.disabled=true;w._runbar.classList.add('on');status('Python is running...');return new Promise(resolve=>{pending.set(id,{w,resolve});worker.postMessage({type:'run',id,code:w._ed.getValue()})})}
function finish(m){let p=pending.get(m.id);if(!p)return;pending.delete(m.id);let w=p.w,o=w._out;o.innerHTML='<div class="outtitle">Execution output</div>';addText(o,m.stdout);if(m.result)addText(o,m.result);for(let b of (m.images||[])){let im=el('img');im.src='data:image/png;base64,'+b;o.appendChild(im)}if(m.error){let x=el('pre');x.style.color='#ff9b9b';x.textContent=m.error;o.appendChild(x)}if(!m.stdout&&!m.result&&!(m.images||[]).length&&!m.error)addText(o,'Cell executed successfully (no output).');setCellState(w,m.error?'error':'complete');w._run.disabled=false;w._runbar.classList.remove('on');if(!pending.size)status('Python is ready');p.resolve()}
async function runAll(){if(runningAll)return;if(!ready){alert('Start Python first.');return}runningAll=true;document.getElementById('runall').disabled=true;try{for(let w of codeCells)await runCell(w)}finally{runningAll=false;document.getElementById('runall').disabled=false}}
function restartKernel(){if(worker)worker.terminate();worker=null;for(let p of pending.values()){p.w._run.disabled=false;p.w._runbar.classList.remove('on');setCellState(p.w,'not-run');p.resolve()}pending.clear();for(let w of codeCells){w._run.disabled=false;w._runbar.classList.remove('on');setCellState(w,'not-run')}ready=false;starting=false;runningAll=false;document.getElementById('start').disabled=false;document.getElementById('runall').disabled=false;status('Kernel restarted. All cells are marked as not executed. Click Start Python.')}
document.getElementById('runall').style.display=true?'':'none';document.getElementById('restart').style.display=true?'':'none';renderNavigation('top-navigation');renderNavigation('bottom-navigation');status('Python is not started');render();
</script></body></html>
