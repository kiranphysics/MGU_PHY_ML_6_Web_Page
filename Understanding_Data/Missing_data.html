<script id="data" type="application/json">[{"cell_type": "markdown", "source": "# Identification and Treatment of Missing Data\n\n**A practical introduction to missing values using the Breast Cancer Wisconsin dataset from scikit-learn.**\n\n## Learning objectives\n\nBy the end of this notebook, students should be able to:", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "- Explain missing observations and common missing-data representations.\n- Load a dataset from scikit-learn and convert it into a DataFrame.\n- Deliberately introduce missing values for demonstration.\n- Detect and count missing values by column and row.\n- Visualise the distribution of missing values.\n- Demonstrate deletion and simple imputation, and understand their implications.\n\n## 1. Introduction\n\nMissing data occur when a value that should have been recorded is unavailable. A value may be missing because a measurement was not taken, a participant did not respond, a sensor failed, or data were lost during transfer.\n\nIn Pandas, missing numerical values are commonly represented by `NaN`. Missing values must be identified before many statistical calculations and machine-learning procedures can be performed.\n\nThis notebook uses the Breast Cancer Wisconsin dataset included in scikit-learn. The original dataset is complete for the selected numerical features. We deliberately insert a small number of missing values to practise detection and treatment. These inserted missing values are for teaching and are not a claim about the original dataset.", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 2. Import libraries", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom sklearn.datasets import load_breast_cancer", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 3. Load the dataset\n\nThe dataset contains numerical measurements computed from digitised images of breast mass cell nuclei. The target is included as a descriptive column for completeness. This notebook focuses on data quality, not on building a classifier.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "data = load_breast_cancer(as_frame=True)\ndf_original = data.data.copy()\ndf_original[\"target\"] = data.target\n\nprint(\"Dataset shape:\", df_original.shape)\ndf_original.head()", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 4. Introduce missing values\n\nWe create a copy of the original DataFrame and replace selected cells in a few measurement columns with `NaN`. A fixed random seed makes the exercise reproducible.\n\nThe missing values are introduced only into feature columns. The target column is left unchanged so that the example concentrates on missing feature measurements.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "df_missing = df_original.copy()\nrng = np.random.default_rng(42)\n\nfeature_columns = list(data.feature_names)\ncolumns_to_corrupt = feature_columns[:5]\n\nfor column in columns_to_corrupt:\n    selected_rows = rng.choice(df_missing.index, size=12, replace=False)\n    df_missing.loc[selected_rows, column] = np.nan\n\nprint(\"Shape:\", df_missing.shape)\ndf_missing[columns_to_corrupt].head(12)", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 5. Detect missing values\n\n`isna()` (equivalent to `isnull()`) returns `True` wherever a value is missing. Summing the Boolean values counts the missing entries because `True` is treated as 1 and `False` as 0.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "missing_by_column = df_missing.isna().sum()\nprint(\"Missing values in each column:\")\nmissing_by_column[missing_by_column > 0].sort_values(ascending=False)", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "print(\"Total missing cells:\", df_missing.isna().sum().sum())", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 6. Calculate the percentage of missing values\n\nCounts are useful, but percentages make columns of different sizes easier to compare. The percentage is calculated as the number of missing values divided by the total number of rows, multiplied by 100.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "missing_percentage = (df_missing.isna().sum() / len(df_missing)) * 100\nmissing_summary = pd.DataFrame({\n    \"Missing count\": df_missing.isna().sum(),\n    \"Missing percentage\": missing_percentage\n})\nmissing_summary[missing_summary[\"Missing count\"] > 0]", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 7. Find rows containing missing values\n\n`isna().any(axis=1)` checks each row and returns `True` if at least one column in that row contains a missing value. This helps inspect incomplete observations.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "rows_with_missing = df_missing[df_missing.isna().any(axis=1)]\nprint(\"Rows containing at least one missing value:\", len(rows_with_missing))\nrows_with_missing.head()", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 8. Visualise missing values\n\nThe bar chart displays the number of missing cells in each feature column. A visual summary can quickly reveal which variables require attention.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "missing_counts = df_missing[feature_columns].isna().sum()\nmissing_counts = missing_counts[missing_counts > 0]\n\nplt.figure(figsize=(9, 4))\nmissing_counts.sort_values(ascending=False).plot(kind=\"bar\")\nplt.ylabel(\"Number of missing values\")\nplt.title(\"Missing values by feature\")\nplt.xticks(rotation=45, ha=\"right\")\nplt.tight_layout()\nplt.show()", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 9. Option A: Remove incomplete rows\n\n`dropna()` removes rows containing missing values. This is simple, but it can discard a substantial amount of information, especially when many columns have missing values.\n\nThe example uses a separate DataFrame so that the data before deletion remain available.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "df_drop_rows = df_missing.dropna()\nprint(\"Rows before deletion:\", len(df_missing))\nprint(\"Rows after deletion:\", len(df_drop_rows))\nprint(\"Missing cells after deletion:\", df_drop_rows.isna().sum().sum())", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 10. Option B: Remove columns with missing values\n\n`dropna(axis=1)` removes columns that contain at least one missing value. This is generally too aggressive for many real datasets, but it demonstrates the meaning of `axis=1`.\n\nA more selective rule can be used with `thresh`, which specifies the minimum number of non-missing values required.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "df_drop_columns = df_missing.dropna(axis=1)\nprint(\"Original number of columns:\", df_missing.shape[1])\nprint(\"Columns after dropping incomplete columns:\", df_drop_columns.shape[1])\n\n# Keep columns having at least 95% non-missing observations\nminimum_non_missing = int(0.95 * len(df_missing))\ndf_threshold = df_missing.dropna(axis=1, thresh=minimum_non_missing)\nprint(\"Columns retained with the 95% completeness rule:\", df_threshold.shape[1])", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 11. Option C: Impute missing values\n\nImputation replaces a missing value with an estimated or selected value. For numerical data, common simple choices are:\n\n- **Mean:** arithmetic average; sensitive to extreme values.\n- **Median:** middle value; more robust to extreme values.\n- **Constant:** a fixed value chosen for a specific reason.\n\nHere, median imputation is demonstrated for the feature columns. The median is calculated separately for each column. The target is not imputed.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "df_imputed = df_missing.copy()\nmedians = df_imputed[feature_columns].median()\n\ndf_imputed[feature_columns] = df_imputed[feature_columns].fillna(medians)\n\nprint(\"Missing values before imputation:\", df_missing[feature_columns].isna().sum().sum())\nprint(\"Missing values after imputation:\", df_imputed[feature_columns].isna().sum().sum())\ndf_imputed[columns_to_corrupt].head()", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 12. Compare the original, incomplete and imputed data\n\nThe table below compares selected descriptive statistics. Imputation changes the distribution of a variable, so the choice of method should be justified and documented.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "comparison = pd.DataFrame({\n    \"Original mean\": df_original[columns_to_corrupt].mean(),\n    \"With missing values mean\": df_missing[columns_to_corrupt].mean(),\n    \"After median imputation mean\": df_imputed[columns_to_corrupt].mean(),\n    \"Original median\": df_original[columns_to_corrupt].median(),\n    \"After imputation median\": df_imputed[columns_to_corrupt].median()\n})\ncomparison", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 13. Important note about data leakage\n\nWhen missing values are imputed for a predictive modelling task, imputation values should be estimated from the training data only and then applied to validation/test data. Calculating the median from the entire dataset before splitting can allow information from the test set to influence preprocessing.\n\nThis notebook is a data-manipulation lesson, so the median operation is shown on the full teaching dataset to make the operation transparent. In a later modelling workflow, perform the split first and calculate imputation statistics from the training set only.\n\n## Summary\n\n- `isna()` identifies missing values.\n- `sum()` counts missing values by column or across the whole DataFrame.\n- `dropna()` removes incomplete rows or columns.\n- `fillna()` replaces missing values.\n- Imputation preserves rows but changes the data; deletion removes information.\n- The appropriate treatment depends on why values are missing and on the analysis.\n\n## Practice exercises\n\n1. Introduce missing values into ten different feature columns.\n2. Calculate the percentage of missing values in every column.\n3. Compare mean and median imputation.\n4. Use `dropna(subset=[...])` to remove rows missing values in only two selected columns.\n5. Explain why imputing before a train/test split can cause data leakage in a predictive modelling workflow.", "attachments": {}, "outputs": []}]</script>

function addText(parent,t){if(t===undefined||t===null||t==='')return;let p=el('pre');p.textContent=String(t);parent.appendChild(p)}
function savedOutputs(c,out){if(!true||!c.outputs)return;for(let o of c.outputs){if(o.output_type==='stream')addText(out,o.text);else if(o.output_type==='error')addText(out,(o.ename||'Error')+': '+(o.evalue||'')+'\\n'+(o.traceback||[]).join('\\n'));else if(o.data){let d=o.data;if(d['image/png']||d['image/jpeg']){let im=el('img');im.src='data:'+(d['image/png']?'image/png':'image/jpeg')+';base64,'+(d['image/png']||d['image/jpeg']);out.appendChild(im)}else if(d['image/svg+xml']||d['text/html']){let box=el('div','htmlout');box.innerHTML=DOMPurify.sanitize(d['image/svg+xml']||d['text/html']);out.appendChild(box)}else if(d['text/plain'])addText(out,d['text/plain'])}}}
function render(){let n=0;for(let c of cells){if(c.cell_type==='markdown'){let w=el('section','cell markdown');w.innerHTML=DOMPurify.sanitize(marked.parse(markdownSource(c)));root.appendChild(w)}else if(c.cell_type==='code'){n++;let w=el('section','cell code'),h=el('div','codehead'),indicator=el('span','cell-status');indicator.title='Not executed';indicator.setAttribute('aria-label','Not executed');let lab=el('span','label');lab.textContent=true?'Code Cell '+n:'Python';let b=el('button');b.textContent='Run Cell';b.onclick=()=>runCell(w);let cp=el('button','copy-button');cp.textContent='Copy';cp.title='Copy this code cell to the clipboard';cp.onclick=()=>copyCode(w._ed.getValue(),cp);h.append(indicator,lab,b,cp);w.appendChild(h);let host=el('div','editor');w.appendChild(host);let ed=CodeMirror(host,{value:c.source||'',mode:'python',theme:'material-darker',lineNumbers:true,lineWrapping:true,indentUnit:4,tabSize:4,viewportMargin:Infinity,extraKeys:{'Tab':cm=>cm.replaceSelection('    '),'Shift-Enter':()=>runCell(w)}});ed.setSize(null,'auto');requestAnimationFrame(()=>{ed.setSize(null,'auto');ed.refresh()});let r=el('div','running');r.innerHTML='<span class="spin"></span>Python is running. Please wait; this calculation may take some time.';w.appendChild(r);let o=el('div','output');savedOutputs(c,o);w.appendChild(o);w._ed=ed;w._run=b;w._runbar=r;w._out=o;w._indicator=indicator;codeCells.push(w);root.appendChild(w)}}if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise()}
function workerSource(){return `importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');let py=null,ready=false,out='';async function init(pkgs){postMessage({type:'status',text:'Loading Python runtime...'});py=await loadPyodide();for(let p of pkgs){postMessage({type:'status',text:'Loading '+p+'...'});try{await py.loadPackage(p)}catch(e){postMessage({type:'warning',text:'Could not load '+p+': '+e})}}await py.runPythonAsync("import matplotlib\\nmatplotlib.use('Agg', force=True)");py.setStdout({batched:s=>{out+=s+'\\n'}});py.setStderr({batched:s=>{out+=s+'\\n'}});ready=true;postMessage({type:'ready'})}onmessage=async e=>{let m=e.data;if(m.type==='init'){try{await init(m.packages)}catch(x){postMessage({type:'fatal',text:String(x)})}}else if(m.type==='run'){if(!ready){postMessage({type:'result',id:m.id,error:'Python is not ready'});return}out='';try{let value=await py.runPythonAsync(m.code);let result='';if(value!==undefined&&value!==null){try{result=value.toString()}catch(_){}}let imgs='[]';try{imgs=await py.runPythonAsync("import json, base64, io, matplotlib.pyplot as plt\\nfrom io import BytesIO\\n__imgs=[]\\nfor __n in plt.get_fignums():\\n __b=BytesIO(); plt.figure(__n).savefig(__b,format='png',dpi=120,bbox_inches='tight'); __imgs.append(base64.b64encode(__b.getvalue()).decode('ascii'))\\nplt.close('all')\\njson.dumps(__imgs)")}catch(_){}postMessage({type:'result',id:m.id,stdout:out,result:result,images:JSON.parse(imgs)})}catch(x){postMessage({type:'result',id:m.id,stdout:out,error:String(x),images:[]})}}};`}
function startKernel(){if(ready||starting)return;starting=true;document.getElementById('start').disabled=true;status('Starting Python...');let blob=new Blob([workerSource()],{type:'text/javascript'});worker=new Worker(URL.createObjectURL(blob));worker.onmessage=e=>{let m=e.data;if(m.type==='status')status(m.text);else if(m.type==='warning')console.warn(m.text);else if(m.type==='ready'){ready=true;starting=false;status('Python is ready')}else if(m.type==='fatal'){starting=false;document.getElementById('start').disabled=false;status('Python failed to start');alert(m.text)}else if(m.type==='result')finish(m)};worker.onerror=e=>{starting=false;document.getElementById('start').disabled=false;status('Worker error');alert(e.message)};worker.postMessage({type:'init',packages:packages})}
function setCellState(w,state){if(!w._indicator)return;w._indicator.className='cell-status '+state;let label=state==='complete'?'Execution complete':state==='running'?'Execution in progress':state==='error'?'Execution failed':'Not executed';w._indicator.title=label;w._indicator.setAttribute('aria-label',label)}
function runCell(w){if(!ready){alert('Click Start Python and wait until Python is ready.');return Promise.resolve()}let id=++req;setCellState(w,'running');w._run.disabled=true;w._runbar.classList.add('on');status('Python is running...');return new Promise(resolve=>{pending.set(id,{w,resolve});worker.postMessage({type:'run',id,code:w._ed.getValue()})})}
function finish(m){let p=pending.get(m.id);if(!p)return;pending.delete(m.id);let w=p.w,o=w._out;o.innerHTML='<div class="outtitle">Execution output</div>';addText(o,m.stdout);if(m.result)addText(o,m.result);for(let b of (m.images||[])){let im=el('img');im.src='data:image/png;base64,'+b;o.appendChild(im)}if(m.error){let x=el('pre');x.style.color='#ff9b9b';x.textContent=m.error;o.appendChild(x)}if(!m.stdout&&!m.result&&!(m.images||[]).length&&!m.error)addText(o,'Cell executed successfully (no output).');setCellState(w,m.error?'error':'complete');w._run.disabled=false;w._runbar.classList.remove('on');if(!pending.size)status('Python is ready');p.resolve()}
async function runAll(){if(runningAll)return;if(!ready){alert('Start Python first.');return}runningAll=true;document.getElementById('runall').disabled=true;try{for(let w of codeCells)await runCell(w)}finally{runningAll=false;document.getElementById('runall').disabled=false}}
function restartKernel(){if(worker)worker.terminate();worker=null;for(let p of pending.values()){p.w._run.disabled=false;p.w._runbar.classList.remove('on');setCellState(p.w,'not-run');p.resolve()}pending.clear();for(let w of codeCells){w._run.disabled=false;w._runbar.classList.remove('on');setCellState(w,'not-run')}ready=false;starting=false;runningAll=false;document.getElementById('start').disabled=false;document.getElementById('runall').disabled=false;status('Kernel restarted. All cells are marked as not executed. Click Start Python.')}
document.getElementById('runall').style.display=true?'':'none';document.getElementById('restart').style.display=true?'':'none';renderNavigation('top-navigation');renderNavigation('bottom-navigation');status('Python is not started');render();
</script></body></html>
