<script id="data" type="application/json">[{"cell_type": "markdown", "source": "# Introduction: Feature Selection with Wrapper Methods\n\n**Data.** Machine learning data is a table. Each **row** is one example, each **column** is a measurement called a **feature**, and one special column, the **target** (label), is the answer we want to predict.\n\n**Feature selection** means keeping only the *useful* features and leaving out the others.\n\n**Why do we need it?**\n1. **Simpler model:** fewer features are easier to understand.\n2. **Faster work:** less data means less computing time.\n3. **Less noise:** useless features can confuse the model and reduce accuracy.\n4. **Better insight:** we learn which measurements really matter.\n\n**Three families of methods**\n\n| Family | Main idea |\n|---|---|\n| Filter methods | Score each feature (for example, by correlation) *without* a model and keep the best scores. |\n| **Wrapper methods** | Try different groups of features, train a model on each group, and keep the best group. **(This notebook)** |\n| Embedded methods | The model selects features by itself while it learns. |\n\n**Wrapper methods.** The selection is *wrapped* around a machine learning model, and the model is the judge: a group of features is good if the model performs well using only that group. The figure shows the idea.\n\n![Block diagram of a wrapper method](attachment:wrapper_block_diagram.png)\n\n<details>\n<summary>LaTeX (TikZ) source of the block diagram<\/summary>\n\n```latex\n% Preamble:  \\usepackage{tikz}\n%            \\usetikzlibrary{arrows.meta, positioning, shapes.geometric, calc}\n\\begin{tikzpicture}[node distance=1.0cm and 1.4cm,\n    box/.style={rectangle, draw, rounded corners, minimum width=2.7cm, minimum height=1.1cm, align=center, fill=blue!8},\n    dec/.style={diamond, draw, aspect=2, align=center, fill=yellow!20, inner sep=1pt},\n    arr/.style={-{Stealth[length=2.5mm]}, thick}]\n\\node[box] (a) {All features};\n\\node[box, right=of a] (b) {Choose a\\\\subset of features};\n\\node[box, right=of b] (c) {Train the model\\\\on this subset};\n\\node[box, below=of c] (d) {Measure score\\\\(accuracy)};\n\\node[dec, left=of d] (e) {Good\\\\enough?};\n\\node[box, left=of e, fill=green!15] (f) {Final\\\\features};\n\\draw[arr] (a)--(b);\n\\draw[arr] (b)--(c);\n\\draw[arr] (c)--(d);\n\\draw[arr] (d)--(e);\n\\draw[arr] (e)--node[above]{Yes}(f);\n\\draw[arr] (e) |- node[pos=0.2, left]{No} ($(b.south)+(0,-0.55)$) -- (b.south);\n\\end{tikzpicture}\n```\n\n<\/details>\n\n**The problem and the score.** With $n$ features there are $2^{n}-1$ possible subsets, far too many to test, so we use step-by-step (*greedy*) methods. A subset is judged by its **cross-validation accuracy**: the training data is split into 5 parts, the model is trained on 4 parts and tested on the remaining part, this is repeated 5 times, and the accuracies are averaged.\n\n## Forward Selection\n**Idea.** Start with *no features* and add one feature at a time. At each step, add the feature that improves the score the most. (**Backward Elimination** is the reverse: start with all features and remove the least useful one at each step.)\n\n**Algorithm**\n1. Start with an empty set $S=\\{\\,\\}$.\n2. For every feature $f$ not in $S$, train the model using $S\\cup\\{f\\}$ and find its score.\n3. Add the feature with the highest score to $S$.\n4. Repeat steps 2 and 3.\n5. Stop when $S$ has $k$ features (chosen by us), or when adding a feature no longer improves the score.\n\n**Flow chart**\n\n![Flow chart of Forward Selection](attachment:forward_selection_flow_chart.png)\n\n<details>\n<summary>LaTeX (TikZ) source of the flow chart<\/summary>\n\n```latex\n% Preamble:  \\usepackage{tikz}\n%            \\usetikzlibrary{arrows.meta, positioning, shapes.geometric, calc}\n\\begin{tikzpicture}[node distance=0.8cm,\n    box/.style={rectangle, draw, rounded corners, minimum width=6.2cm, minimum height=0.9cm, align=center, fill=blue!8},\n    dec/.style={dia n2fRQ4zpv5Pw8HAvL++UlCK4uQCDGzfC/f3X5uTk9LG/rE96CHvaPL09Xxa9hKcNwFhisURHTefggYNQFaCKQAkBvx1zc3N5+ZFBQfuhKgCEUHV1lZqaxHe12PuqhxBCk8wnteJaQ8JDRMRFoK7ZmZbmln9c/ol/EV9cVAwfGFBFoISAwQDWj7Fz58ElS1zhdrM5hYX5CxfOnDTJ9MCBA33f6zviDz15/GS4+HADCYN74fegutmWhOiEyYqTWytb01LTwOiwA3/WuCIYJ8S2iIuL5+XlhYefmDRpTGFhPlQI27bfTp4M09GRc3VdHhLyfevQf4d/COPhw4dOTk40HG3sxLETZ0xU1lDm5eeFe/DXk/QmKeVtStzLuI+pHy9evAgL2rOtrRm0vqIun9D6fXQ6HnxC7PyIHj161N3dXV1dY8aMeVpauioq6lAtfz1kctOHD2lPn96PinqBw6HY2Ji+LGj/s3oIIdTc3Jybm5uWlnb33t2XL15WVFTAzfjrmW8/33C84RjtMVpaWn0cmwaAKvrFSgghQnBwiK2tLSghNqeqqiouLi4uLv7169eRkRFQIX89kpJSEyeaWllZaWhoqKmp/ZgF+BE9BAAAMBhUESghAAD6C9BDAAD8eaoIlBAAAKCHAABgX1UESggAANBDAACwryoCJQQAAOghAADYVxWBEgIAAPQQAADsq4pACQEAAHoIAAD2VUWghAAAAD0EAAD7qiJQQgAAgB4CAIB9VREoIQAAQA8BAMC+qgiUEAAAoIcAAGBrVVRQWA5KCAAA0EMAALC1KsLhcKCEAAAAPQQAAFurIoQQKCEAAEAPAQAAAAAA/E7wUAUAAAAAAIAeAgAAAAAAAD0EAAAAAAAAeggAAAAAAAD0EAAAAAAAAOghAAAAAAAA0EMAAAAAAACghwAAAAAAAEAPAQAAAAAAgB4CAAAAAABgK/4PzVvE1hSX2gkAAAAASUVORK5CYII="}}, "outputs": []}, {"cell_type": "markdown", "source": "# Algorithm / flow of the program\n\n1. **Load** the data set: `X` = features, `y` = target.\n2. **Clean / prepare** the data: rename the columns, encode categorical features and the target.\n3. **Split** into training data (80%) and testing data (20%). The testing data is locked away and is used **only once, at the very end** (step 9).\n4. **Baselines** (for reference): SVC on all features, (4.1) not scaled and (4.2) scaled.\n5. **Define the components**: `Scaler`, `Selector`, `Model` and `Param_Grid`. Only this step changes for a different model, selector, scaler or parameter grid.\n6. **Define the functions**: a pipeline + Grid Search CV function, and two small functions to find and apply the selected features.\n7. **Feature selection + hyperparameter tuning** on the **training data only**. For every candidate (number of features `k` and model hyperparameters) and for every cross-validation (CV) split:\n   1. fit the scaler on the CV-training part and scale both parts,\n   2. select features using the CV-training part only,\n   3. fit the model on the selected features,\n   4. score it on the CV-validation part.\n\n   The candidate with the best mean validation score wins. The pipeline is then refitted on the whole training data.\n   *Output:* the best parameters, the best validation score and the fitted pipeline.\n8. **Find the selected features** and **build the new data set** (selected features only) for the training data, the testing data and the full data. Save it to a CSV file.\n9. **Train the final model** with the best parameters on the new training data, then **test** it on the new testing data.\n10. **Report**: best parameters, selected features, new data set, validation score and test accuracy.\n\n**To use another data set**, change sections 1 to 3. **To use another model, selector, scaler or parameter grid**, change only section 5.", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 1. Load the dataset\nThe Breast Cancer dataset from scikit-learn has 569 samples, 30 numeric features and a binary target (0 = malignant, 1 = benign).\n\n**New variables**\n- `SKLBC_Data_Set`: the loaded data set object (a dictionary-like `Bunch`).\n- `X`: the features, a 2D array of 569 rows x 30 columns.\n- `y`: the target labels, a 1D array of 569 values (0 or 1).\n\n**Built-in functions and imports**\n- `import pandas as pd` / `import numpy as np`: load the libraries *pandas* (tables: `DataFrame`, `Series`) and *numpy* (numeric arrays). `as pd` / `as np` give them short names.\n- `load_breast_cancer()` (from `sklearn.datasets`): returns the data set object. It is called here **without arguments**. Optional arguments: `return_X_y=True` returns `(X, y)` directly, and `as_frame=True` returns pandas objects instead of arrays.\n- `SKLBC_Data_Set.data` and `SKLBC_Data_Set.target`: the feature array and the label array stored inside the object.\n- `train_test_split` is only imported here; it is used in section 3.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "import pandas as pd\nimport numpy as np\nfrom sklearn.datasets import load_breast_cancer\nfrom sklearn.model_selection import train_test_split\n\nSKLBC_Data_Set = load_breast_cancer()    # Load the dataset\n\n# Access the components\nX = SKLBC_Data_Set.data                  # 2D array: 569 samples x 30 features\ny = SKLBC_Data_Set.target                # 1D array: target labels (0 or 1)", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 2. Prepare features and target\n- Columns are renamed to `Feature-1 ... Feature-30` so the same code works for any dataset.\n- Categorical (text) columns, if any, are converted to numbers with `OrdinalEncoder`. This dataset has none, so the data is copied.\n- The target is label-encoded.\n- `X` stays a pandas **DataFrame** and `y` a **Series**: later steps need `X.columns` and the row index. Converting to NumPy arrays here would cause `'numpy.ndarray' object has no attribute 'columns'`.\n\n**New variables**\n- `X_columns`: the new column names. `Cat_Cols` / `Num_Cols`: names of the text-type / numeric columns.\n- `feature_encoder`, `target_encoder`: the encoder objects. `X_encoded`, `y_encoded`: the encoded results.\n\n**Built-in functions and their arguments**\n- `range(n)` gives the numbers `0 ... n-1`; `str(i)` converts a number to text; `\"Feature-\" + str(i+1)` builds the name. The `[... for i in range(...)]` form is a *list comprehension* that builds a list.\n- `X.shape` is a tuple `(rows, columns)`; `X.shape[1]` is the number of columns (30).\n- `pd.DataFrame(data, columns=...)`: builds a table. `data` = the 2D array; `columns` = the list of column names.\n- `X.select_dtypes(include=[...])`: keeps only the columns whose data type is in the list. `'object'` / `'category'` are text-like types, `'number'` is any numeric type. `.columns` gives the resulting column names.\n- `len(x)`: the number of items in `x`.\n- `OrdinalEncoder()`: converts each text category to a number (0, 1, 2, ...) column by column. `.fit_transform(X)` first *learns* the categories (`fit`) and then *converts* the data (`transform`).\n- `LabelEncoder()`: the same idea for the target. `.fit_transform(y)` returns an array of integer labels.\n- `X.copy()`: makes an independent copy of the table.\n- `pd.Series(data, name=...)`: builds a single column. `data` = the values; `name` = the column name (`'Target'`).", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "from sklearn.preprocessing import OrdinalEncoder, LabelEncoder\n\n# Rename features dynamically to Feature-1, Feature-2, ...\nX_columns = [\"Feature-\" + str(i+1) for i in range(X.shape[1])]\nX = pd.DataFrame(X, columns=X_columns)\n\nCat_Cols = X.select_dtypes(include=['object', 'category']).columns\nNum_Cols = X.select_dtypes(include=['number']).columns\n\n# OrdinalEncoder for categorical feature columns (none in this dataset)\nif len(Cat_Cols) > 0:\n    feature_encoder = OrdinalEncoder()\n    X_encoded = feature_encoder.fit_transform(X)\nelse:\n    X_encoded = X.copy()\n\n# Label encoding for the target variable\ntarget_encoder = LabelEncoder()\ny_encoded = target_encoder.fit_transform(y)\n\n# Keep X as a DataFrame and y as a Series\nX = pd.DataFrame(X_encoded, columns=X_columns)\ny = pd.Series(y_encoded, name='Target')", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 3. Train / test split\n80% of the rows are used for training (feature selection and tuning) and 20% are kept aside for the final test.\nThe test set is **never** used to choose features or hyperparameters.\n\n**New variables:** `X_train`, `y_train` (training features and labels), `X_test`, `y_test` (testing features and labels).\n\n**Built-in function and its arguments**\n- `train_test_split(X, y, test_size, random_state, shuffle)` (from `sklearn.model_selection`) splits the data into four parts:\n  - `X`, `y`: the features and the target. Rows stay matched between them.\n  - `test_size=0.20`: the fraction of rows used for testing (20%).\n  - `random_state=42`: the seed of the random shuffling. The same number always gives the same split, so the results can be repeated.\n  - `shuffle=True`: mix the rows before splitting.\n  - It returns, in this order: `X_train, X_test, y_train, y_test`.\n- `.shape` gives the size of each part; `print(...)` shows text on the screen.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "X_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=0.20, random_state=42, shuffle=True)\n\nprint(\"Complete dataset:\", X.shape)\nprint(\"Training features:\", X_train.shape)\nprint(\"Testing features:\", X_test.shape)\nprint(\"Training targets:\", y_train.shape)\nprint(\"Testing targets:\", y_test.shape)", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 4. Baselines: SVC on all features\nA baseline is a simple reference result: SVC trained on **all 30 features** with fixed hyperparameters, before any feature selection. Later results are compared with it. We run it twice: without scaling (4.1) and with scaling (4.2).\n\n### 4.1 All features, NOT scaled\nThe unscaled baseline gives low accuracy (about 62%), because the features have very different ranges and an RBF SVC is very sensitive to this. The reason is explained in detail in 4.2.\n\n**New variables**\n- `params`: a dictionary of fixed SVC hyperparameters.\n- `Model`: the SVC classifier. `accuracy`: the fraction of correct predictions on the testing data.\n\n**Built-in functions and their arguments**\n- `SVC(...)` (Support Vector Classifier, from `sklearn.svm`) finds a boundary that separates the classes with the largest possible margin. Arguments used:\n  - `C`: how strictly the model must fit the training data. A small `C` allows more mistakes and gives a smoother boundary; a large `C` fits the training data more strictly.\n  - `kernel`: the shape of the boundary. `'linear'` = a straight boundary, `'rbf'` = a flexible curved boundary.\n  - `gamma`: how far the influence of one training example reaches in the `'rbf'` kernel. `'scale'` uses $1/(n\\_features \\times \\text{variance of X})$ and `'auto'` uses $1/n\\_features$.\n- `SVC(**params)`: the `**` unpacks the dictionary into keyword arguments, i.e. it means `SVC(C=0.25, gamma='auto', kernel='rbf')`.\n- `Model.fit(X_train, y_train)`: trains the model. Arguments: the training features and the training labels.\n- `Model.predict(X_test)`: returns the predicted labels for the given features.\n- `accuracy_score(y_true, y_pred)` (from `sklearn.metrics`): the fraction of predictions equal to the true labels. Arguments: the true labels and the predicted labels.\n- In the `print`, `{accuracy * 100:.2f}` writes the number as a percentage with 2 decimal places (an *f-string*).", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "from sklearn.svm import SVC\nfrom sklearn.metrics import accuracy_score\n\nparams = {'C': 0.25, 'gamma': 'auto', 'kernel': 'rbf'}     # fixed hyperparameters\n\n# ---- Baseline 1: all features, NOT scaled ----\nModel = SVC(**params)\nModel.fit(X_train, y_train)\naccuracy = accuracy_score(y_test, Model.predict(X_test))\nprint(f\"Accuracy (all features, NOT scaled): {accuracy * 100:.2f}%\")", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "### 4.2 All features, scaled (the scaler learns from the training data only)\n\n#### What is feature scaling and why is it needed?\nFeatures are measured in different units and have very different ranges. In this data set *mean area* is in the hundreds to thousands (about 140 to 2500), while *mean smoothness* is about 0.05 to 0.16. Many models, such as SVC (RBF kernel) and KNN, are built on **distances** between examples. The distance is almost completely decided by the large-range feature (area), and the small-range features (smoothness) are practically ignored, even if they are very informative. Scaling puts all features on a comparable range so that each one gets a fair influence. (Tree-based models such as Random Forest do not need scaling. Models trained by gradient methods, such as logistic regression, usually train faster after scaling.)\n\n#### Standardisation (z-score), used here\nEach column is converted with\n\n$$z = \\frac{x - \\mu}{\\sigma}$$\n\nwhere $\\mu$ is the **mean** and $\\sigma$ the **standard deviation** of that column. After scaling every column has mean 0 and standard deviation 1. The value $z$ says \"how many standard deviations the original value is above or below the average\", so it can be negative; most values lie between about $-3$ and $3$.\n\n*Example:* if a training column has $\\mu = 650$ and $\\sigma = 350$, then $x=1000$ becomes $z = (1000-650)/350 = 1.0$ and $x=300$ becomes $z = (300-650)/350 = -1.0$.\n\n*Other common scalers:* `MinMaxScaler` uses $(x-\\min)/(\\max-\\min)$ and maps every column to $[0,1]$; `RobustScaler` uses the median and the interquartile range, so it is less affected by outliers.\n\n#### Why the scaler learns from the training data only\n$\\mu$ and $\\sigma$ are computed **from the training rows only** and then reused, unchanged, on the testing rows. If the testing rows were used to compute them, information from the test set would leak into the model (*data leakage*) and the test accuracy would look better than it really is. In real use, new data arrives later and only the training numbers are known.\n\n#### Functions and arguments\n- `StandardScaler()` (from `sklearn.preprocessing`) creates the scaler. Optional arguments (defaults used here): `with_mean=True` (subtract the mean), `with_std=True` (divide by the standard deviation), `copy=True` (do not change the original data).\n- `scaler.fit(X)` learns $\\mu$ and $\\sigma$ of every column. `scaler.transform(X)` applies them. `scaler.fit_transform(X)` does both in one call, so it is used **only on the training data**, while the testing data uses **only `transform`**.\n- These functions return a plain NumPy array, which has lost the column names and row labels. `pd.DataFrame(data, columns=..., index=...)` puts them back: `data` = the scaled array, `columns` = the column names (`X.columns`), `index` = the original row labels (`X_train.index`).\n- `SVC`, `fit`, `predict` and `accuracy_score` work exactly as in 4.1, but now on the scaled data.\n\n**New variables:** `scaler` (the fitted scaler), `X_train_s`, `X_test_s` (scaled training and testing features). The original unscaled `X_train` / `X_test` are kept, because the pipeline in section 6 does its own scaling.\n\nCompare the accuracy with 4.1: scaling alone raises it from about 62% to about 96%.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "from sklearn.preprocessing import StandardScaler\n\n# ---- Baseline 2: all features, scaled (scaler learns from train only) ----\nscaler = StandardScaler()\nX_train_s = pd.DataFrame(scaler.fit_transform(X_train), columns=X.columns, index=X_train.index)\nX_test_s = pd.DataFrame(scaler.transform(X_test), columns=X.columns, index=X_test.index)\n\nModel = SVC(**params)\nModel.fit(X_train_s, y_train)\naccuracy = accuracy_score(y_test, Model.predict(X_test_s))\nprint(f\"Accuracy (all features, scaled): {accuracy * 100:.2f}%\")", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 5. Define the components (change only this cell for other methods)\nFour variables describe the whole experiment.\n\n- **`Scaler`**: the scaling method (explained in 4.2). Use `None` for no scaling.\n- **`direction`**: `'backward'` = **Backward Elimination** (start with all features and remove the least useful one at each step); `'forward'` = **Forward Selection** (start with none and add the most useful one at each step).\n- **`Selector`**: the feature selection method.\n- **`Model`**: the classifier to tune. Its hyperparameters are chosen by the grid search, so it is created with default values.\n- **`Param_Grid`**: a dictionary of the values to try. Keys have the form `<step name>__<parameter>`, where the step names are `scaler`, `selector` and `model` (defined in section 6).\n  - `selector__n_features_to_select` is the list of **k values** (numbers of features) to compare.\n  - `model__C`, `model__kernel`, `model__gamma` are the SVC hyperparameters (see 4.1).\n  - The parameter name for the number of features depends on the selector: `n_features_to_select` for `SequentialFeatureSelector` and `RFE`, `k` for `SelectKBest`, `percentile` for `SelectPercentile`.\n  - Total candidates here: 6 k values x 3 `C` x 2 kernels x 2 `gamma` = 72.\n\n**Built-in functions and their arguments**\n- `SequentialFeatureSelector(estimator, direction, scoring, cv, n_features_to_select)` (from `sklearn.feature_selection`) adds (forward) or removes (backward) one feature at a time:\n  - `estimator`: the model used to judge each feature set (here `Model`).\n  - `direction`: `'forward'` or `'backward'`.\n  - `scoring='accuracy'`: the metric that decides which feature set is better.\n  - `cv=3`: the number of cross-validation folds used to score each candidate feature set.\n  - `n_features_to_select`: how many features to keep. It is **not given here**, because the grid search chooses it from `Param_Grid`.\n- `StandardScaler()`: see 4.2. `SVC()`: called with no arguments, so default hyperparameters are used.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "from sklearn.feature_selection import SequentialFeatureSelector\n\nScaler = StandardScaler()                                   # scaling method (None = no scaling)\ndirection = 'backward'                                      # 'backward' = Backward Elimination, 'forward' = Forward Selection\nModel = SVC()                                               # model to tune\n\n# Selector: ranks features with the model itself, scored by 3-fold CV accuracy\nSelector = SequentialFeatureSelector(Model, direction=direction,\n                                     scoring='accuracy', cv=3)\n\n# Parameter grid: <step name>__<parameter> : list of values to try\nParam_Grid = {'selector__n_features_to_select': [3, 5, 7, 10, 15, 20],   # k values to compare\n              'model__C': [0.1, 1, 10],\n              'model__kernel': ['linear', 'rbf'],\n              'model__gamma': ['scale', 'auto']}", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 6. Define the functions\nThree functions are written by us (*user-defined functions*). Built-in functions used inside them are described below.\n\n### User-defined functions\n**`Build_Pipeline_Model(X_train, y_train, Scaler, Selector, Model, Param_Grid, N_Splits=5, Test_Size=0.2, Random_State=0)`** does feature selection and hyperparameter tuning in one step. It follows the usual `Build_Model` grid search pattern, with the scaler and selector added in front of the model.\n- `X_train`, `y_train`: the training features (unscaled) and labels.\n- `Scaler`, `Selector`, `Model`: the three components from section 5.\n- `Param_Grid`: the dictionary of values to try.\n- `N_Splits=5`: the number of random train/validation splits used by the cross-validation.\n- `Test_Size=0.2`: the fraction of the training data used for validation in each split.\n- `Random_State=0`: the random seed, so the splits can be repeated.\n- **Returns three values:** the best pipeline (refitted on all of `X_train`), its best parameters, and its mean validation score.\n\n**`Get_Selected_Features(Trained_Pipeline, Columns)`** returns the names of the features kept by the fitted selector. `Trained_Pipeline` = the fitted pipeline; `Columns` = all column names (`X_train.columns`).\n\n**`Select_Features(Data, Selected_Features)`** returns a copy of any data set (training, testing or full) that contains only the selected columns. `Data` = the table; `Selected_Features` = the list of column names to keep. This is how the new data set is built.\n\n### Built-in functions and keywords and their arguments\n- `Pipeline(steps, memory)` chains the steps **scaler -> selector -> model**. In every CV split all steps are fitted on that split's training part only, so the validation rows never influence the scaling or the feature selection (no data leakage).\n  - `steps`: a list of `(name, object)` pairs. The names (`'scaler'`, `'selector'`, `'model'`) are used in the keys of `Param_Grid`.\n  - `memory`: a folder where fitted steps are cached. The slow feature search does not depend on `C`, `kernel` or `gamma`, so without the cache it would be repeated for every hyperparameter combination.\n- `'passthrough'`: the pipeline's \"do nothing\" step, used when `Scaler` is `None`. The form `A if condition else B` chooses `A` when the condition is true and `B` otherwise.\n- `tempfile.mkdtemp()` creates a temporary folder and returns its path (used for `memory`).\n- `StratifiedShuffleSplit(n_splits, test_size, random_state)` creates random train/validation splits that keep the class proportions the same in every split. `n_splits` = how many splits, `test_size` = the validation fraction, `random_state` = the seed.\n- `GridSearchCV(estimator, param_grid, cv, n_jobs, verbose)` tries **every** combination in `param_grid` on the splits and scores each one:\n  - `estimator`: the object to tune (here the pipeline).\n  - `param_grid`: the dictionary of values to try.\n  - `cv`: the splitting method (here the stratified splits).\n  - `n_jobs=-1`: use all CPU cores. `verbose=1`: print progress messages.\n- `grid_search.fit(X_train, y_train)`: runs the whole search. Afterwards: `best_estimator_` = the best pipeline refitted on all of `X_train`, `best_params_` = its parameters, `best_score_` = its mean validation score.\n- `Trained_Pipeline.named_steps['selector']`: gets the fitted selector from the pipeline by its step name. `.get_support()` returns `True/False` for every column (`True` = kept). `Columns[Mask]` keeps the names where the mask is `True`, and `list(...)` turns the result into a list.\n- `Data[Selected_Features]`: picks the listed columns of a table. `.copy()` makes an independent copy.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "import tempfile\nfrom sklearn.base import clone\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.model_selection import GridSearchCV, StratifiedShuffleSplit\n\ndef Build_Pipeline_Model(X_train,y_train,Scaler,Selector,Model,Param_Grid,N_Splits=5,Test_Size=0.2,Random_State=0):\n    # Pipeline: scale -> select features -> classify (all re-fitted inside every CV split)\n    Steps = [('scaler', Scaler if Scaler is not None else 'passthrough'),\n             ('selector', Selector),\n             ('model', Model)]\n    Pipe = Pipeline(Steps, memory=tempfile.mkdtemp())      # memory = cache the scaler + selector\n    # Stratified random splits: class proportions are kept in every split\n    SSP=StratifiedShuffleSplit(n_splits=N_Splits, test_size=Test_Size, random_state=Random_State)\n    # Try every parameter combination on those splits\n    grid_search = GridSearchCV(estimator=Pipe,param_grid=Param_Grid,cv=SSP,\n        n_jobs=1,verbose=1)\n    grid_search.fit(X_train,y_train)\n    # best pipeline (refitted on all of X_train), its parameters, and its mean validation score\n    return grid_search.best_estimator_,grid_search.best_params_,grid_search.best_score_\n\ndef Get_Selected_Features(Trained_Pipeline,Columns):\n    # Names of the features kept by the selector step of the fitted pipeline\n    Mask = Trained_Pipeline.named_steps['selector'].get_support()\n    return list(Columns[Mask])\n\ndef Select_Features(Data,Selected_Features):\n    # Keep only the selected columns of a data set (training, testing or full)\n    return Data[Selected_Features].copy()", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 7. Feature selection + hyperparameter tuning (training data only)\n`Build_Pipeline_Model` is called with the **unscaled** `X_train` and `y_train`; the pipeline scales internally. The testing data is **not** used here.\n\n**New variables (the three returned values)**\n- **`Trained_Pipeline`**: the best pipeline, already refitted on the whole training data.\n- **`Best_Params`**: the winning combination, containing the best number of features (`selector__...`) and the best model hyperparameters (`model__...`).\n- **`Best_Score`**: the mean validation accuracy of the winning combination.\n\n`print` shows the results; `{Best_Score * 100:.2f}` writes the score as a percentage with 2 decimal places.\n\n*This cell takes a few minutes, because the feature selection is run in every CV split for every k.*", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "Trained_Pipeline,Best_Params,Best_Score=Build_Pipeline_Model(X_train,y_train,Scaler,Selector,Model,Param_Grid)\n\nprint(\"Best parameters:\", Best_Params)\nprint(f\"Best validation score: {Best_Score * 100:.2f}%\")", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 8. Selected features and the new data set\n**New variables**\n- **`Selected`**: the list of feature names kept by the selector of the best pipeline (found with `Get_Selected_Features`).\n- **`X_train_New`**, **`X_test_New`**: the training and testing data reduced to the selected features (made with `Select_Features`). The same columns are used for both, so the testing data is never used to choose them.\n- **`New_Data`**: the full data set with the selected features only, plus the `Target` column. It contains the original (unscaled) values.\n\n**Built-in functions and their arguments**\n- `New_Data.to_csv(path, index=False)`: saves the table as a CSV file. `path` = the file name (built with an f-string so it contains the number of features); `index=False` = do not write the row numbers.\n- `len(Selected)`: the number of selected features. `.shape` = `(rows, columns)`.\n- `New_Data.head()`: shows the first 5 rows (an optional number argument changes how many).", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "Selected = Get_Selected_Features(Trained_Pipeline, X_train.columns)   # names of the selected features\n\nX_train_New = Select_Features(X_train, Selected)      # training data, selected features only\nX_test_New = Select_Features(X_test, Selected)        # testing data, same features\n\n# New data set: selected features of ALL rows + target\nNew_Data = Select_Features(X, Selected)\nNew_Data['Target'] = y\nNew_Data.to_csv(f\"New_Data_{len(Selected)}_features.csv\", index=False)\n\nprint(\"Number of selected features:\", len(Selected))\nprint(\"Selected features:\", Selected)\nprint(\"New training data:\", X_train_New.shape, \" New testing data:\", X_test_New.shape)\nNew_Data.head()", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 9. Train the final model with the best parameters and test it\n1. **`Model_Params`** collects the model hyperparameters from `Best_Params`: the keys starting with `model__`, with that prefix removed.\n2. **`Final_Model`** is a fresh copy of `Model` with these best parameters set.\n3. The new training data is scaled with a scaler fitted on **it only** (`fit_transform`); the new testing data is scaled with the same numbers (`transform`). Scaling each column is independent, so these values are identical to what the pipeline used.\n4. `Final_Model` is trained on the new training data and used to predict the new testing data.\n5. `accuracy_score` compares the predictions with the true testing labels. This is the first and only time the testing labels are used.\n\n**New variables:** `Model_Params` (the best model hyperparameters), `Final_Model`, `Final_Scaler`, `X_train_Final`, `X_test_Final` (scaled new data), `y_pred` (predicted labels), `accuracy` (test accuracy).\n\n**Built-in functions and their arguments**\n- `Best_Params.items()`: gives the `(key, value)` pairs of the dictionary. `Key.startswith('model__')` is true when the key begins with that text. `Key[len('model__'):]` cuts that prefix off. The `{... for ... if ...}` form is a *dictionary comprehension*.\n- `clone(estimator)` (from `sklearn.base`): returns a new, **unfitted** copy of an object with the same settings.\n- `set_params(**params)`: changes the hyperparameters of an object; `**` unpacks the dictionary into keyword arguments.\n- `fit_transform(X)`, `transform(X)`, `fit(X, y)`, `predict(X)`, `accuracy_score(y_true, y_pred)` and `pd.DataFrame(data, columns, index)` work as described in sections 3, 4.1 and 4.2.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "# ---- Best model hyperparameters (remove the \"model__\" prefix) ----\nModel_Params = {Key[len('model__'):]: Value for Key, Value in Best_Params.items() if Key.startswith('model__')}\nFinal_Model = clone(Model).set_params(**Model_Params)\n\n# ---- Scale the new data (learn from the new training data only) ----\nif Scaler is not None:\n    Final_Scaler = clone(Scaler)\n    X_train_Final = pd.DataFrame(Final_Scaler.fit_transform(X_train_New), columns=X_train_New.columns, index=X_train_New.index)\n    X_test_Final = pd.DataFrame(Final_Scaler.transform(X_test_New), columns=X_test_New.columns, index=X_test_New.index)\nelse:\n    X_train_Final, X_test_Final = X_train_New, X_test_New\n\n# ---- Train on the new training data, test on the new testing data ----\nFinal_Model.fit(X_train_Final, y_train)\ny_pred = Final_Model.predict(X_test_Final)\naccuracy = accuracy_score(y_test, y_pred)", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 10. Final result\nA summary of everything the procedure produced: the selector setting, the best parameters, the selected features, the new data set, the validation score (from the cross-validation on the training data) and the test accuracy (from the testing data, used once).\n\n`type(Selector).__name__` gives the name of the selector's class as text (for example `SequentialFeatureSelector`): `type(x)` returns the class of an object and `__name__` is its name. The rest is `print` with f-strings.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "print(\"Selection method:\", type(Selector).__name__, f\"({direction})\")\nprint(\"Best number of features:\", len(Selected))\nprint(\"Best model parameters:\", Model_Params)\nprint(\"Selected features:\", Selected)\nprint(\"New data set shape:\", New_Data.shape)\nprint(f\"Validation score (training CV): {Best_Score * 100:.2f}%\")\nprint(f\"Test accuracy: {accuracy * 100:.2f}%\")", "attachments": {}, "outputs": []}]</script>
<script>
const cells=JSON.parse(document.getElementById('data').textContent), packages=["numpy", "pandas", "scikit-learn", "matplotlib", "ipython"], navigation=[["HOME", "../index.html"], ["CONTENTS", "../course_content.html"], ["CONTACT", "../contact.html"]], activeNavigationLabel="HOME";
let worker=null,ready=false,starting=false,req=0,pending=new Map(),codeCells=[],runningAll=false;
const root=document.getElementById('notebook'),statusEl=document.getElementById('status'),statusTextEl=document.getElementById('status-text');
function status(s){
 const message=String(s);
 const lower=message.toLowerCase();
 statusTextEl.textContent=message;

 statusEl.setAttribute('aria-label',message);
 statusEl.classList.remove('idle','busy','ready','error');
 let state='idle';
 if(lower.includes('failed')||lower.includes('error')||lower.includes('fatal')) state='error';
 else if(lower.includes('ready')) state='ready';
 else if(lower.includes('starting')||lower.includes('loading')||lower.includes('initializ')||lower.includes('running')||lower.includes('progress')||lower.includes('preparing')||lower.includes('installing')) state='busy';
 statusEl.classList.add(state);
}
function el(tag,cls){let x=document.createElement(tag);if(cls)x.className=cls;return x}
function renderNavigation(id){
    const bar=document.getElementById(id);
    const activeLabel=String(activeNavigationLabel||'').trim().toLocaleLowerCase();
    bar.replaceChildren();
    for(const item of navigation){
        const label=String(item[0]);
        const link=el('a','nav-ribbon-link');
        link.textContent=label;
        link.href=String(item[1]);
        if(activeLabel && label.trim().toLocaleLowerCase()===activeLabel){
            link.classList.add('active');
            link.setAttribute('aria-current','page');
        }
        bar.appendChild(link);
    }
}
async function copyCode(code,button){const old=button.textContent;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(code)}else{const area=document.createElement('textarea');area.value=code;area.setAttribute('readonly','');area.style.position='fixed';area.style.left='-9999px';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();if(!ok)throw new Error('Browser blocked clipboard access')}button.textContent='Copied!'}catch(err){console.error('Copy failed:',err);button.textContent='Copy failed'}window.setTimeout(()=>{button.textContent=old},1400)}
function markdownSource(c){let s=c.source||'';return s.replace(/!\[([^\]]*)\]\(attachment:([^)]+)\)/g,(m,a,n)=>{let x=c.attachments&&c.attachments[n];if(!x)return m;let mime=Object.keys(x)[0];return '<img alt="'+a.replace(/"/g,'&quot;')+'" src="data:'+mime+';base64,'+x[mime]+'">'});}
function addText(parent,t){if(t===undefined||t===null||t==='')return;let p=el('pre');p.textContent=String(t);parent.appendChild(p)}
function savedOutputs(c,out){if(!true||!c.outputs)return;for(let o of c.outputs){if(o.output_type==='stream')addText(out,o.text);else if(o.output_type==='error')addText(out,(o.ename||'Error')+': '+(o.evalue||'')+'\\n'+(o.traceback||[]).join('\\n'));else if(o.data){let d=o.data;if(d['image/png']||d['image/jpeg']){let im=el('img');im.src='data:'+(d['image/png']?'image/png':'image/jpeg')+';base64,'+(d['image/png']||d['image/jpeg']);out.appendChild(im)}else if(d['image/svg+xml']||d['text/html']){let box=el('div','htmlout');box.innerHTML=DOMPurify.sanitize(d['image/svg+xml']||d['text/html']);out.appendChild(box)}else if(d['text/plain'])addText(out,d['text/plain'])}}}
function render(){let n=0;for(let c of cells){if(c.cell_type==='markdown'){let w=el('section','cell markdown');w.innerHTML=DOMPurify.sanitize(marked.parse(markdownSource(c)));root.appendChild(w)}else if(c.cell_type==='code'){n++;let w=el('section','cell code'),h=el('div','codehead'),indicator=el('span','cell-status');indicator.title='Not executed';indicator.setAttribute('aria-label','Not executed');let lab=el('span','label');lab.textContent=true?'Code Cell '+n:'Python';let b=el('button');b.textContent='Run Cell';b.onclick=()=>runCell(w);let cp=el('button','copy-button');cp.textContent='Copy';cp.title='Copy this code cell to the clipboard';cp.onclick=()=>copyCode(w._ed.getValue(),cp);h.append(indicator,lab,b,cp);w.appendChild(h);let host=el('div','editor');w.appendChild(host);let ed=CodeMirror(host,{value:c.source||'',mode:'python',theme:'material-darker',lineNumbers:true,lineWrapping:true,indentUnit:4,tabSize:4,viewportMargin:Infinity,extraKeys:{'Tab':cm=>cm.replaceSelection('    '),'Shift-Enter':()=>runCell(w)}});ed.setSize(null,'auto');requestAnimationFrame(()=>{ed.setSize(null,'auto');ed.refresh()});let r=el('div','running');r.innerHTML='<span class="spin"></span>Python is running. Please wait; this calculation may take some time.';w.appendChild(r);let o=el('div','output');savedOutputs(c,o);w.appendChild(o);w._ed=ed;w._run=b;w._runbar=r;w._out=o;w._indicator=indicator;codeCells.push(w);root.appendChild(w)}}if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise()}
function workerSource(){return `importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');let py=null,ready=false,out='';async function init(pkgs){postMessage({type:'status',text:'Loading Python runtime...'});py=await loadPyodide();for(let p of pkgs){postMessage({type:'status',text:'Loading '+p+'...'});try{await py.loadPackage(p)}catch(e){postMessage({type:'warning',text:'Could not load '+p+': '+e})}}await py.runPythonAsync("import matplotlib\\nmatplotlib.use('Agg', force=True)");py.setStdout({batched:s=>{out+=s+'\\n'}});py.setStderr({batched:s=>{out+=s+'\\n'}});ready=true;postMessage({type:'ready'})}onmessage=async e=>{let m=e.data;if(m.type==='init'){try{await init(m.packages)}catch(x){postMessage({type:'fatal',text:String(x)})}}else if(m.type==='run'){if(!ready){postMessage({type:'result',id:m.id,error:'Python is not ready'});return}out='';try{let value=await py.runPythonAsync(m.code);let result='';if(value!==undefined&&value!==null){try{result=value.toString()}catch(_){}}let imgs='[]';try{imgs=await py.runPythonAsync("import json, base64, io, matplotlib.pyplot as plt\\nfrom io import BytesIO\\n__imgs=[]\\nfor __n in plt.get_fignums():\\n __b=BytesIO(); plt.figure(__n).savefig(__b,format='png',dpi=120,bbox_inches='tight'); __imgs.append(base64.b64encode(__b.getvalue()).decode('ascii'))\\nplt.close('all')\\njson.dumps(__imgs)")}catch(_){}postMessage({type:'result',id:m.id,stdout:out,result:result,images:JSON.parse(imgs)})}catch(x){postMessage({type:'result',id:m.id,stdout:out,error:String(x),images:[]})}}};`}
function startKernel(){if(ready||starting)return;starting=true;document.getElementById('start').disabled=true;status('Starting Python...');let blob=new Blob([workerSource()],{type:'text/javascript'});worker=new Worker(URL.createObjectURL(blob));worker.onmessage=e=>{let m=e.data;if(m.type==='status')status(m.text);else if(m.type==='warning')console.warn(m.text);else if(m.type==='ready'){ready=true;starting=false;status('Python is ready')}else if(m.type==='fatal'){starting=false;document.getElementById('start').disabled=false;status('Python failed to start');alert(m.text)}else if(m.type==='result')finish(m)};worker.onerror=e=>{starting=false;document.getElementById('start').disabled=false;status('Worker error');alert(e.message)};worker.postMessage({type:'init',packages:packages})}
function setCellState(w,state){if(!w._indicator)return;w._indicator.className='cell-status '+state;let label=state==='complete'?'Execution complete':state==='running'?'Execution in progress':state==='error'?'Execution failed':'Not executed';w._indicator.title=label;w._indicator.setAttribute('aria-label',label)}
function runCell(w){if(!ready){alert('Click Start Python and wait until Python is ready.');return Promise.resolve()}let id=++req;setCellState(w,'running');w._run.disabled=true;w._runbar.classList.add('on');status('Python is running...');return new Promise(resolve=>{pending.set(id,{w,resolve});worker.postMessage({type:'run',id,code:w._ed.getValue()})})}
function finish(m){let p=pending.get(m.id);if(!p)return;pending.delete(m.id);let w=p.w,o=w._out;o.innerHTML='<div class="outtitle">Execution output</div>';addText(o,m.stdout);if(m.result)addText(o,m.result);for(let b of (m.images||[])){let im=el('img');im.src='data:image/png;base64,'+b;o.appendChild(im)}if(m.error){let x=el('pre');x.style.color='#ff9b9b';x.textContent=m.error;o.appendChild(x)}if(!m.stdout&&!m.result&&!(m.images||[]).length&&!m.error)addText(o,'Cell executed successfully (no output).');setCellState(w,m.error?'error':'complete');w._run.disabled=false;w._runbar.classList.remove('on');if(!pending.size)status('Python is ready');p.resolve()}
async function runAll(){if(runningAll)return;if(!ready){alert('Start Python first.');return}runningAll=true;document.getElementById('runall').disabled=true;try{for(let w of codeCells)await runCell(w)}finally{runningAll=false;document.getElementById('runall').disabled=false}}
function restartKernel(){if(worker)worker.terminate();worker=null;for(let p of pending.values()){p.w._run.disabled=false;p.w._runbar.classList.remove('on');setCellState(p.w,'not-run');p.resolve()}pending.clear();for(let w of codeCells){w._run.disabled=false;w._runbar.classList.remove('on');setCellState(w,'not-run')}ready=false;starting=false;runningAll=false;document.getElementById('start').disabled=false;document.getElementById('runall').disabled=false;status('Kernel restarted. All cells are marked as not executed. Click Start Python.')}
document.getElementById('runall').style.display=true?'':'none';document.getElementById('restart').style.display=true?'':'none';renderNavigation('top-navigation');renderNavigation('bottom-navigation');status('Python is not started');render();
</script></body></html>
