<script id="data" type="application/json">[{"cell_type": "markdown", "source": "# Embedded Methods: Feature Selection with L1 Regularization\n\n**Embedded feature selection** takes place during model training. In this notebook, an **L1-regularized Logistic Regression** model identifies useful features by driving some model coefficients exactly to zero. Features with non-zero coefficients are retained.\n\n**Data:** the scikit-learn Breast Cancer Wisconsin (Diagnostic) data set (569 observations, 30 numerical features and two classes: malignant and benign).\n\nThe L1 selector is fitted inside the training pipeline. An SVC classifier is then trained and evaluated using the selected features. No CSV file is created.", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "# Algorithm / flow of the program (L1 regularization)\n\n1. **Load** the Breast Cancer data set: `X` contains 30 numerical features and `y` contains the class labels.\n2. **Prepare** the features: rename columns as `Feature-1`, `Feature-2`, ... and preserve a map to the original measurement names.\n3. **Split** the data into 80% training and 20% testing observations using stratification.\n4. **Measure baselines:** train an SVC on all features, first without scaling and then with `StandardScaler`.\n5. **Define the components:** `StandardScaler`, an L1-based `SelectFromModel` selector, an SVC classifier and a parameter grid.\n6. **Define functions** to build the pipeline, obtain selected features and coefficient scores, and create the reduced data set.\n7. **Tune on the training set only:** use `GridSearchCV` and stratified cross-validation to select the L1 strength and SVC hyperparameters.\n8. **Inspect selection:** display the absolute L1 coefficients, selected feature names and reduced data preview.\n9. **Train and test:** fit the final SVC using only the selected features; evaluate once on the untouched test set.\n10. **Summarise** the baseline, validation and final test results.\n\n**Important:** scaling, L1 feature selection and classifier fitting are all performed inside each cross-validation training split. The test set is not used to select features or tune parameters.", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## Understanding embedded feature selection and regularization\n\n### 1. What is an embedded method?\n\n- **Filter methods** score features using a statistical measure before model training.\n- **Wrapper methods** repeatedly train a model using different feature subsets.\n- **Embedded methods** select features while the model is being trained.\n\n| Method | Uses a model? | Speed | When selection happens |\n|---|---|---|---|\n| Filter | No | Very fast | Before training |\n| Wrapper | Yes, repeatedly | Slow | Around model training |\n| Embedded | Yes | Usually medium | During model training |\n\nIn L1 regularization, the model learns a coefficient (weight) for each feature. A coefficient of zero means that the feature does not contribute to the model's linear decision function.\n\n![Embedded feature-selection process](attachment:Embedded_Method_Block.png)\n\n### 2. Logistic Regression and its weights\n\nFor numerical features, Logistic Regression first calculates\n\n\\[\nz=w_1x_1+w_2x_2+\\cdots+w_mx_m+b,\n\\qquad\np=\\frac{1}{1+e^{-z}}.\n\\]\n\nHere, \\(w_j\\) is the coefficient of feature \\(x_j\\), and \\(b\\) is the intercept. If \\(w_j=0\\), that feature has no effect on the predicted probability.\n\nFor binary labels \\(y_i\\in\\{0,1\\}\\), the logistic loss is the average binary cross-entropy:\n\n\\[\n\\operatorname{Error}(w,b)=-\\frac{1}{n}\\sum_{i=1}^{n}\\left[y_i\\ln p_i+(1-y_i)\\ln(1-p_i)\\right].\n\\]\n\nRegularization adds a penalty to discourage unnecessarily large coefficients:\n\n\\[\n\\boxed{J(w,b)=\\operatorname{Error}(w,b)+\\lambda\\,\\operatorname{Penalty}(w)}\n\\]\n\nThe penalty strength is controlled by \\(\\lambda\\). A stronger penalty pushes more coefficients towards zero. The bias/intercept \\(b\\) is not penalised. If a model has many features, regularization can also reduce overfitting: it discourages the model from assigning unnecessarily large weights to fit noise in the training data.\n\n### 3. L1, L2 and Elastic Net penalties\n\n| Penalty | Formula | Effect on coefficients | Feature selection? |\n|---|---|---|---|\n| **L1 (Lasso)** | \\(\\sum_j |w_j|\\) | Some coefficients can become exactly zero | **Yes** |\n| **L2 (Ridge)** | \\(\\sum_j w_j^2\\) | Coefficients become smaller, but usually not exactly zero | No, not by itself |\n| **Elastic Net** | \\(\\alpha\\sum_j|w_j|+(1-\\alpha)\\sum_jw_j^2\\) | Combines L1 sparsity and L2 shrinkage | Yes, can set coefficients to zero |\n\nIn this notebook we use L1 regularization. A useful physics analogy is minimising a potential with two competing contributions: the data-fit term favours weights that explain the observations, while the penalty pulls weights towards zero.\n\n### 4. Why can L1 produce exact zeros?\n\nFor a simple one-weight illustration, suppose the unregularized best coefficient is \\(a\\) and the error is \\((w-a)^2\\).\n\n- With L2, minimising \\((w-a)^2+\\lambda w^2\\) gives \\(w=a/(1+\\lambda)\\). The coefficient is shrunk, but it is not zero unless \\(a=0\\).\n- With L1, minimising \\((w-a)^2+\\lambda|w|\\) gives the soft-threshold rule\n\n\\[\nw=\\operatorname{sign}(a)\\max\\left(|a|-\\frac{\\lambda}{2},0\\right).\n\\]\n\nSmall coefficients are set exactly to zero. This is the key reason L1 can perform feature selection. This rule is called **soft thresholding**. In a simple proximal-gradient description, training alternates between a gradient step for the error and a soft-threshold step for the L1 penalty. Scikit-learn performs this optimisation internally when we fit Logistic Regression.\n\n**Small numerical example:** if \\(\\lambda=2\\), then a coefficient \\(a=3\\) becomes \\(2\\), while a coefficient \\(a=0.8\\) becomes \\(0\\) under L1. Under L2, the same values become \\(1\\) and approximately \\(0.267\\), respectively.\n\n### 5. Geometrical picture\n\nThe allowed region for L1 regularization is diamond-shaped. Its sharp corners lie on the coordinate axes, so the first point of contact with an error contour often has one coefficient equal to zero. The L2 region is circular and smooth; the contact point is generally not on an axis.\n\n![L1 diamond and L2 circle geometry](attachment:L1_L2_Geometry.png)\n\n### 6. Choosing the penalty strength and scaling\n\n- Stronger L1 penalty \\(\\Rightarrow\\) more zero coefficients \\(\\Rightarrow\\) fewer selected features.\n- Weaker L1 penalty \\(\\Rightarrow\\) fewer zero coefficients \\(\\Rightarrow\\) more selected features.\n- In scikit-learn, Logistic Regression uses **`C`**, which is inversely related to the regularization strength: **small `C` means strong regularization**.\n- Features must be scaled before regularization. Otherwise, the penalty acts unfairly because coefficient magnitudes depend on measurement units.\n\nWe use `StandardScaler` inside the pipeline. The selector uses L1 Logistic Regression; an SVC is used as the downstream classifier so that its validation and test scores can be compared with the previous feature-selection notebooks. The L1 Logistic Regression is the model that determines which features are retained.\n\n### 7. L1 feature-selection workflow\n\n![L1 regularization feature-selection flowchart](attachment:L1_Regularization_Flowchart.png)\n\n### 8. How is an L1-regularized model trained?\n\nA simple way to understand L1 optimisation is **proximal gradient descent**. Each iteration has two steps:\n\n1. **Gradient step for the error:**\n   \\[\n   w_j\\leftarrow w_j-\\eta\\,\\frac{\\partial\\operatorname{Error}}{\\partial w_j},\n   \\]\n   where \\(\\eta\\) is the learning rate.\n2. **Soft-threshold step for the L1 penalty:**\n   \\[\n   w_j\\leftarrow\\operatorname{sign}(w_j)\\max(|w_j|-\\eta\\lambda,0).\n   \\]\n\nFor logistic regression, the derivative of the error with respect to one coefficient is\n\n\\[\n\\frac{\\partial\\operatorname{Error}}{\\partial w_j}\n=\\frac{1}{n}\\sum_{i=1}^{n}(p_i-y_i)x_{ij}.\n\\]\n\nThe soft-threshold step pulls small coefficients to exactly zero. The scikit-learn solver performs the optimisation internally; these equations explain the principle rather than requiring us to code the optimiser ourselves.\n\n### 9. Practical algorithm\n\n1. Scale all feature columns.\n2. Choose a regularization strength (in scikit-learn, choose `C`; smaller `C` means a stronger penalty).\n3. Train Logistic Regression with the L1 penalty.\n4. Retain features whose fitted coefficients are non-zero (here, whose absolute coefficient exceeds `1e-5`).\n5. Evaluate a classifier using only those retained features.\n6. If the number of retained features or validation accuracy is not satisfactory, try another penalty strength using cross-validation.\n\n### 10. Good and limiting points\n\n**Advantages**\n- Feature selection and model training happen together.\n- The model considers all features together, so it can choose between correlated features.\n- Coefficient magnitudes provide a measure of the feature's contribution to the fitted linear model.\n\n**Limitations**\n- Features should be scaled before regularization.\n- The regularization strength must be selected, usually by cross-validation.\n- When features are strongly correlated, L1 may keep one and discard another; the selected one can change if the data changes.\n- The selection model is linear, so complicated nonlinear relationships may not be captured.\n", "attachments": {"Embedded_Method_Block.png": {"image/png": "iVBORw0KGgoAAAANSUhEUgAACTYAAAHlCAYAAADF1TFtAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAbrwAAG68BXhqRHAABAABJREFUeJzs3Xd0VEUbx/FfKukdQu+9995BELCAFXtBRUVBUFQQQYogTUVRUBQRUUQRRJAuvffeayghkN77vn/kZWWzJQkEssHv5xyPZOaWZ/fuzp2997kzDgaDwSAAAAAAAAAAAAAAAAAAsCOOBR0AAAAAAAAAAAAAAAAAAGRHYhMA QAAAAAAABSYIAAAAAAAAApMEAAAAAAAAAUmCAAAAAAAgAITBAAAAAAAQIEJAgAAAAAAoMAEAQAAAAAAUGCCAAAAAAAAKDBBAAAAAAAAFJggAAAAAAAACkwQAAAAAAAABSYIAAAAAACAAhMEAAAAAABAgQkCAAAAAACgwAQBAAAAAABQYIIAAAAAAAAoMEEAAAAAAAAUmCAAAAAAAAAKTBAAAAAAAAAFJggAAAAAAIACEwQAAAAAAECBCQIAAAAAAKDABAEAAAAAAFBgggAAAAAAACgwQQAAAAAAABSYIAAAAAAAAApMEAAAAAAAAAUmCAAAAAAAgAITBAAAAAAAQIEJAgAAAAAAoMAEAQAAAAAAUGCCAAAAAAAAKDBBAAAAAAAAFJggAAAAAAAACkwQAAAAAAAABSYIAAAAAACAAhMEAAAAAABAgQkCAAAAAACgwAQBAAAAAABQYIIAAAAAAAAoMEEAAAAAAAAUmCAAAAAAAAAKTBAAAAAAAAAFJggAAAAAAIACEwQAAAAAAECBCQIAAAAAAKDABAEAAAAAAFBgggAAAAAAACgwQQAAAAAAABSYIAAAAAAAAApMEAAAAAAAAAUmCAAAAAAAgAITBAAAAAAAQIEJAgAAAAAAoMAEAQAAAAAAUGCCAAAAAAAAKDBBAAAAAAAAFJggAAAAAAAACkwQAAAAAAAABSYIAAAAAACAAhMEAAAAAABAgQkCAAAAAACgwAQBAAAAAABQYIIAAAAAAAAoMEEAAAAAAAAUmCAAAAAAAAAKTBAAAAAAAAAFJggAAAAAAIACEwQAAAAAAECBCQIAAAAAAKDABAEAAAAAAFBgggAAAAAAACgwQQAAAAAAABSYIAAAAAAAAApMEAAAAAAAAAUmCAAAAAAAgAITBAAAAAAAQIEJAgAAAAAAoMAEAQAAAAAAUGCCAAAAAAAAKDBBAAAAAAAAFJggAAAAAAAACkwQAAAAAAAABSYIAAAAAACAAhMEAAAAAABAgQkCAAAAAACgwAQBAAAAAABQYIIAAAAAAAAoMEEAAAAAAAAUmCAAAAAAAAAKTBAAAAAAAAAFJggAAAAAAIACEwQAAAAAAECBCQIAAAAAAKDABAEAAAAAAFBgggAAAAAAACgwQQAAAAAAABSYIAAAAAAAAApMEAAAAAAAAAUmCAAAAAAAgAITBAAAAAAAQIH9f7k3X/eWPds8AAAAAElFTkSuQmCC"}}, "outputs": []}, {"cell_type": "markdown", "source": "## 1. Load the dataset\n\nThe **Breast Cancer Wisconsin (Diagnostic)** data set is built into `scikit-learn`. It contains 569 observations and 30 numerical measurements. The target has two classes: **malignant** and **benign**.\n\n**New variables**\n- `SKL_Breast_Cancer_Data_Set`: the loaded scikit-learn data set.\n- `X`: the feature data.\n- `y`: the target labels (`0 = malignant`, `1 = benign`).", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "import pandas as pd\nimport numpy as np\nfrom sklearn.datasets import load_breast_cancer\nfrom sklearn.model_selection import train_test_split\n\nSKL_Breast_Cancer_Data_Set = load_breast_cancer()\n\nX = pd.DataFrame(SKL_Breast_Cancer_Data_Set.data,\n                 columns=SKL_Breast_Cancer_Data_Set.feature_names)\ny = pd.Series(SKL_Breast_Cancer_Data_Set.target, name='Target')\n\nprint(\"Dataset shape:\", X.shape)\nprint(\"Number of observations:\", X.shape[0])\nprint(\"Number of numerical features:\", X.shape[1])\nprint(\"Target classes:\", dict(enumerate(SKL_Breast_Cancer_Data_Set.target_names)))\nprint(\"\\nClass distribution:\")\nprint(y.map({0: 'malignant', 1: 'benign'}).value_counts().to_string())", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Dataset shape: (569, 30)\nNumber of observations: 569\nNumber of numerical features: 30\nTarget classes: {0: 'malignant', 1: 'benign'}\n\nClass distribution:\nbenign       357\nmalignant    212\n"}]}, {"cell_type": "markdown", "source": "## 2. Prepare features and target\n\nThe original measurement names are preserved in `Feature_Name_Map`. The columns of `X` are renamed `Feature-1`, `Feature-2`, ... so the same program structure can be used with other data sets.\n\nThe target is already numerical (`0` and `1`), so no target encoding is required.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "# Keep the original measurement names for reference\nOriginal_Feature_Names = list(X.columns)\n\n# Generic feature names: Feature-1, Feature-2, ...\nX_columns = [\"Feature-\" + str(i + 1) for i in range(X.shape[1])]\nX.columns = X_columns\n\nFeature_Name_Map = pd.DataFrame({\n    'Feature': X_columns,\n    'Original measurement': Original_Feature_Names\n})\n\nprint(\"Feature-name mapping (first 10 rows):\")\nprint(Feature_Name_Map.head(10).to_string(index=False))\nprint(\"\\nTarget encoding: 0 = malignant, 1 = benign\")", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Feature-name mapping (first 10 rows):\n   Feature   Original measurement\n Feature-1            mean radius\n Feature-2           mean texture\n Feature-3         mean perimeter\n Feature-4              mean area\n Feature-5        mean smoothness\n Feature-6       mean compactness\n Feature-7         mean concavity\n Feature-8    mean concave points\n Feature-9          mean symmetry\nFeature-10 mean fractal dimension\n\nTarget encoding: 0 = malignant, 1 = benign\n"}]}, {"cell_type": "markdown", "source": "## 3. Train / test split\n\nThe data is divided into **80% training** and **20% testing** observations. The `stratify=y` argument preserves the class proportions in both subsets.\n\nThe training set is used for scaling, L1 feature selection and hyperparameter tuning. The test set is kept aside until the final evaluation.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "X_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=0.20, random_state=42, shuffle=True, stratify=y)\n\nprint(\"Complete dataset:\", X.shape)\nprint(\"Training features:\", X_train.shape)\nprint(\"Testing features:\", X_test.shape)\nprint(\"\\nTraining class distribution:\")\nprint(y_train.map({0: 'malignant', 1: 'benign'}).value_counts().to_string())", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Complete dataset: (569, 30)\nTraining features: (455, 30)\nTesting features: (114, 30)\n\nTraining class distribution:\nbenign       285\nmalignant    170\n"}]}, {"cell_type": "markdown", "source": "## 4. Baselines: SVC on all features\n\nA **baseline** is a reference result measured before feature selection. Here, an SVC classifier is trained with all 30 features using fixed hyperparameters. First we evaluate the unscaled data; the next section repeats the baseline after standard scaling.\n\nThis gives us a reference for judging whether the L1-selected subset retains useful predictive information.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "from sklearn.svm import SVC\nfrom sklearn.metrics import accuracy_score\n\nBaseline_Params = {'C': 0.25, 'gamma': 'auto', 'kernel': 'rbf'}\n\n# Baseline 1: all features, NOT scaled\nBaseline_Model_Unscaled = SVC(**Baseline_Params)\nBaseline_Model_Unscaled.fit(X_train, y_train)\ny_pred_unscaled = Baseline_Model_Unscaled.predict(X_test)\nBaseline_Accuracy_Unscaled = accuracy_score(y_test, y_pred_unscaled)\n\nprint(\"Baseline SVC (all features, not scaled)\")\nprint(f\"Test accuracy: {Baseline_Accuracy_Unscaled * 100:.2f}%\")", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Baseline SVC (all features, not scaled)\nTest accuracy: 63.16%\n"}]}, {"cell_type": "markdown", "source": "### 4.2 All features, Standard-scaled\n\nRegularization depends on coefficient magnitudes. A feature measured on a large numerical scale can otherwise receive a different effective penalty from a feature measured on a small scale.\n\n`StandardScaler` transforms each feature using\n\n\\[\nz=\\frac{x-\\mu}{\\sigma},\n\\]\n\nwhere \\(\\mu\\) and \\(\\sigma\\) are learned from the training observations. The same training-set values are then used to transform the test observations.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "from sklearn.preprocessing import StandardScaler\n\nBaseline_Scaler = StandardScaler()\nX_train_Scaled = Baseline_Scaler.fit_transform(X_train)\nX_test_Scaled = Baseline_Scaler.transform(X_test)\n\nBaseline_Model_Scaled = SVC(**Baseline_Params)\nBaseline_Model_Scaled.fit(X_train_Scaled, y_train)\ny_pred_scaled = Baseline_Model_Scaled.predict(X_test_Scaled)\nBaseline_Accuracy_Scaled = accuracy_score(y_test, y_pred_scaled)\n\nprint(\"Baseline SVC (all features, Standard-scaled)\")\nprint(f\"Test accuracy: {Baseline_Accuracy_Scaled * 100:.2f}%\")", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Baseline SVC (all features, Standard-scaled)\nTest accuracy: 96.49%\n"}]}, {"cell_type": "markdown", "source": "## 5. Define the components (change only this cell for other methods)\n\nThis cell defines the four components used by the common pipeline.\n\n- **`Scaler`**: `StandardScaler()` standardizes every feature before L1 regularization and SVC classification. It is fitted within each cross-validation training split.\n- **`Selector`**: `SelectFromModel` uses an L1-regularized `LogisticRegression` estimator. Features with coefficients whose absolute values exceed `1e-5` are retained. The small threshold treats numerical values extremely close to zero as zero. The code uses the current `l1_ratio=1.0` form on scikit-learn 1.8 and later, and `penalty='l1'` on earlier versions.\n- **`Model`**: `SVC()` is the downstream classifier. The L1 Logistic Regression inside `Selector` performs embedded feature selection; SVC evaluates the selected feature subset.\n- **`Param_Grid`**: `selector__estimator__C` controls the L1 penalty strength (`C` small = stronger penalty). The `model__...` keys tune SVC. The grid is a list of two dictionaries so that `gamma` is searched only for the RBF kernel.\n\n**Important scikit-learn functions**\n- `LogisticRegression(..., solver='liblinear')` fits a binary Logistic Regression model with an L1 penalty. The `liblinear` solver supports L1 regularization; the code selects the appropriate L1 parameter form for the installed scikit-learn version.\n- `SelectFromModel(estimator, threshold)` selects features using the fitted estimator's coefficients. `get_support()` returns a Boolean selection mask.\n- `StandardScaler()` standardizes features without using the target labels.\n\nThe candidate values are chosen to compare strong and weaker L1 penalties and to ensure that the method can produce a reduced feature set.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "from sklearn.feature_selection import SelectFromModel\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn import __version__ as sklearn_version\n\nScaler = StandardScaler()  # required before coefficient-based regularization\n\n# scikit-learn 1.8+ uses l1_ratio=1.0 for pure L1 regularization.\n# Earlier versions use the established penalty='l1' argument.\nSklearn_Major_Minor = tuple(int(part) for part in sklearn_version.split('.')[:2])\nif Sklearn_Major_Minor >= (1, 8):\n    L1_Estimator = LogisticRegression(\n        l1_ratio=1.0, solver='liblinear', max_iter=10000, random_state=42)\nelse:\n    L1_Estimator = LogisticRegression(\n        penalty='l1', solver='liblinear', max_iter=10000, random_state=42)\n\nSelector = SelectFromModel(estimator=L1_Estimator, threshold=1e-5)\n\nModel = SVC()  # downstream classifier to tune\n\n# Parameter grid: <pipeline step>__<parameter> : candidate values\nL1_C_Values = [0.01, 0.03, 0.1, 0.3, 1.0]\nParam_Grid = [\n    {\n        'selector__estimator__C': L1_C_Values,\n        'model__C': [0.1, 1, 10],\n        'model__kernel': ['linear']\n    },\n    {\n        'selector__estimator__C': L1_C_Values,\n        'model__C': [0.1, 1, 10],\n        'model__kernel': ['rbf'],\n        'model__gamma': ['scale', 'auto']\n    }\n]\n\nNumber_Of_Combinations = sum(\n    np.prod([len(v) for v in Grid.values()]) for Grid in Param_Grid)\n\nprint(\"Scaler:\", Scaler)\nprint(\"Selector:\", Selector)\nprint(\"L1 estimator:\", L1_Estimator)\nprint(\"Model:\", Model)\nprint(\"Parameter combinations:\", Number_Of_Combinations)", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Scaler: StandardScaler()\nSelector: SelectFromModel(estimator=LogisticRegression(max_iter=10000, penalty='l1',\n                                             random_state=42,\n                                             solver='liblinear'),\n                threshold=1e-05)\nL1 estimator: LogisticRegression(max_iter=10000, penalty='l1', random_state=42,\n                   solver='liblinear')\nModel: SVC()\nParameter combinations: 45\n"}]}, {"cell_type": "markdown", "source": "## 6. Define the functions\n\nThe following user-defined functions organise feature selection, model tuning and creation of the reduced data set.\n\n### User-defined functions\n\n**`Build_Pipeline_Model(...)`** builds the pipeline and runs `GridSearchCV`. The pipeline performs scaling, fits the L1 selector and then trains the SVC classifier. Every step is re-fitted inside each cross-validation training split.\n\n**`Get_Selected_Features(Trained_Pipeline, Columns)`** uses the selector's `get_support()` mask to return the names of the retained features.\n\n**`Get_Score_Table(Trained_Pipeline, Columns)`** extracts the absolute coefficient magnitudes from the fitted L1 Logistic Regression estimator and records whether each feature was selected.\n\n**`Select_Features(Data, Selected_Features)`** returns a copy of a data frame containing only the selected columns.\n\n### Important built-in functions\n- `Pipeline(steps)` joins scaling, feature selection and classification into one estimator.\n- `StratifiedShuffleSplit(...)` creates train/validation splits while preserving class proportions.\n- `GridSearchCV(...)` tests parameter combinations. `best_estimator_`, `best_params_` and `best_score_` store the best pipeline, parameter settings and mean validation score.\n- `np.abs(...)` calculates the magnitude of each coefficient; `get_support()` returns the feature-selection mask.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "from sklearn.base import clone\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.model_selection import GridSearchCV, StratifiedShuffleSplit\n\n\ndef Build_Pipeline_Model(X_train, y_train, Scaler, Selector, Model, Param_Grid,\n                         N_Splits=5, Test_Size=0.2, Random_State=0):\n    # Pipeline: scale -> fit L1 selector -> classify\n    Steps = [\n        ('scaler', Scaler if Scaler is not None else 'passthrough'),\n        ('selector', Selector),\n        ('model', Model)\n    ]\n    Pipe = Pipeline(Steps)\n\n    # Stratified splits preserve the class proportions in each fold\n    SSP = StratifiedShuffleSplit(n_splits=N_Splits, test_size=Test_Size,\n                                 random_state=Random_State)\n\n    # Compare L1 strength and SVC parameters using training data only\n    Grid_Search = GridSearchCV(\n        estimator=Pipe, param_grid=Param_Grid, cv=SSP,\n        scoring='accuracy', n_jobs=1, verbose=1, refit=True,\n        error_score='raise')\n    Grid_Search.fit(X_train, y_train)\n\n    return (Grid_Search.best_estimator_,\n            Grid_Search.best_params_,\n            Grid_Search.best_score_)\n\n\ndef Get_Selected_Features(Trained_Pipeline, Columns):\n    # Names of features retained by the fitted L1 selector\n    Mask = Trained_Pipeline.named_steps['selector'].get_support()\n    return list(Columns[Mask])\n\n\ndef Get_Score_Table(Trained_Pipeline, Columns):\n    # Absolute coefficient values from the fitted L1 Logistic Regression estimator\n    Fitted_Selector = Trained_Pipeline.named_steps['selector']\n    Coefficients = Fitted_Selector.estimator_.coef_.ravel()\n    Absolute_Coefficients = np.abs(Coefficients)\n\n    Table = pd.DataFrame({\n        'Feature': list(Columns),\n        'L1 coefficient': Coefficients,\n        'Absolute L1 coefficient': Absolute_Coefficients,\n        'Selected': Fitted_Selector.get_support()\n    })\n    return Table.sort_values('Absolute L1 coefficient', ascending=False).reset_index(drop=True)\n\n\ndef Select_Features(Data, Selected_Features):\n    # Keep only selected columns and return an independent copy\n    return Data[Selected_Features].copy()", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 7. L1 feature selection + hyperparameter tuning (training data only)\n\n`Build_Pipeline_Model` receives the unscaled `X_train` and `y_train`. Within every cross-validation split, the pipeline:\n\n1. fits `StandardScaler` using that split's training observations;\n2. fits L1 Logistic Regression and identifies coefficients above the selection threshold;\n3. trains the SVC using only those selected columns;\n4. evaluates the SVC on the validation fold.\n\n`GridSearchCV` compares the L1 estimator's `C` values and the SVC parameters. The best pipeline is then refitted on all training observations. The test set remains untouched.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "Trained_Pipeline, Best_Params, Best_Score = Build_Pipeline_Model(\n    X_train, y_train, Scaler, Selector, Model, Param_Grid)\n\nprint(\"Best parameters:\", Best_Params)\nprint(f\"Best validation score: {Best_Score * 100:.2f}%\")\nprint(\"L1 estimator C (inverse penalty strength):\", Best_Params['selector__estimator__C'])", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Fitting 5 folds for each of 45 candidates, totalling 225 fits\nBest parameters: {'model__C': 0.1, 'model__kernel': 'linear', 'selector__estimator__C': 1.0}\nBest validation score: 97.58%\nL1 estimator C (inverse penalty strength): 1.0\n"}]}, {"cell_type": "markdown", "source": "## 8. L1 coefficient scores and selected features\n\n### 8.1 Coefficient table\n\n`Score_Table` lists all features in descending order of the **absolute L1 coefficient**. A larger absolute coefficient indicates a larger contribution to the fitted linear decision function. Features below the selector threshold are marked `False` in the `Selected` column.\n\nThe sign of the coefficient indicates the direction of the relationship with the positive class; the magnitude is used to judge its strength. Coefficient magnitudes depend on scaling, which is why the selector is fitted after `StandardScaler`.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "# ---- Absolute L1 coefficient of every feature (largest first) ----\nScore_Table = Get_Score_Table(Trained_Pipeline, X_train.columns)\nprint(Score_Table.to_string(index=False, float_format=lambda v: f\"{v:.6g}\"))", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "   Feature  L1 coefficient  Absolute L1 coefficient  Selected\nFeature-24         -3.5299                   3.5299      True\nFeature-11        -2.16784                  2.16784      True\nFeature-28        -1.70545                  1.70545      True\nFeature-21        -1.24872                  1.24872      True\nFeature-22        -1.20546                  1.20546      True\nFeature-16        0.698341                 0.698341      True\nFeature-27        -0.67794                  0.67794      True\nFeature-29       -0.663777                 0.663777      True\nFeature-25       -0.609725                 0.609725      True\n Feature-8         -0.4892                   0.4892      True\n Feature-2       -0.397179                 0.397179      True\nFeature-15       -0.198856                 0.198856      True\nFeature-20        0.190994                 0.190994      True\nFeature-10       0.0806307                0.0806307      True\nFeature-18      -0.0726104                0.0726104      True\nFeature-12       0.0245684                0.0245684      True\nFeature-23               0                        0     False\nFeature-26               0                        0     False\n Feature-1               0                        0     False\nFeature-19               0                        0     False\nFeature-17               0                        0     False\nFeature-14               0                        0     False\nFeature-13               0                        0     False\n Feature-9               0                        0     False\n Feature-7               0                        0     False\n Feature-6               0                        0     False\n Feature-5               0                        0     False\n Feature-4               0                        0     False\n Feature-3               0                        0     False\nFeature-30               0                        0     False\n"}]}, {"cell_type": "markdown", "source": "### 8.2 Selected features and the reduced data set\n\n- **`Selected`** contains the names of the features whose fitted L1 coefficients exceed the selector threshold.\n- **`X_train_New`** and **`X_test_New`** contain only those columns for the training and testing observations.\n- **`New_Data`** contains the selected features for all observations and the target. It remains in memory; no CSV file is written.\n- **`Selected_Feature_Map`** connects generic feature names to the original diagnostic measurement names.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "# ---- Selected features and reduced training/testing data ----\nSelected = Get_Selected_Features(Trained_Pipeline, X_train.columns)\nX_train_New = Select_Features(X_train, Selected)\nX_test_New = Select_Features(X_test, Selected)\n\n# Reduced data set for inspection (kept in memory; no CSV export)\nNew_Data = Select_Features(X, Selected)\nNew_Data['Target'] = y\n\nSelected_Feature_Map = Feature_Name_Map[Feature_Name_Map['Feature'].isin(Selected)]\n\nprint(\"L1 estimator C:\", Best_Params['selector__estimator__C'])\nprint(\"Number of selected features:\", len(Selected), \"out of\", X.shape[1])\nprint(\"Selected features:\", Selected)\nprint(\"\\nOriginal measurement names:\")\nprint(Selected_Feature_Map.to_string(index=False))\nprint(\"\\nNew training data:\", X_train_New.shape)\nprint(\"New testing data:\", X_test_New.shape)\nprint(\"Reduced data set (first five rows):\")", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "L1 estimator C: 1.0\nNumber of selected features: 16 out of 30\nSelected features: ['Feature-2', 'Feature-8', 'Feature-10', 'Feature-11', 'Feature-12', 'Feature-15', 'Feature-16', 'Feature-18', 'Feature-20', 'Feature-21', 'Feature-22', 'Feature-24', 'Feature-25', 'Feature-27', 'Feature-28', 'Feature-29']\n\nOriginal measurement names:\n   Feature    Original measurement\n Feature-2            mean texture\n Feature-8     mean concave points\nFeature-10  mean fractal dimension\nFeature-11            radius error\nFeature-12           texture error\nF t_transform(X_train_New),\n        columns=X_train_New.columns, index=X_train_New.index)\n    X_test_Final = pd.DataFrame(\n        Final_Scaler.transform(X_test_New),\n        columns=X_test_New.columns, index=X_test_New.index)\nelse:\n    X_train_Final, X_test_Final = X_train_New, X_test_New\n\n# ---- Train on selected features and evaluate on the held-out test data ----\nFinal_Model.fit(X_train_Final, y_train)\ny_pred = Final_Model.predict(X_test_Final)\nFinal_Accuracy = accuracy_score(y_test, y_pred)\n\nprint(\"Final model:\", Final_Model)\nprint(f\"Final test accuracy: {Final_Accuracy * 100:.2f}%\")", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Final model: SVC(C=0.1, kernel='linear')\nFinal test accuracy: 98.25%\n"}]}, {"cell_type": "markdown", "source": "## 10. Final result\n\nThis summary compares the two all-feature baseline results with the L1-selected feature result. The validation score comes from cross-validation on the training data; the final test accuracy is measured on the untouched test set.\n\nRemember: L1 regularization selects features by shrinking some Logistic Regression coefficients to zero. The number of retained features depends on the selected regularization strength, the data and the coefficient threshold.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "print(\"Selection method: L1-regularized Logistic Regression (SelectFromModel)\")\nprint(\"Best L1 estimator C:\", Best_Params['selector__estimator__C'])\nprint(\"Number of selected features:\", len(Selected), \"out of\", X.shape[1])\nprint(\"Selected features:\", Selected)\nprint(\"Selected original measurements:\", Selected_Feature_Map['Original measurement'].tolist())\nprint(\"Best SVC parameters:\", Model_Params)\nprint(\"Reduced data set shape (in memory):\", New_Data.shape)\nprint(f\"Baseline accuracy (all features, NOT scaled): {Baseline_Accuracy_Unscaled * 100:.2f}%\")\nprint(f\"Baseline accuracy (all features, Standard-
