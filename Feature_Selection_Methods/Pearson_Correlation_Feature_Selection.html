<script id="data" type="application/json">[{"cell_type": "markdown", "source": "# Filter Methods: Pearson's Correlation for Feature Selection\n\n**Data.** A machine-learning data set is a table. Each **row** represents one observation, each input **column** is a feature, and the output column is the **target** (the value or class to be predicted).\n\n**Feature selection** keeps informative features and removes irrelevant or repeated information. It can make a model simpler, reduce computation, limit noise and help us understand which measurements are useful.\n\n## Filter, wrapper and embedded methods\n\n| Family | Main idea |\n|---|---|\n| **Filter methods** | Score features using statistical properties of the data, without training a prediction model. **(This notebook)** |\n| Wrapper methods | Test different feature groups by training and evaluating a model. |\n| Embedded methods | Select features as part of the model-training process. |\n\n## What is correlation?\n\n**Correlation** describes how two numerical quantities vary together.\n\n- **Positive correlation:** larger values of one quantity tend to occur with larger values of the other.\n- **Negative correlation:** larger values of one quantity tend to occur with smaller values of the other.\n- **Near-zero correlation:** there is little or no *linear* relationship. A non-linear relationship may still exist.\n\nThe strength of a linear correlation is reflected by how closely the points follow a straight-line pattern.\n\n![Positive, near-zero and negative correlation](attachment:correlation_types.png)\n\nCorrelation is **not causation**: two quantities can vary together without one causing the other.\n\n## Pearson's correlation coefficient\n\nPearson's correlation coefficient, written as $r$, measures the **direction and strength of the linear relationship** between two numerical variables $x$ and $y$. For $n$ pairs of values $(x_i,y_i)$ with means $\\bar{x}$ and $\\bar{y}$,\n\n$$\nr=\\frac{\\sum_{i=1}^{n}(x_i-\\bar{x})(y_i-\\bar{y})}\n{\\sqrt{\\sum_{i=1}^{n}(x_i-\\bar{x})^2}\\,\\sqrt{\\sum_{i=1}^{n}(y_i-\\bar{y})^2}}\n$$\n\nThe numerator measures whether the two variables tend to be above or below their means together. The denominator normalises the result, so $r$ has no units and always lies between $-1$ and $+1$.\n\n![Scale of Pearson's correlation coefficient](attachment:correlation_scale.png)\n\n| Value of $r$ | Meaning |\n|---|---|\n| $+1$ | Perfect positive linear relationship |\n| $-1$ | Perfect negative linear relationship |\n| $0$ or close to $0$ | No or little linear relationship; a non-linear relationship may still exist |\n| $|r|$ close to $1$ | Strong linear relationship |\n| $|r|$ close to $0$ | Weak linear relationship |\n\n**Important properties**\n\n- It is symmetric: $r(x,y)=r(y,x)$.\n- Shifting a variable or multiplying it by a positive constant does not change $r$. Multiplication by a negative constant reverses its sign.\n- It detects linear relationships and can miss strong curved relationships.\n- It is sensitive to outliers.\n- For a binary target coded as 0 and 1, Pearson's coefficient can also be calculated; its sign indicates the direction of the association with the class label.\n\n## Pearson's correlation for feature selection\n\nPearson's correlation is a **filter method**. It is used in two complementary ways:\n\n1. **Feature versus target (relevance):** calculate $|r|$ between each feature and the target. A larger value indicates a stronger linear association with the target. In this notebook, these values are used to rank the features from strongest to weakest.\n2. **Feature versus feature (redundancy):** calculate $|r|$ between pairs of features. If this value is above a chosen threshold, the two features contain similar information. The feature with the stronger target relationship is considered first and retained; the later, redundant feature is removed.\n\n![Two uses of Pearson's correlation in feature selection](attachment:two_uses.png)\n\n### Selection algorithm used in this notebook\n\n1. Calculate the Pearson correlation between every feature and the target.\n2. Sort the features by absolute target correlation, with the largest value first.\n3. Start with an empty list named `kept` and choose a redundancy threshold $T$.\n4. Take the next feature $F$ and calculate its absolute correlation with every feature already in `kept`.\n5. If any of these pairwise values is greater than $T$, discard $F$ as redundant. Otherwise, add $F$ to `kept`.\n6. Repeat until all features have been checked. The features in `kept` are the selected features.\n\n![Flow chart for Pearson correlation feature selection](attachment:pearson_selection_flowchart.png)\n\n**Threshold note:** the implementation in this notebook uses one threshold, `selector__threshold`, for feature-versus-feature redundancy. The feature-versus-target correlations determine the ranking; a separate target-correlation cut-off is not applied.\n\n## Advantages and limitations\n\n- **Advantages:** fast, simple, model-independent, works with negative values, and can remove redundant features.\n- **Limitations:** detects only linear relationships, is sensitive to outliers, considers feature pairs rather than groups of features, and requires a suitable redundancy threshold.\n\n## What this notebook does\n\nThe notebook uses the **Breast Cancer** data set from `scikit-learn` (569 observations, 30 numerical features) and an **SVC** classifier. The data is divided into 80% training and 20% testing sets. Feature selection and hyperparameter tuning are performed using the training data only. The redundancy threshold and SVC hyperparameters are compared by cross-validation; the held-out test data is used only for the final evaluation.\n", "attachments": {"correlation_scale.png": {"image/png": "iVBORw0KGgoAAAANSUhEUgAABZEAAAFICAYAAAAhybAyAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAaJQAAGiUBh+i34AAAYR AAAAAAAAAAAADAQ4Q0AAAAAAAAAAAAAAAADEd4AAAAAAAAAAAAAAAAwEOENAAAAAAAAAAAAAAAAAxHeAAAAAAAAAAAAAAAAMBDhDQAAAAAAAAAAAAAAAAMR3gAAAAAAAAAAAAAAADAQ4Q0AAAAAAAAAAAAAAAADEd4AAAAAAAAAAAAAAAAwEOENAAAAAAAAAAAAAAAAAxHeAAAAAAAAAAAAAAAAMBDhDQAAAAAAAAAAAAAAAAMR3gAAAAAAAAAAAAAAADAQ4Q0AAAAAAAAAAAAAAAADEd4AAAAAAAAAAAAAAAAwEOENAAAAAAAAAAAAAAAAAxHeAAAAAAAAAAAAAAAAMBDhDQAAAAAAAAAAAAAAAAMR3gAAAAAAAAAAAAAAADAQ4Q0AAAAAAAAAAAAAAAADEd4AAAAAAAAAAAAAAAAwEOENAAAAAAAAAAAAAAAAAxHeAAAAAAAAAAAA+H+7diwAAAAAMMjfehh7iiMAgJG8AQAAAAAAAAAwkjcAAAAAAAAAAEbyBgAAAAAAAADASN4AAAAAAAAAABjJGwAAAAAAAAAAI3kDAAAAAAAAAGAkbwAAAAAAAAAAjOQNAAAAAAAAAICRvAEAAAAAAAAAMArTmWkLrGNqjgAAAABJRU5ErkJggg=="}}, "outputs": []}, {"cell_type": "markdown", "source": "# Algorithm / flow of the program (Pearson's correlation)\n\n1. **Load** the Breast Cancer data set: `X` contains the features and `y` contains the target.\n2. **Prepare** the data: assign generic feature names and convert `X` and `y` to pandas objects.\n3. **Split** the data into 80% training data and 20% testing data.\n4. **Baseline models:** train SVC with all features, first without scaling and then with `StandardScaler`.\n5. **Define the components:** set the scaler, Pearson selector, SVC model and parameter grid.\n6. **Define the functions:** build the pipeline and grid search, retrieve selected features, create the correlation score table and make a reduced data set.\n7. **Select features and tune parameters:** use only the training data. In each cross-validation split, fit the scaler and Pearson selector on the training fold, then evaluate SVC on the validation fold. Compare the candidate redundancy thresholds and SVC parameters using mean validation accuracy.\n8. **Inspect and save results:** display the correlation scores, identify selected features, save the reduced data set as CSV, and plot the feature-correlation matrix.\n9. **Train and test the final model:** train SVC using the selected training features and evaluate it on the selected testing features.\n10. **Summarise** the selected features, best parameters, baseline accuracies, validation score and final test accuracy.\n\nThe held-out test data is not used for feature selection or hyperparameter tuning.", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 1. Load the dataset\n\nThe Breast Cancer data set from `scikit-learn` contains **569 observations**, **30 numerical features** and a binary target (class labels 0 and 1).\n\n**New variables**\n- `SKLBC_Data_Set`: the loaded data-set object (`Bunch`).\n- `X`: the two-dimensional feature array.\n- `y`: the one-dimensional target array.\n\n**Functions and attributes**\n- `load_breast_cancer()` loads the data set.\n- `SKLBC_Data_Set.data` provides the feature values; `SKLBC_Data_Set.target` provides the class labels.\n- `pandas` (`pd`) and `numpy` (`np`) are used in later cells for tables and numerical operations.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "import pandas as pd\nimport numpy as np\nfrom sklearn.datasets import load_breast_cancer\nfrom sklearn.model_selection import train_test_split\n\nSKLBC_Data_Set = load_breast_cancer()    # Load the dataset\n\n# Access the components\nX = SKLBC_Data_Set.data                  # 2D array: 569 samples x 30 features\ny = SKLBC_Data_Set.target                # 1D array: target labels (0 or 1)\n\nprint(\"Feature data shape:\", X.shape)\nprint(\"Target shape:\", y.shape)", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Feature data shape: (569, 30)\nTarget shape: (569,)\n"}]}, {"cell_type": "markdown", "source": "## 2. Prepare features and target\n\nThe original feature names are replaced by `Feature-1`, `Feature-2`, ... so the remaining program can use the same generic column names. A mapping table preserves the connection to the original feature names.\n\n- `X` is stored as a pandas **DataFrame** and `y` as a pandas **Series**.\n- All features are already numerical, and the target is already encoded as 0 and 1; no encoding is required.\n\n**New variables**\n- `X_columns`: the generic feature names.\n- `X`: the feature DataFrame.\n- `y`: the target Series.\n- `Feature_Name_Map`: the generic-to-original feature-name table.\n\n**Functions and attributes**\n- `X.shape[1]` gives the number of feature columns.\n- `pd.DataFrame(data, columns=...)` creates a labelled table.\n- `pd.Series(data, name=...)` creates a labelled one-dimensional target.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "# Rename the features dynamically: Feature-1, Feature-2, ...\nX_columns = [\"Feature-\" + str(i+1) for i in range(X.shape[1])]\n\nX = pd.DataFrame(X, columns=X_columns)\ny = pd.Series(y, name=\"Target\")\n\n# Keep the original feature names for reference\nFeature_Name_Map = pd.DataFrame({\"Feature\": X_columns,\"Original feature name\": SKLBC_Data_Set.feature_names})\n\nprint(\"Feature table:\", X.shape)\nprint(\"Target:\", y.shape)\nFeature_Name_Map.head(10)", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Feature table: (569, 30)\nTarget: (569,)\n"}, {"output_type": "execute_result", "data": {"text/plain": "      Feature   Original feature name\n0   Feature-1             mean radius\n1   Feature-2            mean texture\n2   Feature-3          mean perimeter\n3   Feature-4               mean area\n4   Feature-5         mean smoothness\n5   Feature-6        mean compactness\n6   Feature-7          mean concavity\n7   Feature-8     mean concave points\n8   Feature-9           mean symmetry\n9  Feature-10  mean fractal dimension", "text/html": "<div>\n<style scoped>\n    .dataframe tbody tr th:only-of-type {\n        vertical-align: middle;\n    }\n\n    .dataframe tbody tr th {\n        vertical-align: top;\n    }\n\n    .dataframe thead th {\n        text-align: right;\n    }\n<\/style>\n<table border=\"1\" class=\"dataframe\">\n  <thead>\n    <tr style=\"text-align: right;\">\n      <th><\/th>\n      <th>Feature<\/th>\n      <th>Original feature name<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <th>0<\/th>\n      <td>Feature-1<\/td>\n      <td>mean radius<\/td>\n    <\/tr>\n    <tr>\n      <th>1<\/th>\n      <td>Feature-2<\/td>\n      <td>mean texture<\/td>\n    <\/tr>\n    <tr>\n      <th>2<\/th>\n      <td>Feature-3<\/td>\n      <td>mean perimeter<\/td>\n    <\/tr>\n    <tr>\n      <th>3<\/th>\n      <td>Feature-4<\/td>\n      <td>mean area<\/td>\n    <\/tr>\n    <tr>\n      <th>4<\/th>\n      <td>Feature-5<\/td>\n      <td>mean smoothness<\/td>\n    <\/tr>\n    <tr>\n      <th>5<\/th>\n      <td>Feature-6<\/td>\n      <td>mean compactness<\/td>\n    <\/tr>\n    <tr>\n      <th>6<\/th>\n      <td>Feature-7<\/td>\n      <td>mean concavity<\/td>\n    <\/tr>\n    <tr>\n      <th>7<\/th>\n      <td>Feature-8<\/td>\n      <td>mean concave points<\/td>\n    <\/tr>\n    <tr>\n      <th>8<\/th>\n      <td>Feature-9<\/td>\n      <td>mean symmetry<\/td>\n    <\/tr>\n    <tr>\n      <th>9<\/th>\n      <td>Feature-10<\/td>\n      <td>mean fractal dimension<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n<\/div>"}}]}, {"cell_type": "markdown", "source": "## 3. Train / test split\n\nThe data is divided into **80% training** and **20% testing** rows. Feature selection and hyperparameter tuning use the training data only. The test data is kept aside for the final evaluation.\n\n`stratify=y` keeps approximately the same class proportions in both parts.\n\n**New variables:** `X_train`, `y_train` (training data) and `X_test`, `y_test` (testing data).\n\n**Function and arguments**\n- `train_test_split(X, y, test_size=0.20, random_state=42, shuffle=True, stratify=y)` returns `X_train`, `X_test`, `y_train`, `y_test` in that order.\n- `test_size=0.20` reserves 20% for testing; `random_state=42` makes the split repeatable; `shuffle=True` shuffles the rows; `stratify=y` preserves class proportions.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "X_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=0.20, random_state=42, shuffle=True, stratify=y)\n\nprint(\"Complete dataset:\", X.shape)\nprint(\"Training features:\", X_train.shape)\nprint(\"Testing features:\", X_test.shape)\nprint(\"Training targets:\", y_train.shape)\nprint(\"Testing targets:\", y_test.shape)", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Complete dataset: (569, 30)\nTraining features: (455, 30)\nTesting features: (114, 30)\nTraining targets: (455,)\nTesting targets: (114,)\n"}]}, {"cell_type": "markdown", "source": "## 4. Baselines: SVC on all features\n\nA **baseline** is a reference result used for comparison. Before feature selection, SVC is trained with all 30 features using fixed hyperparameters. Two baselines are evaluated: one without scaling and one with `StandardScaler`.\n\n### 4.1 All features, NOT scaled\n\nAn RBF-kernel SVC uses distances between observations. If features have very different numerical ranges, large-range features can dominate these distances. This baseline shows the performance before scaling.\n\n**New variables**\n- `params`: the fixed SVC hyperparameters.\n- `Baseline_Model_Unscaled`: the SVC model trained without scaling.\n- `Baseline_Accuracy_Unscaled`: its test accuracy.\n\n**Functions**\n- `SVC(C, kernel, gamma)` creates the classifier. `C` controls the error penalty, `kernel='rbf'` selects the radial-basis-function kernel, and `gamma` controls the influence of individual training observations.\n- `.fit(X_train, y_train)` trains the model; `.predict(X_test)` predicts test labels.\n- `accuracy_score(y_true, y_pred)` calculates the fraction of correct predictions.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "from sklearn.svm import SVC\nfrom sklearn.metrics import accuracy_score\n\nparams = {'C': 0.25, 'gamma': 'auto', 'kernel': 'rbf'}     # fixed hyperparameters\n\n# ---- Baseline 1: all features, NOT scaled ----\nBaseline_Model_Unscaled = SVC(**params)\nBaseline_Model_Unscaled.fit(X_train, y_train)\nBaseline_Accuracy_Unscaled = accuracy_score(y_test, Baseline_Model_Unscaled.predict(X_test))\n\nprint(f\"Accuracy (all features, NOT scaled): {Baseline_Accuracy_Unscaled * 100:.2f}%\")", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Accuracy (all features, NOT scaled): 63.16%\n"}]}, {"cell_type": "markdown", "source": "### 4.2 All features, Standard-scaled\n\nSVC with an RBF kernel is distance-based. Standardisation puts the feature columns on comparable scales:\n\n$$z=\\frac{x-\\mu}{\\sigma}$$\n\nwhere $\\mu$ and $\\sigma$ are calculated from the training data.\n\n**Why scale here?** Standardisation is useful for SVC. It is not required for Pearson's correlation because a positive shift-and-scale transformation does not change the correlation coefficient.\n\n**Avoiding data leakage:** the scaler learns its mean and standard deviation from the training data only. The same values are then applied to the test data.\n\n**New variables:** `Baseline_Scaler`, `X_train_Scaled`, `X_test_Scaled`, `Baseline_Model_Scaled` and `Baseline_Accuracy_Scaled`.\n\n**Functions**\n- `StandardScaler()` creates the scaling transformer.\n- `.fit_transform(X_train)` learns the scaling values and transforms the training data.\n- `.transform(X_test)` applies the learned values to the test data.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "from sklearn.preprocessing import StandardScaler\n\n# ---- Baseline 2: all features, Standard-scaled ----\nBaseline_Scaler = StandardScaler()\nX_train_Scaled = Baseline_Scaler.fit_transform(X_train)\nX_test_Scaled = Baseline_Scaler.transform(X_test)\n\nBaseline_Model_Scaled = SVC(**params)\nBaseline_Model_Scaled.fit(X_train_Scaled, y_train)\nBaseline_Accuracy_Scaled = accuracy_score(y_test, Baseline_Model_Scaled.predict(X_test_Scaled))\n\nprint(f\"Accuracy (all features, Standard-scaled): {Baseline_Accuracy_Scaled * 100:.2f}%\")", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Accuracy (all features, Standard-scaled): 96.49%\n"}]}, {"cell_type": "markdown", "source": "## 5. Define the components (change only this cell for other methods)\n\nThis section defines the four components used by the pipeline. The Pearson selector is a custom scikit-learn transformer so that feature selection is repeated independently inside every cross-validation training fold.\n\n- **`Scaler`**: `StandardScaler()` standardises the features for SVC. Scaling is not required for Pearson's correlation because a positive shift-and-scale transformation does not change its value.\n- **`Selector`**: `PearsonCorrelationSelector(threshold=0.90)` ranks features by absolute correlation with the target, then removes a feature when its absolute correlation with any previously retained feature is greater than the threshold.\n- **`Model`**: `SVC()` is the classifier whose hyperparameters are tuned by the grid search.\n- **`Param_Grid`**: the dictionary of candidate values. The keys use the form `<step name>__<parameter>`; the step names are `selector` and `model`.\n  - `selector__threshold` gives the redundancy thresholds to compare.\n  - `model__C`, `model__gamma` and `model__kernel` give the SVC settings to compare.\n  - There are 5 threshold values × 3 values of `C` × 2 values of `gamma` × 1 kernel = **30 parameter combinations**.\n\n### Pearson selector\n\n`PearsonCorrelationSelector` follows the scikit-learn transformer pattern:\n\n- `fit(X, y)` calculates feature-target and feature-feature correlations, ranks the features, and stores the selected-feature mask.\n- `transform(X)` returns only the selected columns.\n- `get_support()` returns the Boolean mask (`True` means selected).\n\nThe selector requires finite numerical values. Missing values should therefore be handled before feature selection. A constant feature is assigned a correlation of zero by this implementation.\n\n**Threshold interpretation:** with `threshold=0.90`, a feature is discarded when its absolute correlation with at least one feature already in `kept` is **greater than 0.90**. The grid search chooses the threshold that gives the best mean cross-validation accuracy.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "from sklearn.base import BaseEstimator, TransformerMixin, clone\nfrom sklearn.utils.validation import check_is_fitted\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.model_selection import GridSearchCV, StratifiedShuffleSplit\n\nclass PearsonCorrelationSelector(BaseEstimator, TransformerMixin):\n    \"\"\"Rank features by |Pearson r| with y and remove redundant features.\"\"\"\n\n    def __init__(self, threshold=0.90):\n        self.threshold = threshold\n\n    def fit(self, X, y):\n        X = np.asarray(X, dtype=float)\n        y = np.asarray(y, dtype=float).reshape(-1)\n\n        if X.ndim != 2:\n            raise ValueError(\"X must be a two-dimensional array.\")\n        if X.shape[0] != y.shape[0]:\n            raise ValueError(\"X and y must contain the same number of rows.\")\n        if not np.isfinite(X).all() or not np.isfinite(y).all():\n            raise ValueError(\"Pearson selection requires finite values. Handle missing values first.\")\n        if not 0 <= self.threshold <= 1:\n            raise ValueError(\"threshold must be between 0 and 1.\")\n\n        # Centre each feature and the target by subtracting their means\n        X_Centred = X - np.mean(X, axis=0)\n        y_Centred = y - np.mean(y)\n\n        # Pearson r between every feature and the target\n        X_Norm = np.sqrt(np.sum(X_Centred ** 2, axis=0))\n        y_Norm = np.sqrt(np.sum(y_Centred ** 2))\n        Denominator = X_Norm * y_Norm\n        Feature_Target_Corr = np.zeros(X.shape[1], dtype=float)\n        np.divide(X_Centred.T @ y_Centred, Denominator,\n                  out=Feature_Target_Corr, where=Denominator > 0)\n\n        # Pearson correlation matrix between all pairs of features\n        Feature_Feature_Denominator = np.outer(X_Norm, X_Norm)\n        Feature_Feature_Corr = np.zeros((X.shape[1], X.shape[1]), dtype=float)\n        np.divide(X_Centred.T @ X_Centred, Feature_Feature_Denominator,\n                  out=Feature_Feature_Corr, where=Feature_Feature_Denominator > 0)\n\n        # Avoid tiny floating-point values outside the theoretical range\n        Feature_Target_Corr = np.clip(Feature_Target_Corr, -1.0, 1.0)\n        Feature_Feature_Corr = np.clip(Feature_Feature_Corr, -1.0, 1.0)\n\n        # Visit the features from the strongest to the weakest target relation\n        Feature_Order = np.argsort(-np.abs(Feature_Target_Corr), kind='stable')\n        Kept_Indices = []\n        Max_Corr_With_Kept = np.zeros(X.shape[1], dtype=float)\n        Redundant_With = np.full(X.shape[1], -1, dtype=int)\n\n        for Feature_Index in Feature_Order:\n            if len(Kept_Indices) == 0:\n                Kept_Indices.append(Feature_Index)\n                continue\n\n            # Find the largest |r| with any feature already in the kept list\n            Pair_Correlations = np.abs(Feature_Feature_Corr[Feature_Index, Kept_Indices])\n            Max_Position = int(np.argmax(Pair_Correlations))\n            Max_Correlation = float(Pair_Correlations[Max_Position])\n            Max_Corr_With_Kept[Feature_Index] = Max_Correlation\n\n            if Max_Correlation > self.threshold:\n                # Record the stronger, already-kept feature responsible for removal\n                Redundant_With[Feature_Index] = Kept_Indices[Max_Position]\n            else:\n                Kept_Indices.append(Feature_Index)\n\n        self.n_features_in_ = X.shape[1]\n        self.feature_target_corr_ = Feature_Target_Corr\n        self.feature_feature_corr_ = Feature_Feature_Corr\n        self.feature_order_ = Feature_Order\n        self.selected_indices_ = np.asarray(Kept_Indices, dtype=int)\n        self.support_ = np.zeros(X.shape[1], dtype=bool)\n        self.support_[self.selected_indices_] = True\n        self.max_corr_with_kept_ = Max_Corr_With_Kept\n        self.redundant_with_ = Redundant_With\n        return self\n\n    def transform(self, X):\n        check_is_fitted(self, attributes=['support_'])\n        X = np.asarray(X, dtype=float)\n        if X.ndim != 2 or X.shape[1] != self.n_features_in_:\n            raise ValueError(\"X must have the same number of feature columns used during fit.\")\n        return X[:, self.support_]\n\n    def get_support(self):\n        check_is_fitted(self, attributes=['support_'])\n        return self.support_.copy()\n\n# ---- Components used by the pipeline ----\n\n# 1. Scaler: standardisation for the SVC model\nScaler = StandardScaler()\n\n# 2. Selector: Pearson correlation with feature-redundancy removal\nSelector = PearsonCorrelationSelector(threshold=0.90)\n\n# 3. Model: classifier whose hyperparameters will be tuned\nModel = SVC()\n\n# 4. Parameter grid: candidate thresholds and SVC hyperparameters\nParam_Grid = {\n    'selector__threshold': [0.80, 0.85, 0.90, 0.95, 0.98],\n    'model__C': [0.1, 1, 10],\n    'model__gamma': ['scale', 'auto'],\n    'model__kernel': ['rbf']\n}\n\nprint(\"Selector:\", Selector)\nprint(\"Scaler:\", Scaler)\nprint(\"Model:\", Model)\nprint(\"Parameter combinations:\", np.prod([len(v) for v in Param_Grid.values()]))", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Selector: PearsonCorrelationSelector()\nScaler: StandardScaler()\nModel: SVC()\nParameter combinations: 30\n"}]}, {"cell_type": "markdown", "source": "## 6. Define the functions\n\nThe following user-defined functions organise feature selection, model tuning and the creation of the reduced data set.\n\n### User-defined functions\n\n**`Build_Pipeline_Model(X_train, y_train, Scaler, Selector, Model, Param_Grid, N_Splits=5, Test_Size=0.2, Random_State=0)`** builds and tunes the complete pipeline.\n- The pipeline order is **scaler → selector → model**.\n- `X_train` and `y_train` are the training features and labels. The testing data is not passed to this function.\n- `Scaler`, `Selector` and `Model` are the components from section 5; `Param_Grid` contains the candidate settings.\n- `N_Splits=5` sets the number of stratified random splits; `Test_Size=0.2` sets the validation fraction in each split; `Random_State=0` makes the splits repeatable.\n- It returns the best fitted pipeline, its best parameters and its mean validation score.\n\n**`Get_Selected_Features(Trained_Pipeline, Columns)`** returns the names of the retained columns. It obtains the fitted selector's Boolean mask and applies it to `Columns`.\n\n**`Get_Score_Table(Trained_Pipeline, Columns)`** creates a table containing the signed and absolute feature-target correlations, the maximum absolute correlation with an already-kept feature, the selection status and the feature responsible for removing a redundant feature.\n\n**`Select_Features(Data, Selected_Features)`** returns a copy of `Data` containing only the selected columns. It is used for the training data, testing data and complete data set.\n\n### Built-in functions and their arguments\n\n- `Pipeline(steps)` chains the scaler, selector and model. Each step is fitted using only the training part of the current cross-validation split. Caching is not used because the Pearson calculations are inexpensive for this data set.\n- `StratifiedShuffleSplit(n_splits, test_size, random_state)` creates random training/validation splits while approximately preserving the target-class proportions.\n- `GridSearchCV(estimator, param_grid, cv, scoring, n_jobs, verbose)` tests every parameter combination on the specified splits. Here, `scoring='accuracy'`, `n_jobs=-1` uses all available CPU cores, and `verbose=1` displays progress.\n- `Grid_Search.fit(X_train, y_train)` runs the search. `best_estimator_` is refitted on all training data; `best_params_` stores the winning settings; `best_score_` stores the mean validation score.\n- `Trained_Pipeline.named_steps['selector']` retrieves the fitted selector. Its `get_support()` method returns the selection mask.\n- `np.abs(...)` calculates absolute correlation values, and `pd.DataFrame({...})` creates the score table from named columns.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "def Build_Pipeline_Model(X_train, y_train, Scaler, Selector, Model, Param_Grid,\n                         N_Splits=5, Test_Size=0.2, Random_State=0):\n    # Pipeline: scale -> select features -> classify\n    Steps = [('scaler', Scaler if Scaler is not None else 'passthrough'),\n             ('selector', Selector),\n             ('model', Model)]\n    Pipe = Pipeline(Steps)  # Pearson calculations are inexpensive; caching is unnecessary\n\n    # Stratified random splits preserve class proportions in each fold\n    SSP = StratifiedShuffleSplit(n_splits=N_Splits, test_size=Test_Size,\n                                 random_state=Random_State)\n\n    # Test every combination of threshold and model hyperparameters\n    Grid_Search = GridSearchCV(estimator=Pipe, param_grid=Param_Grid,\n                               cv=SSP, scoring='accuracy', n_jobs=1,\n                               verbose=1, refit=True)\n    Grid_Search.fit(X_train, y_train)\n\n    # Return the best fitted pipeline, its parameters and mean CV accuracy\n    return Grid_Search.best_estimator_, Grid_Search.best_params_, Grid_Search.best_score_\n\n\ndef Get_Selected_Features(Trained_Pipeline, Columns):\n    # Names of the columns retained by the fitted selector\n    Mask = Trained_Pipeline.named_steps['selector'].get_support()\n    return list(Columns[Mask])\n\n\ndef Get_Score_Table(Trained_Pipeline, Columns):\n    # Extract the fitted selector from the best pipeline\n    Fitted_Selector = Trained_Pipeline.named_steps['selector']\n    Support = Fitted_Selector.get_support()\n\n    # Convert the index of the redundant feature into its feature name\n    Redundant_Names = [\n        Columns[Index] if Index >= 0 else \"-\"\n        for Index in Fitted_Selector.redundant_with_\n    ]\n\n    Score_Table = pd.DataFrame({\n        'Feature': list(Columns),\n        'Pearson r with target': Fitted_Selector.feature_target_corr_,\n        '|r| with target': np.abs(Fitted_Selector.feature_target_corr_),\n        'Max |r| with kept feature': Fitted_Selector.max_corr_with_kept_,\n        'Selected': Support,\n        'Redundant with': Redundant_Names\n    })\n    return Score_Table.sort_values('|r| with target', ascending=False).reset_index(drop=True)\n\n\ndef Select_Features(Data, Selected_Features):\n    # Keep only the requested columns and make an independent copy\n    return Data[Selected_Features].copy()", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 7. Feature selection + hyperparameter tuning (training data only)\n\n`Build_Pipeline_Model` receives `X_train` and `y_train`. The pipeline performs scaling, Pearson feature selection and SVC classification inside each cross-validation split. The held-out test data is not used.\n\nFor every candidate threshold and SVC parameter combination, `GridSearchCV` evaluates the pipeline on the validation parts and records the mean accuracy. The best pipeline is then refitted on the complete training data.\n\n**Returned variables**\n- `Trained_Pipeline`: the best pipeline, refitted on all training data.\n- `Best_Params`: the winning redundancy threshold and SVC hyperparameters.\n- `Best_Score`: the mean cross-validation accuracy of the winning combination.\n\n`verbose=1` displays the grid-search progress. The total number of fits is the number of parameter combinations multiplied by the number of cross-validation splits.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "Trained_Pipeline, Best_Params, Best_Score = Build_Pipeline_Model(\n    X_train, y_train, Scaler, Selector, Model, Param_Grid)\n\nprint(\"Best parameters:\", Best_Params)\nprint(f\"Best validation score: {Best_Score * 100:.2f}%\")", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Fitting 5 folds for each of 30 candidates, totalling 150 fits\nBest parameters: {'model__C': 1, 'model__gamma': 'scale', 'model__kernel': 'rbf', 'selector__threshold': 0.8}\nBest validation score: 97.58%\n"}]}, {"cell_type": "markdown", "source": "## 8. Correlation scores, selected features and the new data set\n\n### 8.1 Correlation score table\n\n`Score_Table` is obtained from the fitted selector and sorted by absolute feature-target correlation, largest first.\n\n- **Pearson r with target:** signed feature-target correlation.\n- **|r| with target:** strength of the linear relationship with the target.\n- **Max |r| with kept feature:** largest absolute correlation with a feature already retained when the current feature was examined.\n- **Selected:** `True` when the feature is retained.\n- **Redundant with:** the retained feature responsible for discarding the current feature; `-` means it was not discarded.\n\n### 8.2 Create the reduced data set\n\n- `Selected` contains the retained feature names.\n- `X_train_New` and `X_test_New` contain only those features for training and testing.\n- `New_Data` contains the selected original (unscaled) feature values from all observations, together with the target.\n- The reduced data set is saved as a CSV file.\n\n### 8.3 Visualise the correlation matrix\n\nThe heat map shows feature-to-feature Pearson correlations for the 12 features with the largest absolute target correlation. It is calculated from the **training data only**. The matrix is symmetric, and each non-constant feature has a diagonal value of 1.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "# ---- Correlation score table for all features ----\nScore_Table = Get_Score_Table(Trained_Pipeline, X_train.columns)\nScore_Table", "attachments": {}, "outputs": [{"output_type": "execute_result",    if Key.startswith('model__')\n}\nFinal_Model = clone(Model).set_params(**Model_Params)\n\n# ---- Scale the reduced data (learn from the training data only) ----\nif Scaler is not None:\n    Final_Scaler = clone(Scaler)\n    X_train_Final = pd.DataFrame(\n        Final_Scaler.fit_transform(X_train_New),\n        columns=X_train_New.columns, index=X_train_New.index)\n    X_test_Final = pd.DataFrame(\n        Final_Scaler.transform(X_test_New),\n        columns=X_test_New.columns, index=X_test_New.index)\nelse:\n    X_train_Final, X_test_Final = X_train_New, X_test_New\n\n# ---- Train on the reduced training data and test on the reduced testing data ----\nFinal_Model.fit(X_train_Final, y_train)\ny_pred = Final_Model.predict(X_test_Final)\nFinal_Accuracy = accuracy_score(y_test, y_pred)\n\nprint(f\"Final test accuracy: {Final_Accuracy * 100:.2f}%\")", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Final test accuracy: 97.37%\n"}]}, {"cell_type": "markdown", "source": "## 10. Final result\n\nThe final output compares the two all-feature baseline accuracies with the Pearson-selected feature result. The validation score is calculated by cross-validation on the training data, while the final test accuracy is calculated using the held-out test data.\n\nThe summary also reports the selected features, the best redundancy threshold, the best SVC parameters and the shape of the reduced data set.", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "print(\"Selection method: Pearson's correlation\")\nprint(\"Best redundancy threshold:\", Best_Params['selector__threshold'])\nprint(\"Number of selected features:\", len(Selected))\nprint(\"Selected features:\", Selected)\nprint(\"Best SVC parameters:\", Model_Params)\nprint(\"New data set shape:\", New_Data.shape)\nprint(f\"Baseline accuracy (all features, NOT scaled): {Baseline_Accuracy_Unscaled * 100:.2f}%\")\nprint(f\"Baseline accuracy (all features, Standard-scaled): {Baseline_Accuracy_Scaled * 100:.2f}%\")\nprint(f\"Validation score (training CV): {Best_Score * 100:.2f}%\")\nprint(f\"Final test accuracy (selected features): {Final_Accuracy * 100:.2f}%\")", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Selection method: Pearson's correlation\nBest redundancy threshold: 0.8\nNumber of selected features: 15\nSelected features: ['Feature-5', 'Feature-9', 'Feature-10', 'Feature-12', 'Feature-14', 'Feature-15', 'Feature-16', 'Feature-18', 'Feature-19', 'Feature-21', 'Feature-22', 'Feature-25', 'Feature-28', 'Feature-29', 'Feature-30']\nBest SVC parameters: {'C': 1, 'gamma': 'scale', 'kernel': 'rbf'}\nNew data set shape: (569, 16)\nBaseline accuracy (all features, NOT scaled): 63.16%\nBaseline accuracy (all features, Standard-scaled): 96.49%\nValidation score (training CV): 97.58%\nFinal test accuracy (selected features): 97.37%\n"}]}]</script>

const cells=JSON.parse(document.getElementById('data').textContent), packages=["numpy", "pandas", "scikit-learn", "matplotlib", "ipython"], navigation=[["HOME", "../index.html"], ["CONTENTS", "../course_content.html"], ["CONTACT", "../contact.html"]], activeNavigationLabel="HOME";
let worker=null,ready=false,starting=false,req=0,pending=new Map(),codeCells=[],runningAll=false;
const root=document.getElementById('notebook'),statusEl=document.getElementById('status'),statusTextEl=document.getElementById('status-text');
function status(s){
 const message=String(s);
 const lower=message.toLowerCase();
 statusTextEl.textContent=message;

 statusEl.setAttribute('aria-label',message);
 statusEl.classList.remove('idle','busy','ready','error');
 let state='idle';
 if(lower.includes('failed')||lower.includes('error')||lower.includes('fatal')) state='error';
 else if(lower.includes('ready')) state='ready';
 else if(lower.includes('starting')||lower.includes('loading')||lower.includes('initializ')||lower.includes('running')||lower.includes('progress')||lower.includes('preparing')||lower.includes('installing')) state='busy';
 statusEl.classList.add(state);
}
function el(tag,cls){let x=document.createElement(tag);if(cls)x.className=cls;return x}
function renderNavigation(id){
    const bar=document.getElementById(id);
    const activeLabel=String(activeNavigationLabel||'').trim().toLocaleLowerCase();
    bar.replaceChildren();
    for(const item of navigation){
        const label=String(item[0]);
        const link=el('a','nav-ribbon-link');
        link.textContent=label;
        link.href=String(item[1]);
        if(activeLabel && label.trim().toLocaleLowerCase()===activeLabel){
            link.classList.add('active');
            link.setAttribute('aria-current','page');
        }
        bar.appendChild(link);
    }
}
async function copyCode(code,button){const old=button.textContent;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(code)}else{const area=document.createElement('textarea');area.value=code;area.setAttribute('readonly','');area.style.position='fixed';area.style.left='-9999px';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();if(!ok)throw new Error('Browser blocked clipboard access')}button.textContent='Copied!'}catch(err){console.error('Copy failed:',err);button.textContent='Copy failed'}window.setTimeout(()=>{button.textContent=old},1400)}
function markdownSource(c){let s=c.source||'';return s.replace(/!\[([^\]]*)\]\(attachment:([^)]+)\)/g,(m,a,n)=>{let x=c.attachments&&c.attachments[n];if(!x)return m;let mime=Object.keys(x)[0];return '<img alt="'+a.replace(/"/g,'&quot;')+'" src="data:'+mime+';base64,'+x[mime]+'">'});}
function addText(parent,t){if(t===undefined||t===null||t==='')return;let p=el('pre');p.textContent=String(t);parent.appendChild(p)}
function savedOutputs(c,out){if(!true||!c.outputs)return;for(let o of c.outputs){if(o.output_type==='stream')addText(out,o.text);else if(o.output_type==='error')addText(out,(o.ename||'Error')+': '+(o.evalue||'')+'\\n'+(o.traceback||[]).join('\\n'));else if(o.data){let d=o.data;if(d['image/png']||d['image/jpeg']){let im=el('img');im.src='data:'+(d['image/png']?'image/png':'image/jpeg')+';base64,'+(d['image/png']||d['image/jpeg']);out.appendChild(im)}else if(d['image/svg+xml']||d['text/html']){let box=el('div','htmlout');box.innerHTML=DOMPurify.sanitize(d['image/svg+xml']||d['text/html']);out.appendChild(box)}else if(d['text/plain'])addText(out,d['text/plain'])}}}
function render(){let n=0;for(let c of cells){if(c.cell_type==='markdown'){let w=el('section','cell markdown');w.innerHTML=DOMPurify.sanitize(marked.parse(markdownSource(c)));root.appendChild(w)}else if(c.cell_type==='code'){n++;let w=el('section','cell code'),h=el('div','codehead'),indicator=el('span','cell-status');indicator.title='Not executed';indicator.setAttribute('aria-label','Not executed');let lab=el('span','label');lab.textContent=true?'Code Cell '+n:'Python';let b=el('button');b.textContent='Run Cell';b.onclick=()=>runCell(w);let cp=el('button','copy-button');cp.textContent='Copy';cp.title='Copy this code cell to the clipboard';cp.onclick=()=>copyCode(w._ed.getValue(),cp);h.append(indicator,lab,b,cp);w.appendChild(h);let host=el('div','editor');w.appendChild(host);let ed=CodeMirror(host,{value:c.source||'',mode:'python',theme:'material-darker',lineNumbers:true,lineWrapping:true,indentUnit:4,tabSize:4,viewportMargin:Infinity,extraKeys:{'Tab':cm=>cm.replaceSelection('    '),'Shift-Enter':()=>runCell(w)}});ed.setSize(null,'auto');requestAnimationFrame(()=>{ed.setSize(null,'auto');ed.refresh()});let r=el('div','running');r.innerHTML='<span class="spin"></span>Python is running. Please wait; this calculation may take some time.';w.appendChild(r);let o=el('div','output');savedOutputs(c,o);w.appendChild(o);w._ed=ed;w._run=b;w._runbar=r;w._out=o;w._indicator=indicator;codeCells.push(w);root.appendChild(w)}}if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise()}
function workerSource(){return `importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');let py=null,ready=false,out='';async function init(pkgs){postMessage({type:'status',text:'Loading Python runtime...'});py=await loadPyodide();for(let p of pkgs){postMessage({type:'status',text:'Loading '+p+'...'});try{await py.loadPackage(p)}catch(e){postMessage({type:'warning',text:'Could not load '+p+': '+e})}}await py.runPythonAsync("import matplotlib\\nmatplotlib.use('Agg', force=True)");py.setStdout({batched:s=>{out+=s+'\\n'}});py.setStderr({batched:s=>{out+=s+'\\n'}});ready=true;postMessage({type:'ready'})}onmessage=async e=>{let m=e.data;if(m.type==='init'){try{await init(m.packages)}catch(x){postMessage({type:'fatal',text:String(x)})}}else if(m.type==='run'){if(!ready){postMessage({type:'result',id:m.id,error:'Python is not ready'});return}out='';try{let value=await py.runPythonAsync(m.code);let result='';if(value!==undefined&&value!==null){try{result=value.toString()}catch(_){}}let imgs='[]';try{imgs=await py.runPythonAsync("import json, base64, io, matplotlib.pyplot as plt\\nfrom io import BytesIO\\n__imgs=[]\\nfor __n in plt.get_fignums():\\n __b=BytesIO(); plt.figure(__n).savefig(__b,format='png',dpi=120,bbox_inches='tight'); __imgs.append(base64.b64encode(__b.getvalue()).decode('ascii'))\\nplt.close('all')\\njson.dumps(__imgs)")}catch(_){}postMessage({type:'result',id:m.id,stdout:out,result:result,images:JSON.parse(imgs)})}catch(x){postMessage({type:'result',id:m.id,stdout:out,error:String(x),images:[]})}}};`}
function startKernel(){if(ready||starting)return;starting=true;document.getElementById('start').disabled=true;status('Starting Python...');let blob=new Blob([workerSource()],{type:'text/javascript'});worker=new Worker(URL.createObjectURL(blob));worker.onmessage=e=>{let m=e.data;if(m.type==='status')status(m.text);else if(m.type==='warning')console.warn(m.text);else if(m.type==='ready'){ready=true;starting=false;status('Python is ready')}else if(m.type==='fatal'){starting=false;document.getElementById('start').disabled=false;status('Python failed to start');alert(m.text)}else if(m.type==='result')finish(m)};worker.onerror=e=>{starting=false;document.getElementById('start').disabled=false;status('Worker error');alert(e.message)};worker.postMessage({type:'init',packages:packages})}
function setCellState(w,state){if(!w._indicator)return;w._indicator.className='cell-status '+state;let label=state==='complete'?'Execution complete':state==='running'?'Execution in progress':state==='error'?'Execution failed':'Not executed';w._indicator.title=label;w._indicator.setAttribute('aria-label',label)}
function runCell(w){if(!ready){alert('Click Start Python and wait until Python is ready.');return Promise.resolve()}let id=++req;setCellState(w,'running');w._run.disabled=true;w._runbar.classList.add('on');status('Python is running...');return new Promise(resolve=>{pending.set(id,{w,resolve});worker.postMessage({type:'run',id,code:w._ed.getValue()})})}
function finish(m){let p=pending.get(m.id);if(!p)return;pending.delete(m.id);let w=p.w,o=w._out;o.innerHTML='<div class="outtitle">Execution output</div>';addText(o,m.stdout);if(m.result)addText(o,m.result);for(let b of (m.images||[])){let im=el('img');im.src='data:image/png;base64,'+b;o.appendChild(im)}if(m.error){let x=el('pre');x.style.color='#ff9b9b';x.textContent=m.error;o.appendChild(x)}if(!m.stdout&&!m.result&&!(m.images||[]).length&&!m.error)addText(o,'Cell executed successfully (no output).');setCellState(w,m.error?'error':'complete');w._run.disabled=false;w._runbar.classList.remove('on');if(!pending.size)status('Python is ready');p.resolve()}
async function runAll(){if(runningAll)return;if(!ready){alert('Start Python first.');return}runningAll=true;document.getElementById('runall').disabled=true;try{for(let w of codeCells)await runCell(w)}finally{runningAll=false;document.getElementById('runall').disabled=false}}
function restartKernel(){if(worker)worker.terminate();worker=null;for(let p of pending.values()){p.w._run.disabled=false;p.w._runbar.classList.remove('on');setCellState(p.w,'not-run');p.resolve()}pending.clear();for(let w of codeCells){w._run.disabled=false;w._runbar.classList.remove('on');setCellState(w,'not-run')}ready=false;starting=false;runningAll=false;document.getElementById('start').disabled=false;document.getElementById('runall').disabled=false;status('Kernel restarted. All cells are marked as not executed. Click Start Python.')}
document.getElementById('runall').style.display=true?'':'none';document.getElementById('restart').style.display=true?'':'none';renderNavigation('top-navigation');renderNavigation('bottom-navigation');status('Python is not started');render();
</script></body></html>
