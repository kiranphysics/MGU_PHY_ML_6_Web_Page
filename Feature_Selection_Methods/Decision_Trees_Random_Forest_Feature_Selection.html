<script id="data" type="application/json">[{"cell_type": "markdown", "source": "# Embedded Feature Selection: Decision Trees and Random Forest Importance\n\nA **Random Forest** combines many decision trees. It can rank features using **Mean Decrease in Impurity (MDI)** and select a subset of features. This notebook also compares MDI with **permutation importance**.\n\n**Data:** scikit-learn Breast Cancer Wisconsin (Diagnostic) data set: 569 observations, 30 numerical features and two classes. The decision-tree example below is a separate, small illustrative example; its counts are not taken from this data set. No CSV file is created.\n", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "# Program workflow: Random Forest feature importance\n\n1. **Load** the Breast Cancer data set and its class labels.\n2. **Prepare** the feature matrix and preserve a map from generic feature names to the original measurement names.\n3. **Split** the observations into stratified training and test sets (80:20).\n4. **Establish baselines:** evaluate an SVC on all features, first without scaling and then with `StandardScaler`.\n5. **Define the components:** a Random Forest inside `SelectFromModel`, a scaler for the downstream SVC, the SVC classifier and the candidate parameter grid.\n6. **Define functions** to build the pipeline, run cross-validation, extract MDI scores, identify selected features and construct the reduced data set.\n7. **Tune using training data only:** `GridSearchCV` compares importance thresholds and SVC settings with five repeated stratified validation splits. In every split, the Random Forest selector is fitted only on that split's training portion.\n8. **Inspect MDI results:** display the ranked importance scores, the selected features and the reduced data set.\n9. **Compare importance measures:** calculate permutation importance for the fitted Random Forest on the held-out test set. This is descriptive only; it is not used to select features or tune parameters.\n10. **Train and evaluate** a final SVC using the selected features, then summarise the results.\n\n**Important about scaling:** a Random Forest does not require feature scaling. Therefore, the Random Forest selector is placed before `StandardScaler`. The scaler is fitted only on the selected training features because the downstream SVC is sensitive to feature scale. The test set is not used for feature selection or hyperparameter tuning.\n", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## Understanding Decision Trees and Random Forest feature importance\n\n### 1. Decision trees: questions that divide the data\n\nA **decision tree** predicts a class by asking a sequence of questions about the input features. The first question is at the **root**. Each question is a **split**, and its outcomes lead to child nodes. A terminal node is a **leaf**, which gives the predicted class. A split may ask, for example, whether a measured value is less than or equal to a chosen cut-value.\n\n![A small illustrative decision tree with class counts and Gini impurity](attachment:decision_tree_gini_example.png)\n\nAt a node, the tree considers candidate feature-and-cut-value pairs. It chooses a split that reduces class impurity. In a Random Forest, `max_features='sqrt'` restricts the candidate features considered at each split to a random subset of approximately the square root of the number of input features.\n\n### 2. Gini impurity\n\nIf a node contains observations from $K$ classes and the fraction belonging to class $k$ is $p_k$, its **Gini impurity** is\n\n$$\nG=1-\\sum_{k=1}^{K}p_k^2.\n$$\n\n- $G=0$ means the node is **pure**: every observation belongs to one class.\n- The maximum is $1-1/K$, reached when all $K$ classes are equally represented. For two classes, this maximum is $0.5$.\n\n**Example from the illustrative tree:** the root contains 6 observations in one class and 4 in the other. Therefore\n\n$$\nG_{\\rm parent}=1-(0.6^2+0.4^2)=0.48.\n$$\n\nThe labels “sick” and “healthy” in this small diagram are only illustrative; they are not the target labels of the Breast Cancer data set used in the Python program.\n\n### 3. Impurity decrease (gain) of a split\n\nSuppose a parent node $t$ containing $N_t$ observations is divided into left and right child nodes. Let $N_L,N_R$ be the child counts, and let $G_t,G_L,G_R$ be their Gini impurities. The weighted impurity after the split is\n\n$$\nG_{\\rm after}=\\frac{N_L}{N_t}G_L+\\frac{N_R}{N_t}G_R.\n$$\n\nThe **impurity decrease** produced by the split is\n\n$$\n\\Delta G_t=G_t-G_{\\rm after}.\n$$\n\nThe tree prefers a candidate split with a large positive impurity decrease.\n\n**Worked example:** in the root split shown above, the left child has Gini impurity $0.375$ and the right child has Gini impurity approximately $0.278$. Thus\n\n$$\nG_{\\rm after}=\\frac{4}{10}(0.375)+\\frac{6}{10}(0.278)\\approx0.317,\n$$\n\n$$\n\\Delta G=0.480-0.317\\approx0.163.\n$$\n\nThe split reduces the weighted impurity from $0.480$ to approximately $0.317$.\n\n### 4. How a Random Forest works\n\nA single decision tree can fit noise in its training data and overfit. A **Random Forest** builds many trees and makes them different using two sources of randomness:\n\n1. **Bootstrap sampling:** each tree is trained on a sample of the training observations drawn **with replacement**. An observation may appear more than once in a tree's sample, while another observation may be omitted.\n2. **Random feature subsets:** at each split, a tree considers only a randomly chosen subset of the features. In this notebook, `max_features='sqrt'` is used for classification.\n\nFor classification, the trees vote and the majority class is returned. The combination of many varied trees generally reduces the instability of relying on one tree.\n\n![Random Forest: bootstrap samples, separate trees and voting](attachment:random_forest_block_diagram.png)\n\n### 5. Mean Decrease in Impurity (MDI): feature importance\n\nEach time a tree splits on a feature, that split decreases impurity. A feature receives a larger importance when it contributes substantial impurity decreases, especially at nodes containing many observations.\n\nFor feature $j$, its contribution in one tree is\n\n$$\nI_j^{(\\rm tree)}=\\sum_{t:\\,\\text{split on }j}\\frac{N_t}{N}\\,\\Delta G_t,\n$$\n\nwhere $N$ is the number of observations used to train that tree and $N_t$ is the number reaching node $t$. The factor $N_t/N$ gives more weight to a split that affects more observations. With sample weights, the corresponding weighted sample counts are used.\n\nThe tree's feature scores are normalised. The Random Forest combines the tree-level scores across its trees and normalises the resulting importances so that the forest's `feature_importances_` values sum to 1 (when the forest contains informative splits). A larger MDI score means that the feature contributed more to the forest's training impurity reductions; it is not a probability and does not establish causation.\n\n**Small example by hand:** in the illustrative tree, the root split on *Size* has $N_t/N=10/10$ and $\\Delta G\\approx0.163$. Its contribution is approximately $0.163$. The next split on *Texture* occurs in a node containing 6 of the 10 observations. Its gain is\n\n$$\n\\Delta G_{\\rm Texture}=0.278-\\left[\\frac{3}{6}(0)+\\frac{3}{6}(0.444)\\right]\\approx0.056.\n$$\n\nIts weighted contribution is approximately $(6/10)(0.056)=0.033$. Normalising the two contributions gives approximately $0.83$ for *Size* and $0.17$ for *Texture*. This is a hand calculation for the illustrative tree, not the Random Forest result from the Breast Cancer data.\n\n### 6. Selecting features from importance scores\n\nAfter calculating MDI scores, features can be selected in two common ways:\n\n- **Top-$k$ selection:** retain the $k$ features with the largest importance scores.\n- **Threshold selection:** retain the features whose importance scores meet a chosen threshold, for example the mean or median importance.\n\nThe Python implementation in this notebook uses `SelectFromModel` with a Random Forest and compares the thresholds `mean`, `1.25*mean` and `median`. `GridSearchCV` evaluates each candidate threshold together with the SVC settings using training-data cross-validation. It is therefore a **threshold-based implementation**; top-$k$ is introduced as a general alternative, not used in the code below.\n\n![Flow chart of Random Forest MDI feature selection and cross-validation](attachment:random_forest_feature_selection_flowchart.png)\n\n**How to read the flow chart:** the repeated comparison of candidate thresholds and SVC settings is performed automatically by `GridSearchCV`. The best pipeline is refitted on the full training set. The held-out test set is reserved for final evaluation.\n\n### 7. Permutation importance\n\nMDI uses the forest's internal split calculations. **Permutation importance** instead measures how much a fitted model's score falls when the values of one feature are shuffled.\n\nLet $S_{\\rm original}$ be the model score before shuffling, and let $S_{j,r}^{\\rm shuffled}$ be the score after the values of feature $j$ are shuffled in repeat $r$. For $R$ repeats,\n\n$$\nI_j^{(\\rm perm)}=S_{\\rm original}-\\frac{1}{R}\\sum_{r=1}^{R}S_{j,r}^{\\rm shuffled}.\n$$\n\nA large positive value means that shuffling the feature reduces the score, suggesting that the fitted model relies on it. A value near zero suggests little measurable effect under this evaluation. A negative mean can occur because of sampling variation or when shuffling happens to improve the score. Correlated features can mask one another: if one is shuffled, another may still provide similar information.\n\nIn this notebook, permutation importance is calculated for the fitted Random Forest with **accuracy** as the score and 20 shuffles per feature on the held-out test set. These scores are reported for interpretation only; they do not feed back into feature selection or hyperparameter tuning.\n\n### 8. Advantages and limitations\n\n**Advantages**\n- Decision trees and Random Forests do not require feature scaling.\n- Trees can model non-linear relations and interactions between features.\n- MDI gives a score for every feature and can be used for threshold or top-$k$ selection.\n- Bootstrap samples and random feature subsets make the trees less dependent on one another than repeated copies of the same tree.\n\n**Limitations**\n- Results can vary with the random seed and forest settings.\n- Correlated features can share or mask importance.\n- MDI can favour continuous or high-cardinality features because they offer more possible split points.\n- MDI is computed from the training trees and can be misleading if the forest overfits.\n- Permutation importance depends on the evaluation data and scoring metric; correlated features can make individual permutation scores look small.\n\n### 9. Practical algorithm used in this notebook\n\n1. Split the data into training and held-out test sets before selection.\n2. For each cross-validation training split, fit a Random Forest on that split's training observations.\n3. Calculate the weighted impurity decreases contributed by each feature in each tree, normalise tree importances and combine them to obtain MDI scores.\n4. Apply a candidate importance threshold with `SelectFromModel`.\n5. Standardise the retained features and fit an SVC.\n6. Use stratified validation scores in `GridSearchCV` to compare the candidate thresholds and SVC hyperparameters.\n7. Refit the best pipeline on all training observations and identify its selected features.\n8. Calculate permutation importance on the held-out test set for interpretation only.\n9. Train/evaluate the final SVC using the selected features and report its test accuracy.\n\nThe feature selector and scaler are inside the pipeline, so they are refitted within each cross-validation training split. This prevents information from a validation split or the final test set from leaking into feature selection or scaling.\n", "attachments": {"decision_tree_gini_example.png": {"image/png": "iVBORw0KGgoAAAANSUhEUgAACaEAAAUYCAYAAAC74YwpAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAk6QAAJOkBUCTn+AABAABJREFUeJzs3Xd01MUaxvEnvVdICL333pEiIEWKCkhTFEXF3rCLgAqIKDZQRBEBK9JUUJoISK/SW+gtEAiE9L7J3j+8riybukl2U76fczwnM78p72aTXG54mHEwGo1GAQAAAAAAAAAAAAAAAABgBUd7FwAAAAAAAAAAAAAAAAAAKL4IoQEAAAAAAAAAAAAAAAAArEYIDQAAAAAAAAAAAAAAAABgNUJoAAAAAAAAAAAAAAAAAACrEUIDAAAAAAAAAAAAAAAAAFiNEBoAAAAAAAAAAAAAAAAAwGqE0AAAAAAAAAAAAAAAAAAAViOEBgAAAAAAAAAAAAAAAACwGiE0AAAAAAAAAAAAAAAAAIDVCKEBAAAAAAAAAAAAAAAAAKxGCA0AAAAAAAAAAAAAAAAAYDVCaAAAAAAAAAAAAAAAAAAAqxFCAwAAAAAAAAAAAAAAAABYjRAaAAAAAAAAAAAAAAAAAMBqhNAAAAAAAAAAAAAAAAAAAFYjhAYAAAAAAAAAAAAAAAAAsBohNAAAAAAAAAAAAAAAAACA1QihAQAAAAAAAAAAAAAAAACsRggNAAAAAAAAAAAAAAAAAGA1QmgAAAAAAAAAAAAAAAAAAKsRQgMAAAAAAAAAAAAAAAAAWI0QGgAAAAAAAAAAAAAAAADAaoTQAAAAAAAAAAAAAAAAAABWI4QGAAAAAAAAAAAAAAAAALAaITQAAAAAAAAAAAAAAAAAgNUIoQEAAAAAAAAAAAAAAAAArEYIDQAAAAAAAAAAAAAAAABgNUJoAAAAAAAAAAAAAAAAAACrEUIDAAAAAAAAAAAAAAAAAFiNEBoAAAAAAAAAAAAAAAAAwGqE0AAAAAAAAAAAAAAAAAAAViOEBgAAAAAAAAAAAAAAAACwGiE0AAAAAAAAAAAAAAAAAIDVCKEBAAAAAAAAAAAAAAAAAKxGCA0AAAAAAAAAAAAAAAAAYDVCaAAAAAAAAAAAAAAAAAAAqxFCAwAAAAAAAAAAAAAAAABYjRAaAAAAAAAAAAAAAAAAAMBqhNAAAAAAAAAAAAAAAAAAAFYjhAYAAAAAAAAAAAAAAAAAsBohNAAAAAAAAAAAAAAAAACA1QihAQAAAAAAAAAAAAAAAACsRggNAAAAAAAAAAAAAAAAAGA1QmgAAAAAAAAAAAAAAAAAAKsRQgMAAAAAAAAAAAAAAAAAWI0QGgAAAAAAAAAAAAAAAADAaoTQAAAAAAAAAAAAAAAAAABWI4QGAAAAAAAAAAAAAAAAALAaITQAAAAAAAAAAAAAAAAAgNUIoQEAAAAAAAAAAAAAAAAArEYIDQAAAAAAAAAAAAAAAABgNUJoAAAAAAAAAAAAAAAAAACrEUIDAAAAAAAAAAAAAAAAAFiNEBoAAAAAAAAAAAAAAAAAwGqE0AAAAAAAAAAAAAAAAAAAViOEBgAAAAAAAAAAAAAAAACwGiE0AAAAAAAAAAAAAAAAAIDVCKEBAAAAAAAAAAAAAAAAAKxGCA0AAAAAAAAAAAAAAAAAYDVCaAAAAAAAAAAAAAAAAAAAqxFCAwAAAAAAAAAAAAAAAABYjRAaAAAAAAAAAAAAAAAAAMBqhNAAAAAAAAAAAAAAAAAAAFYjhAYAAAAAAAAAAAAAAAAAsBohNAAAAAAAAAAAA iIiIiIiIiIiIiIiIyAAzuEhEREREREREREREREREZAAZ3iYiIiIiIiIiIiIiIiIgMwP8BOKko4eGSh3AAAAAASUVORK5CYII="}}, "outputs": []}, {"cell_type": "markdown", "source": "## 1. Load the dataset\n\nThe **Breast Cancer Wisconsin (Diagnostic)** data set is included in `sklearn.datasets`. It contains 569 observations, 30 numerical measurements and two classes: malignant and benign.\n\n**New variables**\n- `SKL_Breast_Cancer_Data_Set`: the loaded scikit-learn data set.\n- `X`: a DataFrame containing the 30 numerical input features.\n- `y`: the target labels (`0 = malignant`, `1 = benign`).\n\nThe small decision-tree illustration in the theory section is a separate hypothetical example; the Python program uses the actual data described here.\n", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "import pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport io, base64\nfrom sklearn.datasets import load_breast_cancer\nfrom sklearn.model_selection import train_test_split\n\nSKL_Breast_Cancer_Data_Set = load_breast_cancer()\n\nX = pd.DataFrame(\n    SKL_Breast_Cancer_Data_Set.data,\n    columns=SKL_Breast_Cancer_Data_Set.feature_names\n)\ny = pd.Series(SKL_Breast_Cancer_Data_Set.target, name='Target')\n\nprint(\"Dataset shape:\", X.shape)\nprint(\"Number of observations:\", X.shape[0])\nprint(\"Number of numerical features:\", X.shape[1])\nprint(\"Target classes:\", dict(enumerate(SKL_Breast_Cancer_Data_Set.target_names)))\nprint(\"\\nClass distribution:\")\nprint(y.map({0: 'malignant', 1: 'benign'}).value_counts().to_string())", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Dataset shape: (569, 30)\nNumber of observations: 569\nNumber of numerical features: 30\nTarget classes: {0: 'malignant', 1: 'benign'}\n\nClass distribution:\nbenign       357\nmalignant    212\n"}]}, {"cell_type": "markdown", "source": "## 2. Prepare features and target\n\nThe original diagnostic measurement names are saved in `Original_Feature_Names`. The columns of `X` are then renamed `Feature-1`, `Feature-2`, and so on, to keep the program structure reusable. `Feature_Name_Map` records the link between each generic name and its original measurement name. The target `y` is not renamed or modified.\n", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "# Preserve original measurement names before renaming the columns\nOriginal_Feature_Names = list(X.columns)\n\n# Rename features as Feature-1, Feature-2, ...\nX_columns = [\"Feature-\" + str(i + 1) for i in range(X.shape[1])]\nX.columns = X_columns\n\nFeature_Name_Map = pd.DataFrame({\n    'Feature': X_columns,\n    'Original measurement': Original_Feature_Names\n})\n\nprint(\"Feature-name mapping (first 10 rows):\")\nprint(Feature_Name_Map.head(10).to_string(index=False))\nprint(\"\\nTarget encoding: 0 = malignant, 1 = benign\")", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Feature-name mapping (first 10 rows):\n   Feature   Original measurement\n Feature-1            mean radius\n Feature-2           mean texture\n Feature-3         mean perimeter\n Feature-4              mean area\n Feature-5        mean smoothness\n Feature-6       mean compactness\n Feature-7         mean concavity\n Feature-8    mean concave points\n Feature-9          mean symmetry\nFeature-10 mean fractal dimension\n\nTarget encoding: 0 = malignant, 1 = benign\n"}]}, {"cell_type": "markdown", "source": "## 3. Train / test split\n\nThe data are divided into 80% training and 20% held-out test observations. `stratify=y` preserves the class proportions in both sets. The test set is reserved for final evaluation and the descriptive permutation-importance calculation; it is not used to fit the selector, choose an importance threshold or tune the SVC.\n", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "X_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=0.20, random_state=42, shuffle=True, stratify=y\n)\n\nprint(\"Complete dataset:\", X.shape)\nprint(\"Training features:\", X_train.shape)\nprint(\"Testing features:\", X_test.shape)\nprint(\"\\nTraining class distribution:\")\nprint(y_train.map({0: 'malignant', 1: 'benign'}).value_counts().to_string())", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Complete dataset: (569, 30)\nTraining features: (455, 30)\nTesting features: (114, 30)\n\nTraining class distribution:\nbenign       285\nmalignant    170\n"}]}, {"cell_type": "markdown", "source": "## 4. Baselines: SVC using all features\n\nBefore feature selection, we measure an SVC using all 30 features and a fixed set of SVC parameters. This first baseline uses the original, unscaled measurements. Because the features have very different numerical ranges, an unscaled SVC is expected to be sensitive to those ranges. The next cell repeats the baseline after standardisation. These are reference baselines, not separately hyperparameter-tuned models.\n", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "from sklearn.svm import SVC\nfrom sklearn.metrics import accuracy_score\n\nBaseline_Params = {'C': 0.25, 'gamma': 'auto', 'kernel': 'rbf'}\n\n# Baseline 1: all features, NOT scaled\nBaseline_Model_Unscaled = SVC(**Baseline_Params)\nBaseline_Model_Unscaled.fit(X_train, y_train)\ny_pred_unscaled = Baseline_Model_Unscaled.predict(X_test)\nBaseline_Accuracy_Unscaled = accuracy_score(y_test, y_pred_unscaled)\n\nprint(\"Baseline SVC (all features, not scaled)\")\nprint(f\"Test accuracy: {Baseline_Accuracy_Unscaled * 100:.2f}%\")", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Baseline SVC (all features, not scaled)\nTest accuracy: 63.16%\n"}]}, {"cell_type": "markdown", "source": "### 4.2 All features, Standard-scaled\n\n`StandardScaler` learns the mean and standard deviation from the **training data only**. It then applies the same transformation to the test data. Scaling is important for the SVC baseline because distance and margin calculations are affected by feature scale. Decision trees and Random Forests do not require this scaling.\n", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "from sklearn.preprocessing import StandardScaler\n\nBaseline_Scaler = StandardScaler()\nX_train_Scaled = Baseline_Scaler.fit_transform(X_train)\nX_test_Scaled = Baseline_Scaler.transform(X_test)\n\nBaseline_Model_Scaled = SVC(**Baseline_Params)\nBaseline_Model_Scaled.fit(X_train_Scaled, y_train)\ny_pred_scaled = Baseline_Model_Scaled.predict(X_test_Scaled)\nBaseline_Accuracy_Scaled = accuracy_score(y_test, y_pred_scaled)\n\nprint(\"Baseline SVC (all features, Standard-scaled)\")\nprint(f\"Test accuracy: {Baseline_Accuracy_Scaled * 100:.2f}%\")", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Baseline SVC (all features, Standard-scaled)\nTest accuracy: 96.49%\n"}]}, {"cell_type": "markdown", "source": "## 5. Define the components (change only this cell for other methods)\n\nThis cell defines the method-specific components used by the common pipeline.\n\n- **`RF_Estimator`**: a `RandomForestClassifier` with 200 trees, Gini impurity, bootstrap sampling and `max_features='sqrt'`. Thus each tree is trained using a bootstrap sample, and each split considers a random subset of features.\n- **`Selector`**: `SelectFromModel` fits the Random Forest and uses its MDI values (`feature_importances_`) to retain features meeting the chosen threshold.\n- **`Scaler`**: `StandardScaler()` is placed **after** feature selection. The forest does not need scaling, but the downstream SVC does.\n- **`Model`**: `SVC()` is the classifier evaluated using the selected features.\n- **`Param_Grid`**: the grid compares the candidate MDI thresholds and SVC parameters. `GridSearchCV` chooses the combination with the best mean stratified validation accuracy.\n\n**Important scikit-learn functions and parameters**\n- `RandomForestClassifier(...)` builds an ensemble of decision trees.\n- `bootstrap=True` samples training observations with replacement for each tree.\n- `max_features='sqrt'` makes each split consider a random subset of approximately $\\sqrt{m}$ features for classification.\n- `SelectFromModel(estimator, threshold)` retains features whose importance scores meet the threshold.\n- `get_support()` returns a Boolean mask indicating the retained features.\n- `selector__threshold` addresses the selector threshold in the pipeline; `model__C`, `model__kernel` and `model__gamma` address SVC settings.\n", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "from sklearn.ensemble import RandomForestClassifier\nfrom sklearn.feature_selection import SelectFromModel\n\n# Random Forest: no feature scaling is required before the selector.\n# Each tree uses bootstrap rows; each split considers a random sqrt(m) feature subset.\nRF_Estimator = RandomForestClassifier(\n    n_estimators=200,\n    criterion='gini',\n    bootstrap=True,\n    max_features='sqrt',\n    random_state=42,\n    n_jobs=1\n)\n\nSelector = SelectFromModel(\n    estimator=RF_Estimator,\n    threshold='mean'\n)\n\n# Scaling is applied AFTER selection, for the downstream SVC\nScaler = StandardScaler()\nModel = SVC()\n\n# Candidate importance thresholds; mean and median are common choices\nImportance_Thresholds = ['mean', '1.25*mean', 'median']\nParam_Grid = [\n    {\n        'selector__threshold': Importance_Thresholds,\n        'model__C': [0.1, 1, 10],\n        'model__kernel': ['linear']\n    },\n    {\n        'selector__threshold': Importance_Thresholds,\n        'model__C': [0.1, 1, 10],\n        'model__kernel': ['rbf'],\n        'model__gamma': ['scale']\n    }\n]\n\nNumber_Of_Combinations = sum(\n    np.prod([len(v) for v in Grid.values()]) for Grid in Param_Grid\n)\n\nprint(\"Selector:\", Selector)\nprint(\"Random Forest estimator:\", RF_Estimator)\nprint(\"Scaler:\", Scaler)\nprint(\"Downstream classifier:\", Model)\nprint(\"Parameter combinations:\", Number_Of_Combinations)", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Selector: SelectFromModel(estimator=RandomForestClassifier(n_estimators=200, n_jobs=1,\n                                                 random_state=42),\n                threshold='mean')\nRandom Forest estimator: RandomForestClassifier(n_estimators=200, n_jobs=1, random_state=42)\nScaler: StandardScaler()\nDownstream classifier: SVC()\nParameter combinations: 18\n"}]}, {"cell_type": "markdown", "source": "## 6. Define the functions\n\nThe following user-defined functions organise pipeline construction, cross-validation, feature-importance extraction and reduced-data creation.\n\n### User-defined functions\n\n**`Build_Pipeline_Model(...)`** creates the pipeline in this order: Random Forest feature selection → standard scaling → SVC classification. The pipeline is fitted inside each cross-validation training split, so the selector and scaler never learn from that split's validation observations.\n\n**`Get_Selected_Features(...)`** uses `get_support()` to return the names of the selected input columns.\n\n**`Get_Score_Table(...)`** extracts the fitted Random Forest's MDI values from `feature_importances_` and records whether each feature passed the selected threshold.\n\n**`Select_Features(...)`** returns a copy of a DataFrame containing only the requested feature columns.\n\n### Important built-in functions\n- `Pipeline(steps)` keeps feature selection, scaling and classification together, preventing information leakage during cross-validation.\n- `StratifiedShuffleSplit(...)` creates repeated random train/validation splits while preserving class proportions. It is a repeated stratified hold-out scheme, not ordinary non-overlapping $k$-fold cross-validation.\n- `GridSearchCV(...)` evaluates the candidate threshold and SVC settings. With `refit=True`, `best_estimator_` is refitted on all the training observations after the search.\n- `feature_importances_` provides the fitted forest's MDI scores; `get_support()` provides the selected-feature mask.\n", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "from sklearn.base import clone\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.model_selection import GridSearchCV, StratifiedShuffleSplit\n\n\ndef Build_Pipeline_Model(X_train, y_train, Selector, Scaler, Model, Param_Grid,\n                         N_Splits=5, Test_Size=0.2, Random_State=42):\n    # The forest selector uses original feature scales; scaling follows selection.\n    Steps = [\n        ('selector', Selector),\n        ('scaler', Scaler if Scaler is not None else 'passthrough'),\n        ('model', Model)\n    ]\n    Pipe = Pipeline(Steps)\n\n    # Five repeated random train/validation splits; preserve class proportions.\n    # This is StratifiedShuffleSplit, not non-overlapping StratifiedKFold.\n    SSP = StratifiedShuffleSplit(\n        n_splits=N_Splits, test_size=Test_Size, random_state=Random_State\n    )\n\n    Grid_Search = GridSearchCV(\n        estimator=Pipe,\n        param_grid=Param_Grid,\n        cv=SSP,\n        scoring='accuracy',\n        n_jobs=1,\n        verbose=1,\n        refit=True,  # refit the best pipeline on all training observations\n        error_score='raise'\n    )\n    Grid_Search.fit(X_train, y_train)\n\n    return (\n        Grid_Search.best_estimator_,\n        Grid_Search.best_params_,\n        Grid_Search.best_score_\n    )\n\n\ndef Get_Selected_Features(Trained_Pipeline, Columns):\n    # Return feature names selected by SelectFromModel\n    Mask = Trained_Pipeline.named_steps['selector'].get_support()\n    return list(Columns[Mask])\n\n\ndef Get_Score_Table(Trained_Pipeline, Columns):\n    # Extract the MDI scores from the fitted Random Forest estimator\n    Fitted_Selector = Trained_Pipeline.named_steps['selector']\n    Importance_Scores = Fitted_Selector.estimator_.feature_importances_\n\n    Table = pd.DataFrame({\n        'Feature': list(Columns),\n        'MDI importance': Importance_Scores,\n        'Selected': Fitted_Selector.get_support()\n    })\n    return Table.sort_values(\n        'MDI importance', ascending=False\n    ).reset_index(drop=True)\n\n\ndef Select_Features(Data, Selected_Features):\n    # Return an independent copy containing only selected features\n    return Data[Selected_Features].copy()", "attachments": {}, "outputs": []}, {"cell_type": "markdown", "source": "## 7. Random Forest feature selection and hyperparameter tuning (training data only)\n\n`Build_Pipeline_Model` receives only `X_train` and `y_train`. For each of the five repeated stratified shuffle-splits, the pipeline performs the following operations using that split's training observations:\n\n1. fits the Random Forest and calculates MDI importance scores;\n2. selects features using the candidate importance threshold;\n3. standardises the selected features;\n4. fits the SVC and scores it on that split's validation observations.\n\n`GridSearchCV` compares all candidate thresholds and SVC parameter combinations. It then refits the best pipeline on the complete training set. The held-out test set is not used in this search. Because the selector and scaler are both pipeline steps, neither is fitted on validation data before scoring.\n", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "Trained_Pipeline, Best_Params, Best_Score = Build_Pipeline_Model(\n    X_train, y_train, Selector, Scaler, Model, Param_Grid\n)\n\nprint(\"Best parameters:\", Best_Params)\nprint(f\"Best validation score: {Best_Score * 100:.2f}%\")\nprint(\"Selected importance threshold:\", Best_Params['selector__threshold'])", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Fitting 5 folds for each of 18 candidates, totalling 90 fits\nBest parameters: {'model__C': 10, 'model__gamma': 'scale', 'model__kernel': 'rbf', 'selector__threshold': 'median'}\nBest validation score: 97.80%\nSelected importance threshold: median\n"}]}, {"cell_type": "markdown", "source": "## 8. MDI scores and selected features\n\n`Score_Table` lists all features in descending order of their Mean Decrease in Impurity score. The `Selected` column indicates whether each feature's importance meets the best threshold selected by cross-validation. MDI values are relative importance scores for the fitted forest; they are not probabilities, and they do not prove that a feature causes the target.\n", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "# ---- MDI score of every feature (largest first) ----\nScore_Table = Get_Score_Table(Trained_Pipeline, X_train.columns)\nprint(Score_Table.to_string(index=False, float_format=lambda v: f\"{v:.6f}\"))\n\n# Plot the 12 features with the largest MDI scores\nTop_MDI = Score_Table.head(12).sort_values('MDI importance', ascending=True)\nplt.figure(figsize=(9, 6))\nplt.barh(Top_MDI['Feature'], Top_MDI['MDI importance'])\nplt.xlabel('Mean Decrease in Impurity (MDI)')\nplt.ylabel('Feature')\nplt.title('Top 12 Random Forest Feature Importances')\nplt.tight_layout()\nplt.show()", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "   Feature  MDI importance  Selected\nFeature-23        0.133100      True\nFeature-24        0.128052      True\nFeature-28        0.108107      True\n Feature-8        0.094414      True\nFeature-21        0.090639      True\n Feature-1        0.058662      True\n Feature-3        0.055242      True\n Feature-4        0.049938      True\n Feature-7        0.046207      True\nFeature-27        0.035357      True\nFeature-14        0.034368      True\n Feature-6        0.018094      True\nFeature-22        0.017869      True\nFeature-26        0.014481      True\n Feature-2        0.014317      True\nFeature-25        0.014026     False\nFeature-11        0.013454     False\nFeature-29        0.009570     False\nFeature-13        0.008138     False\nFe : []}, {"cell_type": "code", "source": "from sklearn.inspection import permutation_importance\n\n# Extract the Random Forest fitted by the best feature-selection pipeline\nFitted_RF = Trained_Pipeline.named_steps['selector'].estimator_\n\nRF_Test_Predictions = Fitted_RF.predict(X_test)\nRF_Test_Accuracy = accuracy_score(y_test, RF_Test_Predictions)\n\nPermutation_Result = permutation_importance(\n    Fitted_RF,\n    X_test,\n    y_test,\n    scoring='accuracy',\n    n_repeats=20,\n    random_state=42,\n    n_jobs=1\n)\n\nPermutation_Table = pd.DataFrame({\n    'Feature': list(X.columns),\n    'Permutation importance mean': Permutation_Result.importances_mean,\n    'Permutation importance std': Permutation_Result.importances_std\n}).sort_values(\n    'Permutation importance mean', ascending=False\n).reset_index(drop=True)\n\nprint(f\"Random Forest test accuracy (all features): {RF_Test_Accuracy * 100:.2f}%\")\nprint(\"\\nPermutation importance (largest accuracy decrease first):\")\nprint(Permutation_Table.to_string(index=False, float_format=lambda v: f\"{v:.6f}\"))\n\n# Plot the 12 features with the largest permutation importance\nTop_Permutation = Permutation_Table.head(12).sort_values(\n    'Permutation importance mean', ascending=True\n)\nplt.figure(figsize=(9, 6))\nplt.barh(\n    Top_Permutation['Feature'],\n    Top_Permutation['Permutation importance mean'],\n    xerr=Top_Permutation['Permutation importance std'],\n    capsize=3\n)\nplt.xlabel('Mean decrease in test accuracy after shuffling')\nplt.ylabel('Feature')\nplt.title('Top 12 Permutation Importances')\nplt.tight_layout()\nplt.show()", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Random Forest test accuracy (all features): 95.61%\n\nPermutation importance (largest accuracy decrease first):\n   Feature  Permutation importance mean  Permutation importance std\nFeature-23                     0.010088                    0.009314\nFeature-24                     0.009649 tures selected by the best pipeline. `StandardScaler` is fitted on `X_train_New` only, and the fitted transformation is applied to `X_test_New`. The test data therefore do not influence either feature selection or scaling.\n", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "# ---- Extract the best SVC parameters (remove the \"model__\" prefix) ----\nModel_Params = {\n    Key[len('model__'):]: Value\n    for Key, Value in Best_Params.items()\n    if Key.startswith('model__')\n}\nFinal_Model = clone(Model).set_params(**Model_Params)\n\n# ---- Scale selected features using training observations only ----\nif Scaler is not None:\n    Final_Scaler = clone(Scaler)\n    X_train_Final = pd.DataFrame(\n        Final_Scaler.fit_transform(X_train_New),\n        columns=X_train_New.columns,\n        index=X_train_New.index\n    )\n    X_test_Final = pd.DataFrame(\n        Final_Scaler.transform(X_test_New),\n        columns=X_test_New.columns,\n        index=X_test_New.index\n    )\nelse:\n    X_train_Final, X_test_Final = X_train_New, X_test_New\n\n# ---- Train and evaluate the final classifier on selected features ----\nFinal_Model.fit(X_train_Final, y_train)\ny_pred = Final_Model.predict(X_test_Final)\nFinal_Accuracy = accuracy_score(y_test, y_pred)\n\nprint(\"Final model:\", Final_Model)\nprint(f\"Final test accuracy: {Final_Accuracy * 100:.2f}%\")", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Final model: SVC(C=10)\nFinal test accuracy: 95.61%\n"}]}, {"cell_type": "markdown", "source": "## 11. Final result\n\nThe final summary compares the two all-feature SVC baselines with the SVC trained using the Random Forest-selected features. It also reports the Random Forest's test accuracy and the best cross-validation score obtained from the training data.\n\nRemember:\n- **MDI importance** is based on weighted impurity decreases in the forest's trees.\n- **Permutation importance** is based on the fall in a chosen model score after a feature is shuffled.\n- MDI and permutation importance answer different questions; neither establishes causation.\n- The held-out test set is used only for final performance reporting and descriptive permutation importance, not for selecting features or hyperparameters.\n", "attachments": {}, "outputs": []}, {"cell_type": "code", "source": "print(\"Selection method: Random Forest feature importance (MDI / SelectFromModel)\")\nprint(\"Dataset: Breast Cancer Wisconsin (Diagnostic)\")\nprint(\"Best MDI threshold:\", Best_Params['selector__threshold'])\nprint(\"Number of selected features:\", len(Selected), \"out of\", X.shape[1])\nprint(\"Selected features:\", Selected)\nprint(\"Selected original measurements:\", Selected_Feature_Map['Original measurement'].tolist())\nprint(\"Best SVC parameters:\", Model_Params)\nprint(\"Reduced data set shape (in memory):\", New_Data.shape)\nprint(f\"Baseline accuracy (all features, NOT scaled): {Baseline_Accuracy_Unscaled * 100:.2f}%\")\nprint(f\"Baseline accuracy (all features, Standard-scaled): {Baseline_Accuracy_Scaled * 100:.2f}%\")\nprint(f\"Random Forest test accuracy (all features): {RF_Test_Accuracy * 100:.2f}%\")\nprint(f\"Validation score (training CV): {Best_Score * 100:.2f}%\")\nprint(f\"Final SVC test accuracy (selected features): {Final_Accuracy * 100:.2f}%\")", "attachments": {}, "outputs": [{"output_type": "stream", "name": "stdout", "text": "Selection method: Random Forest feature importance (MDI / SelectFromModel)\nDataset: Breast Cancer Wisconsin (Diagnostic)\nBest MDI threshold: median\nNumber of selected features: 15 out of 30\nSelected features: ['Feature-1', 'Feature-2', 'Feature-3', 'Feature-4', 'Feature-6', 'Feature-7', 'Feature-8', 'Feature-14', 'Feature-21', 'Feature-22', 'Feature-23', 'Feature-24', 'Feature-26', 'Feature-27', 'Feature-28']\nSelected original measurements: ['mean radius', 'mean texture', 'mean perimeter', 'mean area', 'mean compactness', 'mean concavity', 'mean concave points', 'area error', 'worst radius', 'worst texture', 'worst perimeter', 'worst area', 'worst compactness', 'worst concavity', 'worst concave points']\nBest SVC parameters: {'C': 10, 'gamma': 'scale', 'kernel': 'rbf'}\nReduced data set shape (in memory): (569, 16)\nBaseline accuracy (all features, NOT scaled): 63.16%\nBaseline accuracy (all features, Standard-scaled): 96.49%\nRandom Forest test accuracy (all features): 95.61%\nValidation score (training CV): 97.80%\nFinal SVC test accuracy (selected features): 95.61%\n"}]}]</script>

function status(s){

function workerSource(){return `importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');let py=null,ready=false,out='';async function init(pkgs){postMessage({type:'status',text:'Loading Python runtime...'});py=await loadPyodide();for(let p of pkgs){postMessage({type:'status',text:'Loading '+p+'...'});try{await py.loadPackage(p)}catch(e){postMessage({type:'warning',text:'Could not load '+p+': '+e})}}await py.runPythonAsync("import matplotlib\\nmatplotlib.use('Agg', force=True)");py.setStdout({batched:s=>{out+=s+'\\n'}});py.setStderr({batched:s=>{out+=s+'\\n'}});ready=true;postMessage({type:'ready'})}onmessage=async e=>{let m=e.data;if(m.type==='init'){try{await init(m.packages)}catch(x){postMessage({type:'fatal',text:String(x)})}}else if(m.type==='run'){if(!ready){postMessage({type:'result',id:m.id,error:'Python is not ready'});return}out='';try{let value=await py.runPythonAsync(m.code);let result='';if(value!==undefined&&value!==null){try{result=value.toString()}catch(_){}}let imgs='[]';try{imgs=await py.runPythonAsync("import json, base64, io, matplotlib.pyplot as plt\\nfrom io import BytesIO\\n__imgs=[]\\nfor __n in plt.get_fignums():\\n __b=BytesIO(); plt.figure(__n).savefig(__b,format='png',dpi=120,bbox_inches='tight'); __imgs.append(base64.b64encode(__b.getvalue()).decode('ascii'))\\nplt.close('all')\\njson.dumps(__imgs)")}catch(_){}postMessage({type:'result',id:m.id,stdout:out,result:result,images:JSON.parse(imgs)})}catch(x){postMessage({type:'result',id:m.id,stdout:out,error:String(x),images:[]})}}};`}
function startKernel(){if(ready||starting)return;starting=true;document.getElementById('start').disabled=true;status('Starting Python...');let blob=new Blob([workerSource()],{type:'text/javascript'});worker=new Worker(URL.createObjectURL(blob));worker.onmessage=e=>{let m=e.data;if(m.type==='status')status(m.text);else if(m.type==='warning')console.warn(m.text);else if(m.type==='ready'){ready=true;starting=false;status('Python is ready')}else if(m.type==='fatal'){starting=false;document.getElementById('start').disabled=false;status('Python failed to start');alert(m.text)}else if(m.type==='result')finish(m)};worker.onerror=e=>{starting=false;document.getElementById('start').disabled=false;status('Worker error');alert(e.message)};worker.postMessage({type:'init',packages:packages})}
function setCellState(w,state){if(!w._indicator)return;w._indicator.className='cell-status '+state;let label=state==='complete'?'Execution complete':state==='running'?'Execution in progress':state==='error'?'Execution failed':'Not executed';w._indicator.title=label;w._indicator.setAttribute('aria-label',label)}
function runCell(w){if(!ready){alert('Click Start Python and wait until Python is ready.');return Promise.resolve()}let id=++req;setCellState(w,'running');w._run.disabled=true;w._runbar.classList.add('on');status('Python is running...');return new Promise(resolve=>{pending.set(id,{w,resolve});worker.postMessage({type:'run',id,code:w._ed.getValue()})})}
function finish(m){let p=pending.get(m.id);if(!p)return;pending.delete(m.id);let w=p.w,o=w._out;o.innerHTML='<div class="outtitle">Execution output</div>';addText(o,m.stdout);if(m.result)addText(o,m.result);for(let b of (m.images||[])){let im=el('img');im.src='data:image/png;base64,'+b;o.appendChild(im)}if(m.error){let x=el('pre');x.style.color='#ff9b9b';x.textContent=m.error;o.appendChild(x)}if(!m.stdout&&!m.result&&!(m.images||[]).length&&!m.error)addText(o,'Cell executed successfully (no output).');setCellState(w,m.error?'error':'complete');w._run.disabled=false;w._runbar.classList.remove('on');if(!pending.size)status('Python is ready');p.resolve()}
async function runAll(){if(runningAll)return;if(!ready){alert('Start Python first.');return}runningAll=true;document.getElementById('runall').disabled=true;try{for(let w of codeCells)await runCell(w)}finally{runningAll=false;document.getElementById('runall').disabled=false}}
function restartKernel(){if(worker)worker.terminate();worker=null;for(let p of pending.values()){p.w._run.disabled=false;p.w._runbar.classList.remove('on');setCellState(p.w,'not-run');p.resolve()}pending.clear();for(let w of codeCells){w._run.disabled=false;w._runbar.classList.remove('on');setCellState(w,'not-run')}ready=false;starting=false;runningAll=false;document.getElementById('start').disabled=false;document.getElementById('runall').disabled=false;status('Kernel restarted. All cells are marked as not executed. Click Start Python.')}
document.getElementById('runall').style.display=true?'':'none';document.getElementById('restart').style.display=true?'':'none';renderNavigation('top-navigation');renderNavigation('bottom-navigation');status('Python is not started');render();
</script></body></html>
